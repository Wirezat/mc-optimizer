<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MC Optimizer — Mods</title>
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/accent.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <link rel="stylesheet" href="/static/css/layout.css" />
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/utils.js"></script>
  <script>
    (function(){
      const s = localStorage.getItem('theme');
      if (s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark');
    })();
  </script>
  <style>
    .mod-expand { display: none; }
    .mod-expand.open { display: table-row; }
    .mod-expand > td {
      padding: 16px 20px;
      background: var(--bg-page);
      border-bottom: 1px solid var(--border);
    }
    .mod-row { cursor: pointer; user-select: none; }
    .mod-row:hover td { background: var(--row-hover); }
    .mod-row.expanded td { background: var(--row-hover); }
    .expand-arrow { color: var(--text-faint); font-size: 11px; transition: transform 0.15s; display: inline-block; }
    .mod-row.expanded .expand-arrow { transform: rotate(90deg); }

    .expand-sections {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .expand-section-label {
      font-size: var(--text-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-faint);
      margin-bottom: 8px;
    }
    .mini-table { width: 100%; border-collapse: collapse; }
    .mini-table th {
      font-size: var(--text-xs);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-faint);
      padding: 4px 8px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .mini-table td {
      font-size: var(--text-sm);
      padding: 5px 8px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .mini-table tr:last-child td { border-bottom: none; }
    .mini-table-empty { font-size: var(--text-sm); color: var(--text-faint); padding: 8px 0; }
    .pill-system {
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--text-faint);
      background: var(--bg-page);
      border: 1px solid var(--border);
      padding: 1px 7px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
<div class="app-shell">

  <header class="header">
    <a class="header-brand" href="/saves">
      <div class="header-logo">⚙️</div>
      <span>MC Optimizer</span>
    </a>
    <div class="header-right">
      <button class="btn btn-ghost btn-sm" onclick="toggleTheme()" id="theme-btn">🌙</button>
      <div class="user-menu" id="user-menu">
        <button class="user-menu-trigger" id="user-menu-trigger">
          <div class="avatar">?</div>
          <span class="username">…</span>
          <span class="chevron">▾</span>
        </button>
        <div class="user-dropdown" id="user-dropdown"></div>
      </div>
    </div>
  </header>

  <div class="app-body">
    <nav class="sidebar"></nav>

    <main class="main">
      <div class="page">

        <div class="page-header">
          <div>
            <div class="page-title">Mods</div>
            <div class="page-subtitle">Manage mods and browse their machines and items</div>
          </div>
          <button class="btn btn-primary" onclick="openCreate()">+ New Mod</button>
        </div>

        <div class="card" style="overflow:hidden;">
          <table>
            <thead>
              <tr>
                <th style="width:24px;"></th>
                <th>Mod ID</th>
                <th>Name</th>
                <th>Energy Type</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="mod-tbody">
              <tr><td colspan="5" class="table-info">
                <span class="table-info-icon">⏳</span>Loading…
              </td></tr>
            </tbody>
          </table>
        </div>

      </div>
    </main>
  </div>
</div>

<!-- ── Create Modal ── -->
<div class="modal-backdrop" id="create-backdrop" onclick="closeCreate()"></div>
<div class="modal" id="create-modal" role="dialog" aria-modal="true">
  <div class="modal-header">
    <span class="modal-title">New Mod</span>
    <button class="modal-close" onclick="closeCreate()">×</button>
  </div>
  <div class="modal-body">
    <div class="field">
      <label>Mod ID</label>
      <input type="text" id="create-modid" placeholder="e.g. modern_industrialization" autocomplete="off" />
    </div>
    <div class="field">
      <label>Name</label>
      <input type="text" id="create-name" placeholder="e.g. Modern Industrialization" autocomplete="off" />
    </div>
    <div class="field">
      <label>Energy Type</label>
      <input type="text" id="create-energy" placeholder="e.g. eu" autocomplete="off"
        onkeydown="if(event.key==='Enter') submitCreate()" />
    </div>
    <span class="status-msg" id="msg-create"></span>
  </div>
  <div class="modal-footer">
    <button class="btn btn-ghost" onclick="closeCreate()">Cancel</button>
    <button class="btn btn-primary" onclick="submitCreate()">Create</button>
  </div>
</div>

<!-- ── Edit Modal ── -->
<div class="modal-backdrop" id="edit-backdrop" onclick="closeEdit()"></div>
<div class="modal" id="edit-modal" role="dialog" aria-modal="true">
  <div class="modal-header">
    <span class="modal-title">Edit Mod</span>
    <button class="modal-close" onclick="closeEdit()">×</button>
  </div>
  <div class="modal-body">
    <div class="field">
      <label>Name</label>
      <input type="text" id="edit-name" autocomplete="off" />
    </div>
    <div class="field">
      <label>Energy Type</label>
      <input type="text" id="edit-energy" autocomplete="off"
        onkeydown="if(event.key==='Enter') submitEdit()" />
    </div>
    <span class="status-msg" id="msg-edit"></span>
  </div>
  <div class="modal-footer">
    <button class="btn btn-ghost" onclick="closeEdit()">Cancel</button>
    <button class="btn btn-primary" onclick="submitEdit()">Save</button>
  </div>
</div>

<script>
  Auth.guard();
  Header.init();

  let _mods    = [];
  let _editMod = null;

  // ── Load ──────────────────────────────────────────────
  async function loadMods() {
    const res = await Auth.apiFetch('/api/mods');
    if (!res || !res.ok) return;
    _mods = await res.json();
    renderMods();
  }

  function renderMods() {
    const tbody = document.getElementById('mod-tbody');
    if (!_mods.length) {
      tbody.innerHTML = `<tr><td colspan="5" class="table-info">
        <span class="table-info-icon">🔧</span>No mods yet
      </td></tr>`;
      return;
    }
    tbody.innerHTML = _mods.map(m => {
      const isSystem = !m.created_by;
      const actions  = isSystem ? '' : `
        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openEdit('${esc(m.mod_id)}')">Edit</button>
        <button class="btn btn-danger-ghost btn-sm" onclick="event.stopPropagation();deleteMod('${esc(m.mod_id)}',this)">🗑</button>
      `;
      return `
        <tr class="mod-row" id="row-${esc(m.mod_id)}" onclick="toggleExpand('${esc(m.mod_id)}')">
          <td><span class="expand-arrow">▶</span></td>
          <td style="font-family:var(--mono);font-size:var(--text-sm);">${esc(m.mod_id)}</td>
          <td>${esc(m.name)}</td>
          <td style="font-family:var(--mono);font-size:var(--text-sm);">${esc(m.energy_type)}</td>
          <td style="display:flex;gap:6px;" onclick="event.stopPropagation()">${actions}</td>
        </tr>
        <tr class="mod-expand" id="expand-${esc(m.mod_id)}">
          <td colspan="5">
            <div class="expand-sections" id="expand-content-${esc(m.mod_id)}">
              <div style="color:var(--text-faint);font-size:var(--text-sm);">Loading…</div>
            </div>
          </td>
        </tr>`;
    }).join('');
  }

  // ── Expand row ────────────────────────────────────────
  const _loaded = new Set();

  async function toggleExpand(modID) {
    const row    = document.getElementById('row-' + modID);
    const expand = document.getElementById('expand-' + modID);
    const isOpen = expand.classList.contains('open');

    row.classList.toggle('expanded', !isOpen);
    expand.classList.toggle('open', !isOpen);

    if (!isOpen && !_loaded.has(modID)) {
      _loaded.add(modID);
      const [machRes, itemRes] = await Promise.all([
        Auth.apiFetch('/api/mods/' + encodeURIComponent(modID) + '/machines'),
        Auth.apiFetch('/api/mods/' + encodeURIComponent(modID) + '/items'),
      ]);
      const machines = machRes?.ok ? await machRes.json() : [];
      const items    = itemRes?.ok ? await itemRes.json() : [];
      document.getElementById('expand-content-' + modID).innerHTML = expandContent(machines, items);
    }
  }

  function expandContent(machines, items) {
    const machHTML = !machines?.length
      ? '<div class="mini-table-empty">No machines</div>'
      : `<table class="mini-table">
          <thead><tr><th>Machine ID</th><th>Name</th><th>EU/t</th><th>Slots</th></tr></thead>
          <tbody>${machines.map(m => `<tr>
            <td style="font-family:var(--mono);">${esc(m.machine_id)}</td>
            <td>${esc(m.name)}</td>
            <td>${m.base_eu_per_tick}</td>
            <td>${m.max_slots ?? '—'}</td>
          </tr>`).join('')}</tbody>
        </table>`;

    const itemHTML = !items?.length
      ? '<div class="mini-table-empty">No items</div>'
      : `<table class="mini-table">
          <thead><tr><th>Item ID</th><th>Name</th><th>Stack</th></tr></thead>
          <tbody>${items.map(i => `<tr>
            <td style="font-family:var(--mono);">${esc(i.item_id)}</td>
            <td>${esc(i.name)}</td>
            <td>${i.max_stack}</td>
          </tr>`).join('')}</tbody>
        </table>`;

    return `
      <div><div class="expand-section-label">Machines</div>${machHTML}</div>
      <div><div class="expand-section-label">Items</div>${itemHTML}</div>`;
  }

  // ── Create ────────────────────────────────────────────
  function openCreate() {
    ['create-modid','create-name','create-energy'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('msg-create').className = 'status-msg';
    document.getElementById('create-backdrop').classList.add('open');
    document.getElementById('create-modal').classList.add('open');
    setTimeout(() => document.getElementById('create-modid').focus(), 80);
  }

  function closeCreate() {
    document.getElementById('create-backdrop').classList.remove('open');
    document.getElementById('create-modal').classList.remove('open');
  }

  async function submitCreate() {
    const modID  = document.getElementById('create-modid').value.trim();
    const name   = document.getElementById('create-name').value.trim();
    const energy = document.getElementById('create-energy').value.trim();
    const msg    = document.getElementById('msg-create');
    if (!modID || !name || !energy) {
      msg.className = 'status-msg err'; msg.textContent = 'All fields are required.'; return;
    }
    const res = await Auth.apiFetch('/api/mods', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mod_id: modID, name, energy_type: energy }),
    });
    if (res.status === 201) {
      closeCreate();
      loadMods();
    } else {
      const data = await res.json().catch(() => ({}));
      msg.className = 'status-msg err';
      msg.textContent = data.message || 'Error.';
    }
  }

  // ── Edit ──────────────────────────────────────────────
  function openEdit(modID) {
    _editMod = _mods.find(m => m.mod_id === modID);
    if (!_editMod) return;
    document.getElementById('edit-name').value   = _editMod.name;
    document.getElementById('edit-energy').value = _editMod.energy_type;
    document.getElementById('msg-edit').className = 'status-msg';
    document.getElementById('edit-backdrop').classList.add('open');
    document.getElementById('edit-modal').classList.add('open');
    setTimeout(() => document.getElementById('edit-name').focus(), 80);
  }

  function closeEdit() {
    document.getElementById('edit-backdrop').classList.remove('open');
    document.getElementById('edit-modal').classList.remove('open');
    _editMod = null;
  }

  async function submitEdit() {
    if (!_editMod) return;
    const name   = document.getElementById('edit-name').value.trim();
    const energy = document.getElementById('edit-energy').value.trim();
    const msg    = document.getElementById('msg-edit');
    if (!name || !energy) {
      msg.className = 'status-msg err'; msg.textContent = 'All fields are required.'; return;
    }
    const res = await Auth.apiFetch('/api/mods/' + encodeURIComponent(_editMod.mod_id), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, energy_type: energy }),
    });
    if (res.status === 204) {
      closeEdit();
      loadMods();
    } else {
      const data = await res.json().catch(() => ({}));
      msg.className = 'status-msg err';
      msg.textContent = data.message || 'Error.';
    }
  }

  // ── Delete ────────────────────────────────────────────
  async function deleteMod(modID, btn) {
    if (!confirm('Delete mod "' + modID + '" and all its recipes? This cannot be undone.')) return;
    btn.disabled = true;
    const res = await Auth.apiFetch('/api/mods/' + encodeURIComponent(modID), { method: 'DELETE' });
    if (res && (res.ok || res.status === 204)) loadMods();
    else btn.disabled = false;
  }

  // ── Helpers ───────────────────────────────────────────
  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function toggleTheme() {
    const dark = document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', dark ? 'dark' : 'light');
    document.getElementById('theme-btn').textContent = dark ? '☀️' : '🌙';
  }
  document.getElementById('theme-btn').textContent =
    document.documentElement.classList.contains('dark') ? '☀️' : '🌙';

  loadMods();
</script>
</body>
</html>
