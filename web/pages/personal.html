<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MC Optimizer — Personal</title>
  <link rel="stylesheet" href="/static/ui/index.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <script>
    (function(){
      const s = localStorage.getItem('theme');
      if (s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark');
    })();
  </script>
  <style>
    /* ── Welcome card ──────────────────────────────────────────────────────── */
    .welcome-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--pad-card);
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: var(--gap-control);
    }
    /* Page-specific size: wui-avatar's default is 28px, this welcome header
       needs a larger identity avatar. */
    #welcome-avatar {
      width: 52px;
      height: 52px;
      font-size: var(--text-xl);
    }
    .welcome-name {
      font-size: var(--text-lg);
      font-weight: var(--weight-bold);
      color: var(--text);
    }
    .welcome-sub {
      font-size: var(--text-sm);
      color: var(--text-faint);
      line-height: 1.6;
    }
  </style>
</head>
<body class="app-shell">

  <!-- ── Header ── -->
  <header class="header">
    <a class="header-brand" href="/saves">
      <div class="header-logo">⚙️</div>
      <span>MC Optimizer</span>
    </a>
    <div class="header-right">
      <button data-wui-theme data-i18n-title="common.toggle_theme"></button>
      <div class="dropdown-wrap" data-wui-lang>
        <button data-dropdown-trigger></button>
        <div class="dropdown-panel">
          <button class="dropdown-item" data-lang="en">🇬🇧 English</button>
          <button class="dropdown-item" data-lang="de">🇩🇪 Deutsch</button>
        </div>
      </div>
      <div class="dropdown-wrap" data-wui-user-menu>
        <button class="user-menu-trigger" data-wui-user-trigger data-dropdown-trigger>
          <div class="avatar">?</div>
          <span class="username">…</span>
          <span class="chevron">▾</span>
        </button>
        <div class="dropdown-panel" data-wui-user-dropdown></div>
      </div>
    </div>
  </header>

  <div class="app-body">
    <nav class="sidebar"></nav>

    <main class="main">
      <div class="page" data-tabs>

        <div class="page-header">
          <div>
            <div class="page-title" data-i18n="personal.title"></div>
          </div>
        </div>

        <nav class="wui-tabs">
          <button class="wui-tab active" data-tab="main" data-i18n="personal.tab.main"></button>
          <button class="wui-tab" data-tab="account" data-i18n="personal.tab.account"></button>
        </nav>

        <!-- ── Tab: Overview ──────────────────────────────────────────────── -->
        <div data-tab-panel="main">
          <div class="welcome-card">
            <div class="wui-avatar" id="welcome-avatar">?</div>
            <div class="welcome-name" id="welcome-name">…</div>
            <div class="welcome-sub" data-i18n="personal.welcome"></div>
            <div class="detail-grid" style="padding-top:var(--gap-control);border-top:1px solid var(--border)">
              <div class="detail-row">
                <span class="detail-key" data-i18n="personal.meta.username"></span>
                <span class="detail-val" id="welcome-username">…</span>
              </div>
              <div class="detail-row">
                <span class="detail-key" data-i18n="personal.meta.role"></span>
                <span class="detail-val" id="welcome-role">…</span>
              </div>
              <div class="detail-row">
                <span class="detail-key" data-i18n="personal.meta.since"></span>
                <span class="detail-val" id="welcome-since">…</span>
              </div>
            </div>
          </div>
        </div>

        <!-- ── Tab: Account ───────────────────────────────────────────────── -->
        <div data-tab-panel="account" hidden>
          <div style="max-width:400px;display:flex;flex-direction:column;gap:var(--gap-section);">

            <div class="container">
              <div class="container-header"><span class="container-title" data-i18n="personal.username.title"></span></div>
              <div class="container-body">
                <form id="form-username">
                  <div class="field">
                    <label class="field-label" data-i18n="personal.username.label"></label>
                    <input class="input" type="text" name="new_username"
                      minlength="3" required autocomplete="username"
                      data-i18n-placeholder="personal.username.placeholder" />
                  </div>
                  <div style="display:flex; align-items:center; gap:var(--gap-control); margin-top:var(--gap-control);">
                    <button type="submit" class="btn btn-primary btn-sm" data-i18n="common.save"></button>
                    <span class="status-msg" id="msg-username"></span>
                  </div>
                </form>
              </div>
            </div>

            <div class="container">
              <div class="container-header"><span class="container-title" data-i18n="personal.password.title"></span></div>
              <div class="container-body">
                <form id="form-password">
                  <div class="field">
                    <label class="field-label" data-i18n="personal.password.current"></label>
                    <input class="input" type="password" name="current_password"
                      required autocomplete="current-password" />
                  </div>
                  <div class="field">
                    <label class="field-label" data-i18n="personal.password.new"></label>
                    <input class="input" type="password" name="new_password" id="pw-new"
                      required minlength="8" autocomplete="new-password"
                      data-i18n-placeholder="personal.password.placeholder_new" />
                  </div>
                  <div class="field">
                    <label class="field-label" data-i18n="personal.password.confirm"></label>
                    <div class="input-wrap" id="pw-confirm-wrap">
                      <input class="input" type="password" name="confirm_password" id="pw-confirm"
                        required autocomplete="new-password"
                        data-i18n-placeholder="personal.password.placeholder_confirm" />
                      <span class="end-icon" id="pw-match-icon"></span>
                    </div>
                  </div>
                  <div style="display:flex; align-items:center; gap:var(--gap-control); margin-top:var(--gap-control);">
                    <button type="submit" class="btn btn-primary btn-sm" data-i18n="common.save"></button>
                    <span class="status-msg" id="msg-password"></span>
                  </div>
                </form>
              </div>
            </div>

          </div>
        </div>

      </div>
    </main>
  </div>

<script type="module">
  import { guard, apiFetch, getUser } from '/static/ui/js/auth.js';
  import { load, applyI18n, getLang, t } from '/static/js/i18n.js';
  import { init as initHeader } from '/static/js/header.js';
  import { initTabs } from '/static/ui/js/tabs.js';

  await load(getLang());
  applyI18n();
  guard();

  initTabs();
  initHeader();

  async function loadMe() {
    const user = await getUser();
    if (!user) return;

    const initial = (user.username || '?').charAt(0).toUpperCase();
    document.getElementById('welcome-avatar').textContent   = initial;
    document.getElementById('welcome-name').textContent     = 'Hey, ' + user.username + '!';
    document.getElementById('welcome-username').textContent = user.username;
    document.getElementById('welcome-role').textContent     = user.is_admin ? t('header.role_admin') : t('header.role_user');
    document.getElementById('welcome-since').textContent    = fmtDate(user.created_at);
  }

  document.getElementById('form-username').addEventListener('submit', async e => {
    e.preventDefault();
    const fd  = new FormData(e.target);
    const msg = document.getElementById('msg-username');
    msg.className = 'status-msg'; msg.textContent = '';

    const res = await apiFetch('/api/me/username', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ new_username: fd.get('new_username') }),
    });

    if (res.status === 204) {
      msg.className = 'status-msg ok';
      msg.textContent = t('msg.saved');
      e.target.reset();
      loadMe();
      initHeader();
    } else {
      const data = await res.json().catch(() => ({}));
      msg.className = 'status-msg err';
      msg.textContent = data.message || t('msg.save_error');
    }
  });

  document.getElementById('form-password').addEventListener('submit', async e => {
    e.preventDefault();
    const fd  = new FormData(e.target);
    const msg = document.getElementById('msg-password');
    msg.className = 'status-msg'; msg.textContent = '';

    if (fd.get('new_password') !== fd.get('confirm_password')) {
      msg.className = 'status-msg err';
      msg.textContent = t('msg.passwords_no_match');
      return;
    }

    const res = await apiFetch('/api/me/password', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        current_password: fd.get('current_password'),
        new_password:     fd.get('new_password'),
      }),
    });

    if (res.status === 204) {
      msg.className = 'status-msg ok';
      msg.textContent = t('msg.saved');
      e.target.reset();
    } else {
      const data = await res.json().catch(() => ({}));
      msg.className = 'status-msg err';
      msg.textContent = data.message || t('msg.save_error');
    }
  });

  function checkPwMatch() {
    const pw1   = document.getElementById('pw-new').value;
    const pw2   = document.getElementById('pw-confirm').value;
    const icon  = document.getElementById('pw-match-icon');
    const input = document.getElementById('pw-confirm');
    if (!pw2) { icon.textContent = ''; icon.className = 'end-icon'; input.classList.remove('has-end-icon'); return; }
    const ok = pw1 === pw2;
    icon.textContent = ok ? '✓' : '✗';
    icon.className = 'end-icon ' + (ok ? 'ok' : 'bad');
    input.classList.add('has-end-icon');
  }

  document.getElementById('pw-new').addEventListener('input', checkPwMatch);
  document.getElementById('pw-confirm').addEventListener('input', checkPwMatch);
  document.getElementById('form-password').addEventListener('reset', () => {
    document.getElementById('pw-match-icon').textContent = '';
    document.getElementById('pw-match-icon').className = 'end-icon';
    document.getElementById('pw-confirm').classList.remove('has-end-icon');
  });

  function fmtDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' });
  }

  loadMe();
</script>
</body>
</html>
