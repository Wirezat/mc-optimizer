<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MC Optimizer</title>
  <link rel="stylesheet" href="/static/ui/index.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <style>
    .tile-src { border-style: dashed; }
    .tile-src:hover { border-style: solid; }

  </style>
  <script>
    (function(){
      const s = localStorage.getItem('theme');
      if (s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark');
    })();
  </script>
</head>
<body class="app-shell">

  <!-- ── Header ── -->
  <header class="header">
    <a class="header-brand" href="/saves">
      <div class="header-logo">⚙️</div>
      <span>MC Optimizer</span>
    </a>
    <div class="header-right">
      <button data-wui-theme data-i18n-title="common.toggle_theme"></button>
      <div class="dropdown-wrap" data-wui-lang>
        <button data-dropdown-trigger></button>
        <div class="dropdown-panel">
          <button class="dropdown-item" data-lang="en">🇬🇧 English</button>
          <button class="dropdown-item" data-lang="de">🇩🇪 Deutsch</button>
        </div>
      </div>
      <div class="dropdown-wrap" data-wui-user-menu>
        <button class="user-menu-trigger" data-wui-user-trigger data-dropdown-trigger>
          <div class="avatar">?</div>
          <span class="username">…</span>
          <span class="chevron">▾</span>
        </button>
        <div class="dropdown-panel" data-wui-user-dropdown></div>
      </div>
    </div>
  </header>

  <div class="app-body">
    <nav class="sidebar"></nav>

    <main class="main">
      <div class="page">

        <div class="page-header">
          <div>
            <div class="breadcrumb">
              <a href="/saves" data-i18n="nav.saves"></a>
              <span class="breadcrumb-sep">▸</span>
              <span class="breadcrumb-current" id="breadcrumb-name">…</span>
            </div>
            <div class="page-title" id="page-title">…</div>
          </div>
          <div style="display:flex;gap:var(--gap-control);">
            <button class="btn btn-ghost" id="mods-btn" data-i18n="save.mods_btn"></button>
            <button class="btn btn-primary" id="new-factory-btn" data-i18n="save.new_factory"></button>
          </div>
        </div>

        <div id="factories-container"></div>

        <div class="empty-state" id="empty-state" style="display:none;">
          <div class="empty-state-icon">🏭</div>
          <div class="empty-state-text" data-i18n="save.empty"></div>
          <div class="empty-state-action">
            <button class="btn btn-primary" id="new-factory-btn-empty" data-i18n="save.new_factory"></button>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- ── New Factory Modal ── -->
  <div class="modal-backdrop" data-wui-modal>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <span class="modal-title" data-i18n="save.modal.title"></span>
        <button class="modal-close" data-modal-close>×</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label class="field-label" data-i18n="save.modal.name_label"></label>
          <input class="input" type="text" id="factory-name"
            data-i18n-placeholder="save.modal.name_placeholder"
            autocomplete="off" />
        </div>
        <div class="field" style="flex-direction:row;align-items:center;gap:var(--gap-control);">
          <span class="field-label" style="margin:0" data-i18n="save.modal.src_label"></span>
          <button class="btn btn-ghost btn-sm" id="mode-btn" style="margin-left:auto;"></button>
        </div>
        <div id="src-hint" class="field-caption"></div>
        <span class="status-msg" id="status-create"></span>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" data-modal-cancel data-i18n="common.cancel"></button>
        <button class="btn btn-primary" id="modal-ok-btn" data-i18n="common.create"></button>
      </div>
    </div>
  </div>

  <!-- ── Mods Modal ── -->
  <div class="modal-backdrop" data-wui-modal="mods">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <span class="modal-title" data-i18n="save.mods_modal.title"></span>
        <button class="modal-close" data-modal-close>×</button>
      </div>
      <div class="modal-body">
        <p class="field-caption" data-i18n="save.mods_modal.hint"></p>
        <div id="save-mods-picker"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" data-modal-cancel data-i18n="common.cancel"></button>
        <button class="btn btn-primary" id="mods-save-btn" data-i18n="common.save"></button>
      </div>
    </div>
  </div>

  <!-- ── Generic confirm modal (mods-confirm) — used for the "deactivating this
       mod affects existing production lines" prompt. Placed after the Mods
       modal so it paints on top when both happen to be open. ── -->
  <div class="modal-backdrop" data-wui-modal="mods-confirm">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mods-confirm-title">
      <div class="modal-header">
        <span class="modal-title" data-modal-title id="mods-confirm-title"></span>
        <button class="modal-close" data-modal-close>×</button>
      </div>
      <div class="modal-body" data-modal-body></div>
      <div class="modal-footer">
        <button class="btn btn-ghost" data-modal-cancel data-i18n="common.no"></button>
        <button class="btn btn-primary" data-modal-confirm></button>
      </div>
    </div>
  </div>

<script type="module">
  import { guard, apiFetch } from '/static/ui/js/auth.js';
  import { load, applyI18n, getLang, t, esc } from '/static/js/i18n.js';
  import { init as initHeader } from '/static/js/header.js';
  import { initModal, closeModal, openModal as openGenericModal } from '/static/ui/js/modal.js';
  import { createListView } from '/static/js/list-view.js';
  import { renderModPicker } from '/static/js/mod-picker.js';

  await load(getLang());
  applyI18n();
  guard();
  initHeader();
  initModal();

  const _saveID = window.location.pathname.split('/')[2];
  let _modPicker = null;

  const listView = createListView({
    containerEl: document.getElementById('factories-container'),
    emptyEl: document.getElementById('empty-state'),
    storageKey: 'view:save-factories',
    renderTile: (f) => `
      <a class="tile${f.src ? ' tile-src' : ''}" href="/factories/${esc(f.id)}">
        <button class="btn btn-danger-flat btn-sm btn-icon tile-action"
          data-id="${esc(f.id)}" title="${esc(t('common.delete'))}">🗑</button>
        <div class="tile-title">${esc(f.name)}</div>
        ${f.src
          ? `<div class="tile-subtitle"><span class="badge badge-accent">${esc(t('save.src_label'))}</span></div>`
          : ''}
        <div class="tile-meta">
          ${f.src
            ? `<span>${esc(t('save.src_meta'))}</span>`
            : `<span>${fmtPL(f.pl_count)}</span>`}
        </div>
      </a>
    `,
    tableCols: [
      { key: 'name', label: t('common.name'), grow: true,
        render: (v, row) => `<a href="/factories/${esc(row.id)}">${esc(v)}</a>` },
      { key: 'type', label: t('save.modal.src_label'),
        render: (_, row) => row.src ? esc(t('save.src_label')) : '' },
      { key: 'pl',   label: t('save.pl_col'),
        render: (_, row) => row.src ? esc(t('save.src_meta')) : esc(fmtPL(row.pl_count)) },
    ],
    getId: (row) => row.id,
    onDelete: (id, btn) => deleteFactory(id, btn),
  });

  document.getElementById('new-factory-btn').addEventListener('click', openModal);
  document.getElementById('new-factory-btn-empty').addEventListener('click', openModal);
  document.getElementById('modal-ok-btn').addEventListener('click', doCreate);
  document.getElementById('factory-name').addEventListener('keydown', e => { if (e.key === 'Enter') doCreate(); });
  let _srcMode = false;

  function setSrcMode(src) {
    _srcMode = src;
    const btn = document.getElementById('mode-btn');
    btn.textContent = src ? t('factory.mode.manual') : t('factory.mode.auto');
    document.getElementById('src-hint').textContent = src ? t('save.modal.src_hint') : t('save.modal.auto_hint');
  }

  document.getElementById('mode-btn').addEventListener('click', () => setSrcMode(!_srcMode));

  // ── Mods modal ─────────────────────────────────────────────────────────────
  document.getElementById('mods-btn').addEventListener('click', openModsModal);
  document.getElementById('mods-save-btn').addEventListener('click', saveMods);

  let _activeModsBeforeEdit = [];

  async function openModsModal() {
    const res = await apiFetch('/api/saves/' + _saveID + '/active-mods');
    _activeModsBeforeEdit = res && res.ok ? (await res.json()).mod_ids : [];
    document.querySelector('[data-wui-modal="mods"]').classList.add('open');
    _modPicker = await renderModPicker(document.getElementById('save-mods-picker'), _activeModsBeforeEdit);
  }

  // Deactivating a mod that existing production lines depend on doesn't touch
  // their data (see design doc) — but it's a one-way, easy-to-miss action, so
  // ask first. Only mods being newly turned OFF matter; adding mods back is
  // always safe and needs no confirmation.
  async function saveMods() {
    if (!_modPicker) return;
    const newSelection = _modPicker.getSelected();
    const removed = _activeModsBeforeEdit.filter(m => !newSelection.includes(m));

    if (removed.length > 0) {
      const res = await apiFetch('/api/saves/' + _saveID + '/active-mods/dependents', {
        method: 'POST',
        body: JSON.stringify({ mod_ids: removed }),
      });
      const lines = res && res.ok ? (await res.json()).production_lines : [];
      if (lines.length > 0) {
        const list = lines.map(pl => `<li>${esc(pl.factory_name)} — ${esc(pl.name)}</li>`).join('');
        openGenericModal({
          name:         'mods-confirm',
          title:        t('save.mods_confirm.title'),
          bodyHTML:     `<p>${esc(t('save.mods_confirm.body'))}</p><ul>${list}</ul>`,
          confirmLabel: t('common.yes'),
          onConfirm:    () => persistActiveMods(newSelection),
        });
        return;
      }
    }
    await persistActiveMods(newSelection);
  }

  async function persistActiveMods(modIds) {
    await apiFetch('/api/saves/' + _saveID + '/active-mods', {
      method: 'PUT',
      body: JSON.stringify({ mod_ids: modIds }),
    });
    closeModal('mods');
  }

  // ── Load save metadata ────────────────────────────────────────────────────
  async function loadSave() {
    const res = await apiFetch('/api/saves/' + _saveID);
    if (!res || !res.ok) { window.location.href = '/saves'; return; }
    const save = await res.json();
    document.title = 'MC Optimizer — ' + save.name;
    document.getElementById('page-title').textContent      = save.name;
    document.getElementById('breadcrumb-name').textContent = save.name;
  }

  // ── Load factories ────────────────────────────────────────────────────────
  async function loadFactories() {
    const res = await apiFetch('/api/saves/' + _saveID + '/factories');
    if (!res) return;
    const factories = await res.json();
    listView.render(factories);
  }

  // ── Create factory ────────────────────────────────────────────────────────
  function openModal() {
    document.getElementById('factory-name').value = '';
    setSrcMode(false);
    document.getElementById('status-create').className = 'status-msg';
    document.getElementById('status-create').textContent = '';
    document.querySelector('[data-wui-modal]').classList.add('open');
    setTimeout(() => document.getElementById('factory-name').focus(), 80);
  }

  async function doCreate() {
    const name = document.getElementById('factory-name').value.trim();
    const src  = _srcMode;
    if (!name) { showStatus('err', t('msg.name_required')); return; }
    const res = await apiFetch('/api/saves/' + _saveID + '/factories', {
      method: 'POST',
      body: JSON.stringify({ name, src }),
    });
    if (!res) return;
    const data = await res.json();
    if (!res.ok) { showStatus('err', data.message || t('msg.error')); return; }
    closeModal();
    loadFactories();
  }

  // ── Delete factory ────────────────────────────────────────────────────────
  async function deleteFactory(id, btn = null) {
    if (!confirm(t('save.confirm_delete'))) return;
    if (btn) btn.disabled = true;
    const res = await apiFetch('/api/factories/' + id, { method: 'DELETE' });
    if (res && (res.ok || res.status === 204)) { loadFactories(); }
    else if (btn) btn.disabled = false;
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function fmtPL(n) {
    if (!n) return esc(t('save.pl_count_none'));
    return esc(t('save.pl_count').replace('{n}', n));
  }

  function showStatus(cls, text) {
    const el = document.getElementById('status-create');
    el.className = 'status-msg ' + cls;
    el.textContent = text;
  }


  loadSave();
  loadFactories();
  if (new URLSearchParams(window.location.search).get('open') === 'mods') openModsModal();
</script>
</body>
</html>
