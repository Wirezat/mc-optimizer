<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MC Optimizer — Machines</title>
  <link rel="stylesheet" href="/static/ui/index.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <script>
    (function(){
      const s = localStorage.getItem('theme');
      if (s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark');
    })();
  </script>
  <style>
    .row-name-link { color: var(--text-base); text-decoration: none; border-bottom: 1px solid var(--border); }
    .row-name-link:hover { color: var(--accent); border-color: var(--accent); }
    .recipe-count-link { color: var(--text-muted); text-decoration: none; font-size: var(--text-sm); }
    .recipe-count-link:hover { color: var(--accent); }
    .energy-edit { cursor: text; border-radius: var(--radius-sm); padding: 1px 3px; outline: none; }
    .energy-edit:hover { background: var(--bg-hover, var(--surface-raised)); }
    .energy-edit[contenteditable="true"] { background: var(--surface-raised); box-shadow: 0 0 0 1px var(--accent); }
    .energy-edit:empty::before { content: '—'; color: var(--text-faint); pointer-events: none; }
    .group-toggle { cursor: pointer; user-select: none; font-size: .7em; opacity: .5; padding-right: 4px; }
    .catalog-link { color: var(--text-base); text-decoration: none; border-bottom: 1px solid var(--border); }
    .catalog-link:hover { color: var(--accent); border-color: var(--accent); }
    .table-group-hd.collapsed .group-toggle::before { content: '▸'; }
    .group-toggle::before { content: '▾'; }
  </style>
</head>
<body class="app-shell">
  <header class="header">
    <a class="header-brand" href="/saves"><div class="header-logo">⚙️</div><span>MC Optimizer</span></a>
    <div class="header-right">
      <button data-wui-theme data-i18n-title="common.toggle_theme"></button>
      <div class="dropdown-wrap" data-wui-lang><button data-dropdown-trigger></button><div class="dropdown-panel"><button class="dropdown-item" data-lang="en">🇬🇧 English</button><button class="dropdown-item" data-lang="de">🇩🇪 Deutsch</button></div></div>
      <div class="dropdown-wrap" data-wui-user-menu><button class="user-menu-trigger" data-wui-user-trigger data-dropdown-trigger><div class="avatar">?</div><span class="username">…</span><span class="chevron">▾</span></button><div class="dropdown-panel" data-wui-user-dropdown></div></div>
    </div>
  </header>
  <div class="app-body">
    <nav class="sidebar"></nav>
    <main class="main"><div class="page">

      <div class="page-header" data-page-header-area>
        <div class="page-title-row">
          <h1 class="page-title" data-i18n="catalog.machines.title"></h1>
        </div>
      </div>

      <div class="container">
        <div class="container-header">
          <span class="container-title" id="machine-count"></span>
        </div>
        <div class="container-filter">
          <div class="wui-ac-wrap" style="width:220px;">
            <input class="input" id="machine-search" data-i18n-placeholder="catalog.search_placeholder"
              style="width:100%;height:var(--h-btn-sm);" autocomplete="off" />
            <div class="wui-ac-drop" id="machine-search-ac"></div>
          </div>
        </div>
        <div class="container-body-flush">
          <table class="table">
            <thead>
              <tr>
                <th style="width:100%;" data-i18n="catalog.mods.col.name"></th>
                <th data-i18n="catalog.machines.col.machine_id"></th>
                <th data-i18n="catalog.machines.col.max_eu_t"></th>
                <th data-i18n="catalog.mods.detail.energy"></th>
                <th data-i18n="catalog.machines.col.recipes"></th>
              </tr>
            </thead>
            <tbody id="machine-tbody">
              <tr><td colspan="5" class="td-muted" style="padding:16px;text-align:center;" data-i18n="catalog.empty.loading"></td></tr>
            </tbody>
          </table>
          <div id="machine-sentinel" style="height:1px;"></div>
        </div>
      </div>

    </div></main>
  </div>
</div>

<script type="module">
  import { guard, apiFetch, isAdmin, getUser } from '/static/ui/js/auth.js';
  import { load, applyI18n, getLang, t, esc } from '/static/js/i18n.js';
  import { init as initHeader } from '/static/js/header.js';
  import { WuiAutocomplete } from '/static/ui/js/autocomplete.js';
  import { wuiFilter } from '/static/ui/js/filter.js';

  await load(getLang());
  applyI18n();
  guard();
  initHeader();
  await getUser();
  const admin = isAdmin();

  const tbody    = document.getElementById('machine-tbody');
  const countEl  = document.getElementById('machine-count');
  const searchEl = document.getElementById('machine-search');
  const sentinel = document.getElementById('machine-sentinel');
  const urlMod   = new URLSearchParams(location.search).get('mod') || '';

  const PAGE_SIZE = 100;
  let allMachines = [];
  let modNames    = {};
  let filtered    = [];
  let rendered    = 0;
  let groupCounts = {};


  function applyCollapseState() {
    let collapsed = false;
    for (const row of tbody.rows) {
      if (row.classList.contains('table-group-hd')) {
        collapsed = row.classList.contains('collapsed');
      } else {
        row.hidden = collapsed;
      }
    }
  }

  function renderChunk() {
    const chunk = filtered.slice(rendered, rendered + PAGE_SIZE);
    if (!chunk.length) return;
    let html = '';
    let lastMod = rendered === 0 ? null : filtered[rendered - 1].mod_id;
    for (const m of chunk) {
      if (m.mod_id !== lastMod) {
        lastMod = m.mod_id;
        const modName = modNames[m.mod_id] || m.mod_id;
        html += `<tr class="table-group-hd collapsed"><td colspan="5"><span class="group-toggle"></span><a href="/catalog/mods" class="catalog-link">${esc(modName)}</a><span class="td-muted" style="font-size:var(--text-xs);margin-left:6px;">${groupCounts[m.mod_id] || 0}</span></td></tr>`;
      }
      const energyVal  = m.max_eu_per_tick || '';
      const recipesUrl = `/catalog/recipes?mod=${encodeURIComponent(m.mod_id)}&machine=${encodeURIComponent(m.machine_id)}`;
      const energyCell = admin
        ? `<span class="energy-edit td-muted" contenteditable="false"
             data-mod-id="${esc(m.mod_id)}" data-machine-id="${esc(m.machine_id)}"
             data-placeholder="—">${esc(energyVal)}</span>`
        : `<span class="td-muted">${energyVal || '—'}</span>`;
      html += `<tr>
        <td><a href="${esc(recipesUrl)}" class="row-name-link">${esc(m.name || m.machine_id)}</a></td>
        <td class="td-mono td-muted">${esc(m.machine_id)}</td>
        <td>${energyCell}</td>
        <td><span class="badge badge-neutral">${esc(m.energy_type || '—')}</span></td>
        <td>${m.recipe_count
          ? `<a href="${esc(recipesUrl)}" class="recipe-count-link">${m.recipe_count}</a>`
          : `<span class="td-muted">—</span>`}</td>
      </tr>`;
    }
    tbody.insertAdjacentHTML('beforeend', html);
    rendered += chunk.length;
    applyCollapseState();
  }

  function resetAndRender() {
    const q = searchEl.value.trim().toLowerCase();
    filtered = urlMod ? allMachines.filter(m => m.mod_id === urlMod) : allMachines;
    if (q) filtered = filtered.filter(m => wuiFilter(m, q, ['name', 'machine_id', 'mod_name', 'energy_type', 'max_eu_per_tick']));
    countEl.textContent = filtered.length + ' machine' + (filtered.length !== 1 ? 's' : '');
    groupCounts = {};
    for (const m of filtered) groupCounts[m.mod_id] = (groupCounts[m.mod_id] || 0) + 1;
    rendered = 0;
    tbody.innerHTML = '';
    if (!filtered.length) {
      tbody.innerHTML = `<tr><td colspan="5" class="td-muted" style="padding:16px;text-align:center;">${t('catalog.empty.no_machines')}</td></tr>`;
      return;
    }
    renderChunk();
  }

  tbody.addEventListener('click', e => {
    if (e.target.closest('a')) return;
    const hd = e.target.closest('.table-group-hd');
    if (hd) { hd.classList.toggle('collapsed'); applyCollapseState(); return; }

    if (!admin) return;
    const cell = e.target.closest('.energy-edit');
    if (!cell || cell.contentEditable === 'true') return;

    const prev = cell.textContent.trim();
    cell.contentEditable = 'true';
    cell.focus();
    const r = document.createRange();
    r.selectNodeContents(cell); r.collapse(false);
    getSelection()?.removeAllRanges(); getSelection()?.addRange(r);

    const commit = async () => {
      if (cell.contentEditable !== 'true') return;
      cell.contentEditable = 'false';
      const raw  = cell.textContent.trim().replace(/[^\d]/g, '');
      const val  = raw ? parseInt(raw, 10) : 0;
      cell.textContent = val || '';
      const modID     = cell.dataset.modId;
      const machineID = cell.dataset.machineId;
      const m = allMachines.find(m => m.mod_id === modID && m.machine_id === machineID);
      if (!m) return;
      if (val === (m.max_eu_per_tick || 0)) return;
      const prevVal = m.max_eu_per_tick;
      m.max_eu_per_tick = val;
      const res = await apiFetch(`/api/mods/${encodeURIComponent(modID)}/machines/${encodeURIComponent(machineID)}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ max_eu_per_tick: val }),
      });
      if (!res?.ok) { m.max_eu_per_tick = prevVal; cell.textContent = prevVal || ''; }
    };

    cell.addEventListener('blur', commit, { once: true });
    cell.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); cell.blur(); }
      if (e.key === 'Escape') { cell.textContent = prev; cell.contentEditable = 'false'; }
    }, { once: true });
  });

  new IntersectionObserver(entries => {
    if (entries[0].isIntersecting && rendered < filtered.length) renderChunk();
  }, { rootMargin: '300px' }).observe(sentinel);

  searchEl.addEventListener('input', resetAndRender);

  const [machRes, modsRes] = await Promise.all([
    apiFetch('/api/machines'),
    apiFetch('/api/mods'),
  ]);
  if (modsRes?.ok) {
    const mods = await modsRes.json();
    mods.forEach(m => { modNames[m.mod_id] = m.name; });
  }
  if (machRes?.ok) {
    allMachines = await machRes.json();
    allMachines.forEach(m => { m.mod_name = modNames[m.mod_id] || m.mod_id; });
    resetAndRender();
    new WuiAutocomplete({
      inputEl:   searchEl,
      dropEl:    document.getElementById('machine-search-ac'),
      primary:   r => r.name || r.machine_id,
      secondary: r => r.mod_name,
      fetch(q, offset) {
        const rows = wuiFilter(allMachines, q, ['name', 'machine_id', 'mod_name', 'energy_type', 'max_eu_per_tick']);
        return Promise.resolve({ rows: rows.slice(offset, offset + 50), hasMore: offset + 50 < rows.length });
      },
      onSelect(r) { searchEl.value = r.name || r.machine_id; searchEl.dispatchEvent(new Event('input')); },
    });
  }
</script>
</body>
</html>
