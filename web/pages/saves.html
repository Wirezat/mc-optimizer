<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MC Optimizer — Saves</title>
  <link rel="stylesheet" href="/static/ui/index.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <script>
    (function(){
      const s = localStorage.getItem('theme');
      if (s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark');
    })();
  </script>
</head>
<body class="app-shell">

  <!-- ── Header ── -->
  <header class="header">
    <a class="header-brand" href="/saves">
      <div class="header-logo">⚙️</div>
      <span>MC Optimizer</span>
    </a>
    <div class="header-right">
      <button data-wui-theme data-i18n-title="common.toggle_theme"></button>
      <div class="dropdown-wrap" data-wui-lang>
        <button data-dropdown-trigger></button>
        <div class="dropdown-panel">
          <button class="dropdown-item" data-lang="en">🇬🇧 English</button>
          <button class="dropdown-item" data-lang="de">🇩🇪 Deutsch</button>
        </div>
      </div>
      <div class="dropdown-wrap" data-wui-user-menu>
        <button class="user-menu-trigger" data-wui-user-trigger data-dropdown-trigger>
          <div class="avatar">?</div>
          <span class="username">…</span>
          <span class="chevron">▾</span>
        </button>
        <div class="dropdown-panel" data-wui-user-dropdown></div>
      </div>
    </div>
  </header>

  <div class="app-body">

    <!-- ── Sidebar (populated by header.js) ── -->
    <nav class="sidebar"></nav>

    <!-- ── Main ── -->
    <main class="main">
      <div class="page">

        <div class="page-header">
          <div>
            <div class="page-title" data-i18n="saves.title"></div>
            <div class="page-subtitle" data-i18n="saves.subtitle"></div>
          </div>
          <button class="btn btn-primary" id="new-save-btn" data-i18n="saves.new"></button>
        </div>

        <div id="saves-container"></div>

        <div class="empty-state" id="empty-state" style="display:none;">
          <div class="empty-state-icon">💾</div>
          <div class="empty-state-text" data-i18n="saves.empty"></div>
          <div class="empty-state-action">
            <button class="btn btn-primary" id="new-save-btn-empty" data-i18n="saves.new"></button>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- ── New Save Modal ── -->
  <div class="modal-backdrop" data-wui-modal>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <span class="modal-title" data-i18n="saves.modal.title"></span>
        <button class="modal-close" data-modal-close>×</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label class="field-label" data-i18n="saves.modal.name_label"></label>
          <input class="input" type="text" id="save-name"
            data-i18n-placeholder="saves.modal.name_placeholder"
            autocomplete="off" />
        </div>
        <span class="status-msg" id="status-create"></span>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" data-modal-cancel data-i18n="common.cancel"></button>
        <button class="btn btn-primary" id="modal-create-btn" data-i18n="common.create"></button>
      </div>
    </div>
  </div>

<script type="module">
  import { guard, apiFetch } from '/static/ui/js/auth.js';
  import { load, applyI18n, getLang, t, esc } from '/static/js/i18n.js';
  import { init as initHeader } from '/static/js/header.js';
  import { initModal, closeModal } from '/static/ui/js/modal.js';
  import { createListView } from '/static/js/list-view.js';

  await load(getLang());
  applyI18n();
  guard();
  initHeader();
  initModal();

  const listView = createListView({
    containerEl: document.getElementById('saves-container'),
    emptyEl: document.getElementById('empty-state'),
    storageKey: 'view:saves',
    renderTile: (s) => `
      <a class="tile" href="/saves/${esc(s.id)}">
        <button class="btn btn-danger-flat btn-sm btn-icon tile-action"
          data-id="${esc(s.id)}" title="${esc(t('common.delete'))}">🗑</button>
        <div class="tile-title">${esc(s.name)}</div>
        <!-- TODO: show s.mod_count in tile-subtitle once /api/saves returns mod_count -->
        <div class="tile-meta">
          <span>${fmtFactories(s.factory_count)}</span>
          <span>·</span>
          <span>${esc(fmtDate(s.created_at))}</span>
        </div>
      </a>
    `,
    tableCols: [
      { key: 'name',      label: t('common.name'), grow: true,
        render: (v, row) => `<a href="/saves/${esc(row.id)}">${esc(v)}</a>` },
      { key: 'factories', label: t('saves.factories_col'),
        render: (_, row) => esc(fmtFactories(row.factory_count)) },
      { key: 'created',   label: t('common.created_at'),
        render: (_, row) => esc(fmtDate(row.created_at)) },
    ],
    getId: (row) => row.id,
    onDelete: (id, btn) => deleteSave(id, btn),
  });

  document.getElementById('new-save-btn').addEventListener('click', openModal);
  document.getElementById('new-save-btn-empty').addEventListener('click', openModal);
  document.getElementById('modal-create-btn').addEventListener('click', doCreate);
  document.getElementById('save-name').addEventListener('keydown', e => { if (e.key === 'Enter') doCreate(); });

  // ── Load saves ────────────────────────────────────────────────────────────
  async function loadSaves() {
    const res = await apiFetch('/api/saves');
    if (!res) return;
    const saves = await res.json();
    listView.render(saves);
  }

  // ── Create save ───────────────────────────────────────────────────────────
  function openModal() {
    document.getElementById('save-name').value = '';
    document.getElementById('status-create').className = 'status-msg';
    document.getElementById('status-create').textContent = '';
    document.querySelector('[data-wui-modal]').classList.add('open');
    setTimeout(() => document.getElementById('save-name').focus(), 80);
  }

  async function doCreate() {
    const name = document.getElementById('save-name').value.trim();
    if (!name) { showStatus('status-create', 'err', t('msg.name_required')); return; }
    const res = await apiFetch('/api/saves', { method: 'POST', body: JSON.stringify({ name }) });
    if (!res) return;
    const data = await res.json();
    if (!res.ok) { showStatus('status-create', 'err', data.message || t('msg.error')); return; }
    closeModal();
    loadSaves();
  }

  // ── Delete save ───────────────────────────────────────────────────────────
  async function deleteSave(id, btn = null) {
    if (!confirm(t('saves.confirm_delete'))) return;
    if (btn) btn.disabled = true;
    const res = await apiFetch('/api/saves/' + id, { method: 'DELETE' });
    if (res && (res.ok || res.status === 204)) { loadSaves(); }
    else if (btn) btn.disabled = false;
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function fmtFactories(n) {
    if (!n) return esc(t('saves.factories_none'));
    return esc(t('saves.factory_count').replace('{n}', n));
  }

  function showStatus(id, cls, text) {
    const el = document.getElementById(id);
    el.className = 'status-msg ' + cls;
    el.textContent = text;
  }


  function fmtDate(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString(getLang(), { year:'numeric', month:'short', day:'numeric' });
  }

  loadSaves();
</script>
</body>
</html>
