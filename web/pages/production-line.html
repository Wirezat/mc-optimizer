<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MC Optimizer — Production Line</title>
  <link rel="stylesheet" href="/static/ui/index.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <script>
    (function(){
      const s = localStorage.getItem('theme');
      if (s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark');
    })();
  </script>
  <style>
    /* ── Stat row (meta) ─────────────────────────────────────────────────── */
    .stat-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--gap-card);
      margin-bottom: var(--gap-field);
    }
    .stat { display: flex; flex-direction: column; gap: 2px; min-width: 100px; }
    .stat-label {
      font-size: var(--text-xs);
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .stat-value {
      font-size: var(--text-base);
      font-weight: var(--weight-semibold);
      color: var(--text);
      font-family: var(--font-mono);
    }

    /* ── Paired stat (target / current) — two labelled rows in a tiny grid so
       the numbers share one left-aligned column after equal-width row labels.
       The current row only renders while the line is incomplete. ──────────── */
    .stat-pair {
      display: grid; grid-template-columns: max-content max-content;
      column-gap: var(--gap-inline); row-gap: 1px; align-items: baseline;
    }
    .stat-pair .row-label {
      font-size: 10px; color: var(--text-faint); font-family: var(--font-mono);
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .stat-pair .stat-value-current {
      font-size: var(--text-base); font-weight: var(--weight-normal);
      font-family: var(--font-mono); color: var(--text-muted);
    }

    /* ── Progress bar ────────────────────────────────────────────────────── */
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: var(--gap-control);
      margin-bottom: var(--gap-field);
    }
    .progress-track {
      flex: 1;
      height: 6px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      transition: width .3s;
    }
    .progress-fill.full { background: var(--success); }
    .progress-label {
      font-size: var(--text-xs);
      color: var(--text-muted);
      white-space: nowrap;
      font-family: var(--font-mono);
    }

    /* ── Machine group row — explicit columns: amount | machine | recipe |
       upgrades (blank when none) | build state | status toggle. Ported
       layout/classes from solve.html's result view where they overlap
       (mg-header/mg-row/mg-count/mg-machine/mg-mod). The build-state column
       holds at most two compact number fields (machines built, upgrades
       installed toward the group's own target tier); it disappears once the
       group is fully built, leaving just the status icon like before. ─────── */
    .mg-header {
      display: flex; align-items: center; gap: var(--gap-control);
      padding: 2px 0 var(--gap-inline);
      border-bottom: 1px solid var(--border);
      font-size: 10px; font-weight: var(--weight-bold); text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text-faint);
    }
    .mg-header .mg-count { font-size: 10px; }
    .mg-row {
      display: flex; align-items: center; gap: var(--gap-control);
      flex-wrap: wrap; /* build-state fields drop to a second line when tight */
      padding: var(--gap-inline) 0; border-bottom: 1px solid var(--border);
    }
    .mg-row:last-child { border-bottom: none; }
    .mg-count       { font-weight: var(--weight-bold); width: 32px; flex-shrink: 0; }
    .mg-machine-col { flex: 1 1 120px; min-width: 120px; }
    .mg-machine     { color: var(--text); font-size: var(--text-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mg-mod         { font-size: var(--text-xs); color: var(--text-faint); font-family: var(--mono); }
    .mg-recipe-col  { width: 120px; flex-shrink: 0; font-size: var(--text-xs); color: var(--text-muted); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mg-upgrade-col { width: 105px; flex-shrink: 0; font-size: var(--text-xs); color: var(--text-muted); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mg-state-col   { display: flex; gap: var(--gap-item); white-space: nowrap; margin-left: auto; }
    .mg-build-col   { width: 36px; flex-shrink: 0; display: flex; justify-content: flex-end; margin-left: auto; }
    .mg-state-col + .mg-build-col { margin-left: 0; }

    /* Build-state fields: compact "n / N" number inputs, no spinner arrows. */
    .mg-build-field {
      display: flex; align-items: center; gap: var(--gap-icon);
      font-size: var(--text-xs); color: var(--text-muted); font-family: var(--font-mono);
    }
    .mg-build-field-label {
      color: var(--text-faint); text-transform: uppercase;
      letter-spacing: 0.04em; font-size: 10px;
    }
    .mg-build-field input.input {
      width: 3em; height: var(--h-btn-sm); padding-inline: 2px; text-align: center;
      -moz-appearance: textfield; appearance: textfield;
    }
    .mg-build-field input.input::-webkit-inner-spin-button,
    .mg-build-field input.input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .mg-build-field .mg-build-max { color: var(--text-faint); }

    /* ── MG status toggle — same component as before, one extra state:
       planned (nothing built) / partial (some machines or upgrades missing) /
       built (complete). Derived from the numbers, click = fill/reset shortcut. */
    .mg-tog {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: var(--h-btn-sm);
      border-radius: var(--radius);
      border: 1px solid transparent;
      font-size: 14px;
      cursor: pointer;
      transition: background .12s, border-color .12s;
    }
    .mg-tog .tog-cur { display: inline; }
    .mg-tog .tog-nxt { display: none; font-size: 10px; letter-spacing: -.5px; }
    .mg-tog:hover .tog-cur { display: none; }
    .mg-tog:hover .tog-nxt { display: inline; }
    .mg-tog.planned { --_icon-color: var(--text-faint); }
    .mg-tog.partial { --_icon-color: var(--warn); }
    .mg-tog.built   { --_icon-color: var(--success); }

    /* ── IO list (ported from solve.html's result view) ──────────────────── */
    .io-section-label {
      font-size: var(--text-xs); font-weight: var(--weight-semibold);
      text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint);
      margin: var(--gap-control) 0 var(--gap-inline);
    }
    .io-section-label:first-child { margin-top: 0; }
    .io-row {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: var(--gap-control); padding: 3px 0; font-size: var(--text-sm);
    }
    .io-item { color: var(--text); }
    .io-item-primary { color: var(--accent); font-weight: var(--weight-semibold); }
    .io-sublabel { font-size: 10px; color: var(--text-faint); font-style: italic; font-family: var(--mono); }
    .io-rate { color: var(--text-muted); font-family: var(--font-mono); font-size: var(--text-xs); flex-shrink: 0; }
  </style>
</head>
<body class="app-shell">

  <!-- ── Header ── -->
  <header class="header">
    <a class="header-brand" href="/saves">
      <div class="header-logo">⚙️</div>
      <span>MC Optimizer</span>
    </a>
    <div class="header-right">
      <button data-wui-theme data-i18n-title="common.toggle_theme"></button>
      <div class="dropdown-wrap" data-wui-lang>
        <button data-dropdown-trigger></button>
        <div class="dropdown-panel">
          <button class="dropdown-item" data-lang="en">🇬🇧 English</button>
          <button class="dropdown-item" data-lang="de">🇩🇪 Deutsch</button>
        </div>
      </div>
      <div class="dropdown-wrap" data-wui-user-menu>
        <button class="user-menu-trigger" data-wui-user-trigger data-dropdown-trigger>
          <div class="avatar">?</div>
          <span class="username">…</span>
          <span class="chevron">▾</span>
        </button>
        <div class="dropdown-panel" data-wui-user-dropdown></div>
      </div>
    </div>
  </header>

  <div class="app-body">
    <nav class="sidebar"></nav>

    <main class="main">
      <div class="page">

        <!-- ── Page header ── -->
        <div class="page-header">
          <div>
            <div class="breadcrumb">
              <a href="/saves" data-i18n="nav.saves"></a>
              <span class="breadcrumb-sep">▸</span>
              <a id="bc-save" href="#"></a>
              <span class="breadcrumb-sep">▸</span>
              <a id="bc-factory" href="#"></a>
              <span class="breadcrumb-sep">▸</span>
              <span class="breadcrumb-current" id="bc-pl">…</span>
            </div>
            <div class="page-title" id="page-title">…</div>
          </div>
          <span class="pill" id="pl-status-pill"></span>
        </div>

        <!-- ── Split layout ── -->
        <div class="split-layout">

          <!-- ── main-panel: Meta + Machine Groups ── -->
          <div class="main-panel" style="display:flex;flex-direction:column;gap:var(--gap-container);">

            <!-- Meta + actions -->
            <div class="container">
              <div class="container-body">
                <div class="stat-row" id="pl-meta"></div>
                <div class="progress-wrap" id="progress-wrap" style="display:none;">
                  <div class="progress-track">
                    <div class="progress-fill" id="progress-fill"></div>
                  </div>
                  <span class="progress-label" id="progress-label"></span>
                </div>
                <div style="display:flex;gap:var(--gap-control);flex-wrap:wrap;" id="action-bar"></div>
              </div>
            </div>

            <!-- Machine Groups -->
            <div class="container">
              <div class="container-header">
                <span class="container-title" data-i18n="production_line.machine_groups"></span>
              </div>
              <div class="container-body" id="mg-list">
                <span class="td-faint" data-i18n="common.loading"></span>
              </div>
            </div>

          </div><!-- /.main-panel -->

          <!-- ── side-panel: IO Profile ── -->
          <div class="side-panel">
            <div class="container">
              <div class="container-header">
                <span class="container-title" data-i18n="production_line.io_profile"></span>
              </div>
              <div class="container-body" id="io-list">
                <span class="td-faint" data-i18n="common.loading"></span>
              </div>
            </div>
          </div>

        </div><!-- /.split-layout -->

      </div><!-- /.page -->
    </main>
  </div>

<script type="module">
  import { guard, apiFetch } from '/static/ui/js/auth.js';
  import { load, applyI18n, getLang, t, esc } from '/static/js/i18n.js';
  import { machine as machineName, loadMI } from '/static/js/i18n.js';
  import { init as initHeader } from '/static/js/header.js';
  import { loadCatalog, iconTextHTML } from '/static/js/catalog-registry.js';

  const _lang = getLang();
  await load(_lang);
  await loadMI(_lang);
  applyI18n();
  guard();
  initHeader();

  const _plID = window.location.pathname.split('/')[2];
  let _pl = null;
  let _tiers = []; // upgrade tiers, for resolving upgrade_tier_id -> name (display only, no editor here)
  let _recipeOutputs = new Map(); // recipe_id -> display name of what it produces

  async function init() {
    const [res, tRes] = await Promise.all([
      apiFetch('/api/production-lines/' + _plID),
      apiFetch('/api/upgrade-tiers'),
      loadCatalog(),
    ]);
    if (!res?.ok) { window.location.href = '/saves'; return; }
    _pl = await res.json();
    if (tRes?.ok) _tiers = await tRes.json();

    document.title = 'MC Optimizer — ' + _pl.name;
    document.getElementById('page-title').textContent = _pl.name;
    document.getElementById('bc-pl').textContent      = _pl.name;

    if (_pl.factory_id) {
      const fRes = await apiFetch('/api/factories/' + _pl.factory_id);
      if (fRes?.ok) {
        const { factory } = await fRes.json();
        document.getElementById('bc-factory').textContent = factory.name;
        document.getElementById('bc-factory').href        = '/factories/' + _pl.factory_id;
        const sRes = await apiFetch('/api/saves/' + factory.save_id);
        if (sRes?.ok) {
          const save = await sRes.json();
          document.getElementById('bc-save').textContent = save.name;
          document.getElementById('bc-save').href        = '/saves/' + factory.save_id;
        }
      }
    }

    await loadRecipeOutputs();
    render();
  }

  // machine_groups only stores recipe_id, not what it produces — resolve via
  // the recipe catalog (one fetch per distinct machine used, since that's the
  // catalog's own filter granularity) so the machine-group rows can show
  // "→ output name" like solve.html's draft result does.
  async function loadRecipeOutputs() {
    const machines = new Map(); // "mod:machine" -> {mod, machine}
    for (const g of (_pl.machine_groups || [])) {
      machines.set(g.machine_mod_id + ':' + g.machine_id, { mod: g.machine_mod_id, machine: g.machine_id });
    }
    await Promise.all([...machines.values()].map(async ({ mod, machine }) => {
      const res = await apiFetch(`/api/mods/${encodeURIComponent(mod)}/recipes?machine_id=${encodeURIComponent(machine)}`);
      if (!res?.ok) return;
      for (const r of await res.json()) {
        const out = r.item_outputs?.[0]?.item_name || r.fluid_outputs?.[0]?.fluid_name;
        if (out) _recipeOutputs.set(r.id, out);
      }
    }));
  }

  function render() {
    renderStatusPill();
    renderMeta();
    renderProgress();
    renderActionBar();
    renderMachineGroups();
    renderIO();
  }

  function renderStatusPill() {
    const pill = document.getElementById('pl-status-pill');
    const cls  = { active: 'pill-active', draft: 'pill-draft', archived: 'pill-archived' };
    pill.className   = 'pill ' + (cls[_pl.status] || '');
    pill.textContent = t('status.' + _pl.status) || _pl.status;
  }

  // A group is complete when all its machines stand AND (if it has a target upgrade
  // tier) all upgrades are installed. The whole line is complete when every group is.
  function isGroupComplete(g) {
    return (g.built_count || 0) >= g.count
        && (!g.upgrade_tier_id || (g.current_upgrade_count || 0) >= g.upgrade_count);
  }
  function isLineComplete() {
    const mgs = _pl.machine_groups || [];
    return mgs.length > 0 && mgs.every(isGroupComplete);
  }

  // Paired stat: bold target value, with the "current" value (from the real build
  // state) stacked directly below in the same column. The current row only shows
  // while the line is incomplete — once fully built it matches the target anyway.
  function statPair(label, targetVal, currentVal, showCurrent) {
    return `<div class="stat">
      <span class="stat-label">${esc(label)}</span>
      <div class="stat-pair">
        <span class="row-label">${esc(t('production_line.row.target'))}</span>
        <span class="stat-value">${targetVal}</span>
        ${showCurrent ? `<span class="row-label">${esc(t('production_line.row.current'))}</span>
        <span class="stat-value-current">${currentVal}</span>` : ''}
      </div>
    </div>`;
  }

  function renderMeta() {
    const rate       = fmtFrac(_pl.rate_num, _pl.rate_den) + ' /' + _pl.time_unit;
    const targetName = _pl.target_item_name || (_pl.target_item_id.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()));
    const incomplete = _pl.status === 'active' && !isLineComplete();
    const curRate    = fmtNum(_pl.current_rate || 0) + ' /' + _pl.time_unit;
    document.getElementById('pl-meta').innerHTML = `
      <div class="stat">
        <span class="stat-label">${esc(t('production_line.meta.target'))}</span>
        ${iconTextHTML(_pl.target_mod_id, _pl.target_item_id, { isFluid: _pl.target_is_fluid, name: targetName, subtitle: _pl.target_mod_id, size: 'lg' })}
      </div>
      <div class="stat">
        <span class="stat-label">${esc(t('production_line.meta.mode'))}</span>
        <span class="stat-value">${esc(_pl.optimize_mode.toUpperCase())}</span>
      </div>
      ${statPair(t('common.rate'), esc(rate), esc(curRate), incomplete)}
      ${(_pl.target_eu_per_tick || 0) > 0
        ? statPair('EU/t', _pl.target_eu_per_tick, _pl.current_eu_per_tick || 0, incomplete)
        : ''}
    `;
  }

  // Build progress is machine-weighted now that groups can be partially built:
  // sum of built_count over sum of count, not a count of fully-built groups.
  function renderProgress() {
    const mgs   = _pl.machine_groups || [];
    const total = mgs.reduce((s, g) => s + (g.count || 0), 0);
    const built = mgs.reduce((s, g) => s + Math.min(g.built_count || 0, g.count || 0), 0);
    const pw    = document.getElementById('progress-wrap');

    if (_pl.status === 'active' && total > 0) {
      pw.style.display = '';
      const fill = document.getElementById('progress-fill');
      fill.style.width = Math.round(built / total * 100) + '%';
      fill.classList.toggle('full', isLineComplete());
      document.getElementById('progress-label').textContent =
        `${built} / ${total} ${t('production_line.machines_built')}`;
    } else {
      pw.style.display = 'none';
    }
  }

  // Rate/upgrade editing (formerly "More output" resolve panel + per-group
  // upgrade editor) is being redone separately — this bar is just status
  // actions for now: mark machines built, archive the line.
  function renderActionBar() {
    const bar = document.getElementById('action-bar');

    if (_pl.status !== 'active') { bar.innerHTML = ''; return; }

    bar.innerHTML = `
      ${!isLineComplete() ? `<button class="btn btn-primary btn-sm" data-action="markAllBuilt">${esc(t('production_line.mark_all_built'))}</button>` : ''}
      <button class="btn btn-ghost btn-sm" data-action="archivePL">${esc(t('production_line.archive'))}</button>
    `;
    bar.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.action === 'markAllBuilt') markAllBuilt();
        if (btn.dataset.action === 'archivePL')    archivePL();
      });
    });
  }

  // Machine-group row layout ported from solve.html's result view (same
  // .mg-header/.mg-row classes). Rate/upgrade editing for the TARGET loadout
  // is being redone separately, not part of this pass — but the CURRENT build
  // state (machines built / upgrades installed) is editable inline per row.
  function renderMachineGroups() {
    const mgs       = _pl.machine_groups || [];
    const canToggle = _pl.status === 'active';
    const container = document.getElementById('mg-list');

    if (!mgs.length) {
      container.innerHTML = `<span class="td-faint">—</span>`;
      return;
    }

    const hdr = `<div class="mg-header">
      <div class="mg-count">${esc(t('solve.col.count'))}</div>
      <div class="mg-machine-col">${esc(t('solve.col.machine'))}</div>
      <div class="mg-recipe-col">${esc(t('solve.col.recipe'))}</div>
      <div class="mg-upgrade-col">${esc(t('solve.upgrade.label'))}</div>
      <div class="mg-state-col"></div>
      <div class="mg-build-col"></div>
    </div>`;
    container.innerHTML = hdr + mgs.map(g => mgRowHTML(g, canToggle)).join('');

    container.querySelectorAll('[data-mgtoggle]').forEach(btn => {
      btn.addEventListener('click', () => toggleMGStatus(btn.dataset.mgtoggle));
    });
    container.querySelectorAll('[data-built-input]').forEach(inp => {
      inp.addEventListener('change', () => onBuildFieldChange(inp, 'built_count'));
    });
    container.querySelectorAll('[data-upg-input]').forEach(inp => {
      inp.addEventListener('change', () => onBuildFieldChange(inp, 'current_upgrade_count'));
    });
  }

  // Derived group status: planned (nothing built), partial (something but not
  // everything), built (complete) — computed from built_count/current_upgrade_count,
  // never stored directly. The toggle icon reflects it; clicking is a shortcut:
  // planned/partial fill both numbers to target, built resets them to zero.
  function groupState(g) {
    if (isGroupComplete(g)) return 'built';
    if ((g.built_count || 0) === 0 && (g.current_upgrade_count || 0) === 0) return 'planned';
    return 'partial';
  }
  const STATE_GLYPH = { planned: '⚒', partial: '◐', built: '✓' };

  function mgRowHTML(g, canToggle) {
    const name     = machineName(g.machine_mod_id, g.machine_id);
    const outName  = _recipeOutputs.get(g.recipe_id) || '—';
    const tier     = g.upgrade_tier_id ? _tiers.find(tr => tr.id === g.upgrade_tier_id) : null;
    const upgText  = tier ? `${tier.name} ×${g.upgrade_count}` : '';
    const state    = groupState(g);
    const complete = state === 'built';
    const glyph    = STATE_GLYPH[state];
    const nxtGlyph = complete ? '✓→⚒' : `${glyph}→✓`;
    const togBtn   = canToggle
      ? `<button class="mg-tog btn-icon-color ${state}"
           data-mgtoggle="${esc(g.id)}"
           title="${esc(t('status.' + state))}">
           <span class="tog-cur">${glyph}</span>
           <span class="tog-nxt">${nxtGlyph}</span>
         </button>`
      : `<span class="mg-tog ${state}" style="color:var(--_icon-color);cursor:default;">${glyph}</span>`;

    // Build-state fields: hidden once the group is complete — nothing left to
    // adjust, the row falls back to the plain single-icon display.
    const fields = (canToggle && !complete) ? `
      <label class="mg-build-field">
        <span class="mg-build-field-label">${esc(t('production_line.build.built'))}</span>
        <input class="input" type="number" min="0" max="${g.count}" step="1" value="${g.built_count || 0}"
               data-built-input="${esc(g.id)}" data-max="${g.count}" />
        <span class="mg-build-max">/${g.count}</span>
      </label>
      ${g.upgrade_tier_id ? `<label class="mg-build-field">
        <span class="mg-build-field-label">${esc(t('production_line.build.upg'))}</span>
        <input class="input" type="number" min="0" max="${g.upgrade_count}" step="1" value="${g.current_upgrade_count || 0}"
               data-upg-input="${esc(g.id)}" data-max="${g.upgrade_count}" />
        <span class="mg-build-max">/${g.upgrade_count}</span>
      </label>` : ''}` : '';

    return `<div class="mg-row">
      <div class="mg-count">${g.count}×</div>
      <div class="mg-machine-col">
        <div class="mg-machine">${esc(name)}</div>
        <div class="mg-mod">${esc(g.machine_mod_id)}</div>
      </div>
      <div class="mg-recipe-col" title="${esc(outName)}">${esc(outName)}</div>
      <div class="mg-upgrade-col" title="${esc(upgText)}">${esc(upgText)}</div>
      <div class="mg-state-col">${fields}</div>
      <div class="mg-build-col">${togBtn}</div>
    </div>`;
  }

  // IO row layout ported from solve.html's result view (.io-row), label rendered
  // via catalog-registry's iconTextHTML (see the ★ primary marker below).
  function renderIO() {
    const ioEl    = document.getElementById('io-list');
    const all     = _pl.io || [];
    const inputs  = all.filter(e => e.direction === 'input');
    const outputs = all.filter(e => e.direction === 'output');

    let html = '';
    if (inputs.length) {
      html += `<div class="io-section-label">${esc(t('solve.inputs'))}</div>`;
      html += inputs.map(e => ioRow(e, false)).join('');
    }
    if (outputs.length) {
      html += `<div class="io-section-label">${esc(t('solve.outputs'))}</div>`;
      html += outputs.map((e, i) => ioRow(e, i === 0)).join('');
    }
    ioEl.innerHTML = html || `<span class="td-faint">—</span>`;
  }

  function ioRow(e, isPrimary) {
    const rate = fmtFrac(e.rate_num, e.rate_den) + ' /' + (_pl.time_unit || 't');
    // Same fallback as targetName above: a name-less id (mid-import, before
    // translations load) still reads as words instead of raw snake_case.
    const name  = e.name || e.item_fluid_id.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
    const label = iconTextHTML(e.mod_id, e.item_fluid_id, {
      isFluid:  e.io_type === 'fluid',
      name,
      subtitle: e.mod_id,
      size:     'sm',
    });
    return `<div class="io-row">
      <div style="flex:1;min-width:0;display:flex;align-items:center;gap:var(--gap-icon);">
        ${isPrimary ? '<span class="io-item-primary">★</span>' : ''}${label}
      </div>
      <div class="io-rate">${esc(rate)}</div>
    </div>`;
  }

  // ── Actions ───────────────────────────────────────────────────────────────
  async function markAllBuilt() {
    const res = await apiFetch('/api/production-lines/' + _plID + '/mark-built', { method: 'PATCH', body: '{}' });
    if (res?.ok || res?.status === 200) reload();
  }

  async function archivePL() {
    if (!confirm(t('production_line.confirm_archive'))) return;
    const res = await apiFetch('/api/production-lines/' + _plID + '/status', {
      method: 'PATCH', body: JSON.stringify({ status: 'archived' }),
    });
    if (res?.ok || res?.status === 204) reload();
  }

  // Sends the group's new build state; the stored coarse status is kept in sync
  // as a side effect ('built' when complete, 'planned' otherwise) so other views
  // filtering on status stay correct. Always reloads — also on error, to snap an
  // invalid input back to the server's state.
  async function updateBuildState(g, builtCount, currentUpgradeCount) {
    const complete = builtCount >= g.count
      && (!g.upgrade_tier_id || currentUpgradeCount >= g.upgrade_count);
    await apiFetch('/api/machine-groups/' + g.id + '/status', {
      method: 'PATCH', body: JSON.stringify({
        status: complete ? 'built' : 'planned',
        built_count: builtCount,
        current_upgrade_count: currentUpgradeCount,
      }),
    });
    reload();
  }

  function findGroup(id) {
    return (_pl.machine_groups || []).find(g => g.id === id);
  }

  // Toggle shortcut: planned/partial fill the build state to target, built resets it.
  function toggleMGStatus(id) {
    const g = findGroup(id);
    if (!g) return;
    if (isGroupComplete(g)) updateBuildState(g, 0, 0);
    else updateBuildState(g, g.count, g.upgrade_tier_id ? g.upgrade_count : 0);
  }

  function onBuildFieldChange(inp, field) {
    const g = findGroup(inp.dataset.builtInput || inp.dataset.upgInput);
    if (!g) return;
    const max = Number(inp.dataset.max);
    let v = Math.round(Number(inp.value));
    if (!Number.isFinite(v) || v < 0) v = 0;
    if (v > max) v = max;
    const built = field === 'built_count' ? v : (g.built_count || 0);
    const upg   = field === 'current_upgrade_count' ? v : (g.current_upgrade_count || 0);
    updateBuildState(g, built, upg);
  }

  async function reload() {
    const res = await apiFetch('/api/production-lines/' + _plID);
    if (!res?.ok) return;
    _pl = await res.json();
    render();
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function fmtFrac(num, den) {
    if (!den || den === 1) return String(num);
    return fmtNum(num / den);
  }

  function fmtNum(v) {
    const r = Math.round(v * 10000) / 10000;
    return Number.isInteger(r) ? String(r) : r.toFixed(4).replace(/\.?0+$/, '');
  }

  init();
</script>
</body>
</html>
