<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MC Optimizer — Data Import</title>
  <link rel="stylesheet" href="/static/ui/index.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <script>
    (function(){
      const s = localStorage.getItem('theme');
      if (s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark');
    })();
  </script>
  <style>
    /* ── Progress bar (flush, above drop zone) ─────────────────────────────── */
    .import-progress {
      height: 3px;
      background: var(--border);
      overflow: hidden;
      display: none;
    }
    .import-progress.visible { display: block; }
    .import-progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s;
    }

    /* ── Drop zone ─────────────────────────────────────────────────────────── */
    .import-drop {
      margin: var(--pad-container);
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: var(--gap-section) var(--pad-card);
      text-align: center;
      color: var(--text-faint);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
      background: var(--bg);
    }
    .import-drop:hover, .import-drop.drag-over {
      border-color: var(--accent);
      background: var(--accent-muted);
      color: var(--text);
    }
    .import-drop.disabled { opacity: 0.5; pointer-events: none; }
    .import-drop-icon  { font-size: 24px; display: block; margin-bottom: var(--gap-inline); opacity: 0.5; }
    .import-drop-main  { font-size: var(--text-sm); color: var(--text); }
    .import-drop-browse {
      color: var(--accent); text-decoration: underline; cursor: pointer;
      background: none; border: none; font-size: inherit; font-family: inherit; padding: 0;
    }
    .import-drop-file {
      font-size: var(--text-sm);
      font-weight: var(--weight-semibold);
      color: var(--accent);
      margin-top: var(--gap-inline);
    }
    .import-drop-sub { font-size: var(--text-xs); color: var(--text-faint); margin-top: var(--gap-inline); }

    /* ── Action row (bottom of container) ─────────────────────────────────── */
    .import-actions {
      display: flex;
      align-items: center;
      gap: var(--gap-control);
      padding: var(--gap-inline) var(--pad-container);
      border-top: 1px solid var(--border);
    }
    .import-status     { font-size: var(--text-sm); }
    .import-status.ok  { color: var(--success); }
    .import-status.err { color: var(--danger); }

    /* ── Result stats ──────────────────────────────────────────────────────── */
    .import-stat-row { display: flex; gap: var(--pad-card); flex-wrap: wrap; }
    .import-stat { display: flex; align-items: center; gap: var(--gap-inline); }
    .import-stat-num   { font-size: var(--text-md); font-weight: var(--weight-bold); color: var(--accent); }
    .import-stat-label { font-size: var(--text-sm); color: var(--text-muted); }

    /* ── Warnings ──────────────────────────────────────────────────────────── */
    .import-warn-list { margin-top: var(--gap-control); max-height: 160px; overflow-y: auto; }
    .import-warn-line {
      font-family: var(--mono);
      font-size: var(--text-xs);
      color: var(--text-muted);
      padding: 2px 0;
      word-break: break-all;
    }
  </style>
</head>
<body class="app-shell">

  <!-- ── Header ── -->
  <header class="header">
    <a class="header-brand" href="/saves">
      <div class="header-logo">⚙️</div>
      <span>MC Optimizer</span>
    </a>
    <div class="header-right">
      <button data-wui-theme data-i18n-title="common.toggle_theme"></button>
      <div class="dropdown-wrap" data-wui-lang>
        <button data-dropdown-trigger></button>
        <div class="dropdown-panel">
          <button class="dropdown-item" data-lang="en">🇬🇧 English</button>
          <button class="dropdown-item" data-lang="de">🇩🇪 Deutsch</button>
        </div>
      </div>
      <div class="dropdown-wrap" data-wui-user-menu>
        <button class="user-menu-trigger" data-wui-user-trigger data-dropdown-trigger>
          <div class="avatar">?</div>
          <span class="username">…</span>
          <span class="chevron">▾</span>
        </button>
        <div class="dropdown-panel" data-wui-user-dropdown></div>
      </div>
    </div>
  </header>

  <div class="app-body">
    <nav class="sidebar"></nav>

    <main class="main">
      <div class="page">

        <div class="page-header">
          <div>
            <div class="page-title" data-i18n="admin.import.title"></div>
            <div class="page-subtitle" data-i18n="admin.import.subtitle"></div>
          </div>
        </div>

        <!-- Import card -->
        <div class="container" style="max-width:600px">

          <div class="container-header">
            <span class="container-title" data-i18n="admin.import.title"></span>
            <span class="view-picker-label" id="mod-count"></span>
          </div>

          <!-- Template downloads -->
          <div class="container-body" style="padding-bottom:0;display:flex;align-items:center;gap:var(--gap-control);flex-wrap:wrap">
            <a class="btn btn-ghost btn-sm" href="/static/data/mod-template.yml" download data-i18n="admin.import.template.download"></a>
            <a class="btn btn-ghost btn-sm" href="/static/data/example-iron_furnaces.yml" download data-i18n="admin.import.template.example"></a>
            <span class="field-caption" data-i18n="admin.import.template.hint"></span>
          </div>

          <!-- Progress bar (flush) -->
          <div class="import-progress" id="progress-bar">
            <div class="import-progress-fill" id="progress-fill"></div>
          </div>

          <!-- Drop zone -->
          <div class="import-drop" id="drop-zone">
            <span class="import-drop-icon">📦</span>
            <div class="import-drop-main">
              <span data-i18n="admin.import.drop_hint"></span>
              <button class="import-drop-browse" id="drop-browse" data-i18n="admin.import.browse"></button>
            </div>
            <div class="import-drop-file" id="drop-file"></div>
            <div class="import-drop-sub" data-i18n="admin.import.drop_sub"></div>
          </div>
          <input type="file" id="zip-input" accept=".zip" style="display:none" />

          <!-- Actions -->
          <div class="import-actions">
            <button class="btn btn-primary btn-sm" id="import-btn" disabled data-i18n="admin.import.btn"></button>
            <span class="import-status" id="import-status"></span>
          </div>

        </div>

        <!-- Result (shown after successful import) -->
        <div class="container" id="import-result" style="max-width:600px;margin-top:var(--gap-section);display:none">
          <div class="container-header">
            <span class="container-title" id="import-result-mod"></span>
          </div>
          <div class="container-body">
            <div class="import-stat-row" id="import-stats"></div>
            <div class="import-warn-list" id="import-warnings"></div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Modal (wirezatUI) -->
  <div class="modal-backdrop" data-wui-modal>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="wui-modal-title">
      <div class="modal-header">
        <span class="modal-title" data-modal-title id="wui-modal-title"></span>
        <button class="modal-close" data-modal-close>✕</button>
      </div>
      <div class="modal-body" data-modal-body></div>
      <div class="modal-footer">
        <button class="btn btn-ghost" data-modal-cancel data-i18n="common.cancel"></button>
        <button class="btn btn-primary" data-modal-confirm></button>
      </div>
    </div>
  </div>

<script type="module">
  import { guard, apiFetch, getUser } from '/static/ui/js/auth.js';
  import { load, applyI18n, getLang, t, esc } from '/static/js/i18n.js';
  import { init as initHeader } from '/static/js/header.js';
  import { initModal, openModal } from '/static/ui/js/modal.js';

  await load(getLang());
  applyI18n();
  guard();
  initHeader();
  initModal();

  async function init() {
    const user = await getUser();
    if (!user?.is_admin) { window.location.href = '/personal'; return; }
    loadStatus();
  }

  async function loadStatus() {
    try {
      const res = await apiFetch('/api/import/status');
      if (!res?.ok) return;
      const s = await res.json();
      document.getElementById('mod-count').textContent =
        t('admin.import.total_mods').replace('{n}', s.total_mods);
    } catch(e) { console.warn('status:', e); }
  }

  let _file = null;

  const zipInput = document.getElementById('zip-input');
  const dropZone = document.getElementById('drop-zone');

  dropZone.addEventListener('click', () => zipInput.click());
  document.getElementById('drop-browse').addEventListener('click', e => {
    e.stopPropagation();
    zipInput.click();
  });
  dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f) setFile(f);
  });
  zipInput.addEventListener('change', () => { if (zipInput.files[0]) setFile(zipInput.files[0]); });

  document.getElementById('import-btn').addEventListener('click', runImport);

  function setFile(f) {
    _file = f;
    document.getElementById('drop-file').textContent = f.name;
    document.getElementById('import-btn').disabled = false;
    setStatus('', '');
  }

  async function runImport() {
    if (!_file) return;
    const btn = document.getElementById('import-btn');
    btn.disabled = true;
    dropZone.classList.add('disabled');
    document.getElementById('import-result').style.display = 'none';
    setStatus('', '');

    const pb = document.getElementById('progress-bar');
    const pf = document.getElementById('progress-fill');
    pb.classList.add('visible');
    pf.style.width = '15%';

    try {
      const form = new FormData();
      form.append('modfile', _file);
      const res = await apiFetch('/api/import/modfile', { method: 'POST', body: form });
      pf.style.width = '85%';
      const data = await res.json();
      pf.style.width = '100%';
      setTimeout(() => { pb.classList.remove('visible'); pf.style.width = '0%'; }, 350);
      dropZone.classList.remove('disabled');

      const result = Array.isArray(data) ? data[0] : data;

      if (!res.ok) {
        document.getElementById('import-result-mod').textContent = '';
        document.getElementById('import-stats').innerHTML =
          `<div class="import-stat"><span class="import-stat-num" style="color:var(--danger)">${t('common.error')}</span><span class="import-stat-label">${esc(result?.message || String(res.status))}</span></div>`;
        document.getElementById('import-warnings').innerHTML = '';
        document.getElementById('import-result').style.display = '';
        setStatus(t('msg.save_error'), 'err');
        btn.disabled = false;
        return;
      }

      document.getElementById('import-result-mod').textContent = result.mod_id || '';
      document.getElementById('import-stats').innerHTML = [
        stat(result.machines,         t('admin.import.stat.machines')),
        stat(result.recipes_imported, t('admin.import.stat.recipes')),
        stat(result.items,            t('admin.import.stat.items')),
        stat(result.fluids,           t('admin.import.stat.fluids')),
        stat(result.translations,     t('admin.import.stat.translations')),
        stat(result.tags,             t('admin.import.stat.tags')),
        stat(result.textures,         t('admin.import.stat.textures')),
        stat(result.block_drops,      t('admin.import.stat.block_drops')),
        stat(result.villager_trades,  t('admin.import.stat.villager_trades')),
      ].filter(Boolean).join('');

      document.getElementById('import-warnings').innerHTML = (result.warnings || [])
        .map(w => `<div class="import-warn-line">${esc(w)}</div>`)
        .join('');

      document.getElementById('import-result').style.display = '';
      setStatus(t('msg.saved'), 'ok');
      document.getElementById('drop-file').textContent = '';
      _file = null;
      btn.disabled = true;
      loadStatus();

      openModal({
        title:        t('admin.import.verify.title'),
        bodyHTML:     `<p>${esc(t('admin.import.verify.body'))}</p>`,
        confirmLabel: t('admin.import.verify.confirm'),
        onConfirm:    () => { window.location.href = '/catalog/machines'; },
      });
    } catch(e) {
      pb.classList.remove('visible');
      dropZone.classList.remove('disabled');
      setStatus(t('msg.network_error') + ': ' + e.message, 'err');
    }
  }

  function setStatus(msg, type) {
    const el = document.getElementById('import-status');
    el.textContent = msg;
    el.className = 'import-status' + (type ? ' ' + type : '');
  }

  function stat(n, label) {
    if (!n) return '';
    return `<div class="import-stat"><span class="import-stat-num">${n}</span><span class="import-stat-label">${label}</span></div>`;
  }

  init();
</script>
</body>
</html>
