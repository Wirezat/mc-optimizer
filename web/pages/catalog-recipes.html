<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MC Optimizer — Recipes</title>
  <link rel="stylesheet" href="/static/ui/index.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <link rel="stylesheet" href="/static/css/catalog-common.css" />
  <script>
    (function(){
      const s = localStorage.getItem('theme');
      if (s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark');
    })();
  </script>
  <style>
    .table-expand-trigger.open { display: inline-block; transform: rotate(90deg); }
    .crafting-layout { display: flex; align-items: flex-start; gap: var(--gap-container); }
    .crafting-grid { display: grid; gap: 2px; flex-shrink: 0; }
    .crafting-cell { width: 36px; height: 36px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-hover); display: flex; align-items: center; justify-content: center; font-size: var(--text-xs); color: var(--text-muted); text-align: center; line-height: 1.2; overflow: hidden; }
    .crafting-cell.empty { opacity: .3; }
    .crafting-cell--nc { border-style: dashed; opacity: .75; }
    .crafting-cell { position: relative; cursor: help; }
    .crafting-cell.empty { cursor: default; }
    /* The texture fills the slot, the way an item fills its inventory square. */
    .crafting-cell-icon {
      width: 100%; height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
    }
    /* Plain-text stand-in when an item has no texture; it has to live inside
       the same 36px square, so it gets the padding the icon does not want. */
    .crafting-cell-text {
      --crafting-text-pad: 2px;
      padding: var(--crafting-text-pad);
      overflow: hidden;
    }
    /* Stack count, bottom-right over the texture, as the game draws it. The
       outline keeps it legible on top of any texture underneath. */
    .crafting-cell-count {
      --crafting-count-size: 10px;
      --crafting-count-inset: 1px;
      --crafting-count-outline: #000;
      position: absolute;
      right: var(--crafting-count-inset);
      bottom: var(--crafting-count-inset);
      font-size: var(--crafting-count-size);
      font-weight: var(--weight-semibold);
      font-family: var(--font-mono);
      color: #fff;
      text-shadow: 1px 1px 0 var(--crafting-count-outline), -1px 1px 0 var(--crafting-count-outline),
                   1px -1px 0 var(--crafting-count-outline), -1px -1px 0 var(--crafting-count-outline);
      pointer-events: none;
    }
    /* Moved off the bottom-right corner so it cannot collide with the count. */
    .nc-badge { position: absolute; top: 0; left: 2px; font-size: 8px; color: var(--text-faint); pointer-events: none; }
    .crafting-arrow { font-size: 1.2em; color: var(--text-faint); align-self: center; }
    .crafting-result { display: flex; flex-direction: column; gap: var(--gap-inline); justify-content: center; }
  </style>
</head>
<body class="app-shell">
  <header class="header">
    <a class="header-brand" href="/saves"><div class="header-logo">⚙️</div><span>MC Optimizer</span></a>
    <div class="header-right">
      <button data-wui-theme data-i18n-title="common.toggle_theme"></button>
      <div class="dropdown-wrap" data-wui-lang><button data-dropdown-trigger></button><div class="dropdown-panel"><button class="dropdown-item" data-lang="en">🇬🇧 English</button><button class="dropdown-item" data-lang="de">🇩🇪 Deutsch</button></div></div>
      <div class="dropdown-wrap" data-wui-user-menu><button class="user-menu-trigger" data-wui-user-trigger data-dropdown-trigger><div class="avatar">?</div><span class="username">…</span><span class="chevron">▾</span></button><div class="dropdown-panel" data-wui-user-dropdown></div></div>
    </div>
  </header>
  <div class="app-body">
    <nav class="sidebar"></nav>
    <main class="main"><div class="page">

      <div class="page-header" data-page-header-area>
        <div class="page-title-row">
          <h1 class="page-title" data-i18n="catalog.recipes.title"></h1>
        </div>
      </div>

      <div class="container">
        <div class="container-header">
          <span class="container-title" id="recipe-count"></span>
        </div>
        <div class="container-filter">
          <div class="wui-ac-wrap" style="width:260px;">
            <input class="input" id="recipe-search" data-i18n-placeholder="catalog.search_placeholder"
              style="width:100%;height:var(--h-btn-sm);" autocomplete="off" />
            <div class="wui-ac-drop" id="recipe-search-ac"></div>
          </div>
        </div>
        <div class="container-body-flush">
          <table class="table">
            <thead>
              <tr>
                <th style="width:24px;"></th>
                <th data-i18n="catalog.recipes.col.machine"></th>
                <!-- TODO: name column hidden until recipes have proper names
                <th style="width:120px;" data-i18n="catalog.mods.col.name"></th> -->
                <th data-i18n="catalog.recipes.section.recipes" style="width:100%;"></th>
                <th style="width:80px;" data-i18n="catalog.recipes.col.duration"></th>
                <th style="width:70px;">EU/t</th>
                <th style="width:80px;" data-i18n="catalog.recipes.col.total_eu"></th>
              </tr>
            </thead>
            <tbody id="recipe-tbody">
              <tr><td colspan="6" class="td-muted" style="padding:16px;text-align:center;" data-i18n="catalog.empty.loading"></td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div></main>
  </div>
</div>

<script type="module">
  import { guard, apiFetch } from '/static/ui/js/auth.js';
  import { load, applyI18n, getLang, t, esc } from '/static/js/i18n.js';
  import { init as initHeader } from '/static/js/header.js';
  import { initCellClampScroll } from '/static/ui/js/table-features.js';
  import { WuiAutocomplete } from '/static/ui/js/autocomplete.js';
  import { wuiFilter } from '/static/ui/js/filter.js';
  import { initInfocards } from '/static/ui/js/infocard.js';
  import { initIconCycle } from '/static/ui/js/icon-cycle.js';
  import { initHiDPIRender } from '/static/ui/js/hidpi-render.js';
  import { loadCatalog, lookupCatalog, lookupTag, iconImageHTML } from '/static/js/catalog-registry.js';
  import { VirtualWindow } from '/static/ui/js/virtual-window.js';

  await load(getLang());
  applyI18n();
  guard();
  initHeader();

  const openGroups = new Map(); // modId -> VirtualWindow

  const tbody = document.getElementById('recipe-tbody');
  const table = tbody.closest('table');
  let groupBodies = []; // sibling <tbody> pairs appended per mod (browse mode)
  const countEl = document.getElementById('recipe-count');
  const searchEl = document.getElementById('recipe-search');

  const params = new URLSearchParams(location.search);
  const urlMod     = params.get('mod')     || '';
  const urlMachine = params.get('machine') || '';
  const urlItem    = params.get('item')    || '';
  const urlFluid   = params.get('fluid')   || '';

  // modId → { name, recipe_count } (from /api/mods)
  let allMods = [];
  // modId → recipes[] (loaded on demand)
  const modRecipeCache = new Map();
  // "modId:machineId" → Map(recipeId → fullRecipe) (loaded on expand)
  const machineCache = new Map();
  // recipeId → rendered expand HTML
  const ioCache = new Map();


  function summaryList(ios) {
    return ios.slice(0, 3).map(io => io.item_name || io.fluid_name || io.tag_name || io.item_id || io.fluid_id || '?').join(', ')
      + (ios.length > 3 ? ` +${ios.length - 3}` : '');
  }

  function fmt0(v, suffix) {
    return (v == null || v === 0) ? '—' : (v + (suffix || ''));
  }

  // A crafting cell is a fixed 36px square. An icon beside a label leaves the
  // label no room at that size, so the texture fills the slot on its own and
  // the plain name stands in only when there is no texture.
  // Resolves both at once: the cell's fill and the hover card's icon.
  function cellParts(modID, id, isFluid, name) {
    const entry = lookupCatalog(modID, id, isFluid);
    return {
      entry,
      name:  name || id || '?',
      label: entry?.textureUrl
        ? iconImageHTML(entry, { cls: 'crafting-cell-icon', hidpiPx: 36 })
        : `<span class="crafting-cell-text">${esc(name || id || '?')}</span>`,
    };
  }

  // Cell plus its hover card, as one unit. Where the texture replaces the label
  // the display name has nowhere else to go, and 36px truncates any amount — the
  // card carries both, along with the raw ref. It uses the app's own infocard
  // system rather than a native title="": the browser's tooltip delay is
  // uncontrollable and would not match the infocards used on every other page.
  // The def is the cell's immediately following sibling (infocard inline mode);
  // it is display:none, so it never claims a grid track.
  // A tag slot accepts any of its members, so showing one of them would claim
  // the recipe needs that particular item. It cycles instead, the way JEI does,
  // and the hover card lays the whole set out at once.
  const TAG_CARD_ICONS = 12;

  // Grid stays at a fixed column count so its cells keep the size of an icon.
  // Sizing the columns to the member count instead blows a single member up to
  // the full card width, and the tag's card stops looking like an item's.
  const TAG_CARD_COLS = 6;

  // Same shape cellParts returns, so a tag slot and an item slot go through
  // craftCell identically and their cards come out looking the same. The
  // members only add a grid underneath; they do not replace the header.
  function tagCell(tagName) {
    const resolved = lookupTag(tagName);
    const icons = resolved?.icons ?? [];
    const total = resolved?.total ?? 0;
    const first = icons[0] ?? null;
    return {
      name:  '#' + tagName,
      // The card's icon is the same texture the cell shows first.
      entry: first,
      // A tag has no mod:id of its own; what it stands for goes here instead.
      ref:   total === 0 ? ''
           : total === 1 ? t('catalog.recipes.card.tag_members_one')
           : t('catalog.recipes.card.tag_members').replace('{n}', total),
      label: first
        ? iconImageHTML(first, {
            cls: 'crafting-cell-icon',
            hidpiPx: 36,
            // More than one member means no single texture is the right answer,
            // so the cell rotates through them.
            dataset: icons.length > 1
              ? { 'wui-cycle': JSON.stringify(icons.map(i => ({ src: i.textureUrl }))) }
              : null,
          })
        : `<span class="crafting-cell-text">#${esc(tagName)}</span>`,
      extra: tagCardGrid(icons, total),
    };
  }

  // The member grid, using the infocard's own grid slot.
  function tagCardGrid(icons, total) {
    if (icons.length < 2) return '';   // one member is already the card's icon
    const shown = icons.slice(0, TAG_CARD_ICONS);
    const cells = shown.map(e =>
      `<div class="infocard-grid-cell" data-label="${esc(e.name)}">` +
      iconImageHTML(e, { placeholder: false, hidpiPx: 36 }) + '</div>').join('');
    const more = total > shown.length
      ? `<div class="infocard-section td-muted">+${total - shown.length}</div>`
      : '';
    return `<div class="infocard-grid" data-cols="${TAG_CARD_COLS}">${cells}</div>${more}`;
  }

  // count is the bare number drawn in the corner; amount carries the unit and
  // stays in the hover card, where there is room for it.
  function craftCell({ label, name, ref = '', entry = null,
                       count = '', amount = '', nonConsuming = false, extra = '' }) {
    const countMark = count ? `<span class="crafting-cell-count">${esc(count)}</span>` : '';
    const ncMark  = nonConsuming ? `<span class="nc-badge">↺</span>` : '';
    const icon    = iconImageHTML(entry, { cls: 'infocard-icon', placeholder: false, hidpiPx: 28 });
    const amtRow  = amount
      ? `<div class="infocard-section"><div class="infocard-row">` +
        `<span class="infocard-key">${esc(t('catalog.recipes.card.amount'))}</span>` +
        `<span class="infocard-val">${esc(amount)}</span></div></div>`
      : '';
    const ncRow = nonConsuming
      ? `<div class="infocard-section">${esc(t('recipe.non_consuming_title'))}</div>`
      : '';
    // Tags pass no ref: they have no mod id, so the ref would be nothing but
    // the tag name the title already shows, under a stray leading ':'.
    const sub = ref ? `<span class="infocard-subtitle">${esc(ref)}</span>` : '';
    return `<div class="crafting-cell${nonConsuming ? ' crafting-cell--nc' : ''}" data-infocard-inline>${label}${countMark}${ncMark}</div>
      <div class="infocard-def" hidden>
        <div class="infocard-header">${icon}
          <div class="infocard-heading">
            <span class="infocard-title">${esc(name)}</span>
            ${sub}
          </div>
        </div>${amtRow}${ncRow}${extra}
      </div>`;
  }

  function ioGrid(items) {
    if (!items.length) return `<div class="crafting-cell empty" style="width:36px;height:36px;"></div>`;
    const cols = Math.max(1, Math.ceil(Math.sqrt(items.length)));
    const rows = Math.ceil(items.length / cols);
    const total = cols * rows;
    const style = `grid-template-columns:repeat(${cols},36px);grid-template-rows:repeat(${rows},36px);`;
    let cells = '';
    for (let i = 0; i < total; i++) {
      if (i >= items.length) { cells += `<div class="crafting-cell empty"></div>`; continue; }
      const io      = items[i];
      const isFluid = io.fluid_id != null;
      // The corner takes the bare number; the unit belongs in the hover card.
      const count   = isFluid && io.amount_mb ? String(io.amount_mb)
        : (io.amount_num > 1 ? String(io.amount_num) : '');
      const amount  = isFluid && io.amount_mb ? io.amount_mb + 'mB'
        : (io.amount_num > 1 ? io.amount_num + '×' : '');
      if (io.tag_name) {
        cells += craftCell({ ...tagCell(io.tag_name), count, amount,
                             nonConsuming: io.non_consuming });
        continue;
      }
      const ref = isFluid
        ? (io.fluid_mod_id + ':' + io.fluid_id)
        : ((io.item_mod_id || '') + ':' + (io.item_id || ''));
      const parts = isFluid
        ? cellParts(io.fluid_mod_id, io.fluid_id, true,  io.fluid_name)
        : cellParts(io.item_mod_id,  io.item_id,  false, io.item_name);
      cells += craftCell({ ...parts, ref, count, amount, nonConsuming: io.non_consuming });
    }
    return `<div class="crafting-grid" style="${style}">${cells}</div>`;
  }

  function craftingGrid(shape, inputs) {
    // slot key → the slot's full cell + card markup
    const cellFor = {};
    for (const io of inputs) {
      const key = io.tag_id ? ('#' + (io.tag_name || io.tag_id)) : (io.item_mod_id + ':' + io.item_id);
      if (io.tag_name) {
        cellFor[key] = craftCell(tagCell(io.tag_name));
        continue;
      }
      cellFor[key] = craftCell({
        ...cellParts(io.item_mod_id, io.item_id, false, io.item_name), ref: key,
      });
    }
    const cells = shape.map(slot => {
      if (!slot) return `<div class="crafting-cell empty"></div>`;
      const bare = slot.split(':').pop();
      return cellFor[slot] || cellFor['#' + slot]
        || craftCell({
             label: `<span class="crafting-cell-text">${esc(bare)}</span>`,
             name: bare, ref: slot,
           });
    });
    return `<div class="crafting-grid" style="grid-template-columns:repeat(3,36px);grid-template-rows:repeat(3,36px);">${cells.join('')}</div>`;
  }

  function recipeRows(recipes) {
    let html = '';
    for (const r of recipes) {
      const expandId = 'rdetail-' + esc(r.id);
      html += `<tr data-mod="${esc(r.source_mod_id)}" data-expand-row="${expandId}" style="cursor:pointer;">
        <td><span class="table-expand-trigger" data-expand="${expandId}">▸</span></td>
        <td style="max-width:160px;">
          <span class="cell-clamp cell-clamp--scroll"><span class="cell-clamp-inner"><a href="/catalog/machines?mod=${encodeURIComponent(r.machine_mod_id)}&machine=${encodeURIComponent(r.machine_id)}" class="catalog-link">${esc(r.machine_name || r.machine_id)}</a></span></span>
        </td>
        <td class="td-muted"><span class="cell-clamp cell-clamp--scroll"><span class="cell-clamp-inner" id="summary-out-${esc(r.id)}">…</span></span></td>
        <td class="td-muted">${fmt0(r.duration_ticks, 't')}</td>
        <td class="td-muted">${fmt0(r.eu_per_tick)}</td>
        <td class="td-muted">${r.total_eu ? r.total_eu.toLocaleString() : '—'}</td>
      </tr>
      <tr class="table-expand-row" id="${expandId}" data-recipe-id="${esc(r.id)}" data-mod="${esc(r.source_mod_id)}">
        <td colspan="6"><div class="table-expand-body" id="rbody-${esc(r.id)}">
          <span class="td-muted" style="font-size:var(--text-sm);">${t('catalog.empty.loading')}</span>
        </div></td>
      </tr>`;
    }
    return html;
  }

  // Populate summary cells for all recipes of a machine; always re-runs for re-rendered cells.
  async function ensureMachineLoaded(modId, machineId) {
    const key = modId + ':' + machineId;
    let byId;
    if (machineCache.has(key)) {
      byId = machineCache.get(key);
    } else {
      const res = await apiFetch(`/api/mods/${encodeURIComponent(modId)}/recipes?machine_id=${encodeURIComponent(machineId)}`);
      const recipes = res?.ok ? await res.json() : [];
      byId = new Map(recipes.map(r => [r.id, r]));
      machineCache.set(key, byId);
    }
    for (const [id, r] of byId) {
      const outSummary = [...(r.item_outputs || []), ...(r.fluid_outputs || [])];
      const el = document.getElementById('summary-out-' + id);
      if (el) {
        el.textContent = summaryList(outSummary) || '—';
        initCellClampScroll(el.closest('td'));
      }
    }
    return byId;
  }

  function recipeRowEls(r) {
    const tmp = document.createElement('tbody');
    tmp.innerHTML = recipeRows([r]);
    const els = [...tmp.children]; // [summaryTr, detailTr]

    // Rows added by later pagination miss ensureMachineLoaded's one-time DOM patch; pull from cache instead.
    const full = machineCache.get(r.machine_mod_id + ':' + r.machine_id)?.get(r.id);
    if (full) {
      const outSummary = [...(full.item_outputs || []), ...(full.fluid_outputs || [])];
      const el = els[0].querySelector('#summary-out-' + CSS.escape(r.id));
      if (el) el.textContent = summaryList(outSummary) || '—';
    }
    return els;
  }

  function recipeSkeletonEls() {
    const summary = document.createElement('tr');
    summary.innerHTML = `
      <td></td>
      <td><span class="skeleton-bar" style="width:70%;"></span></td>
      <td><span class="skeleton-bar" style="width:60%;"></span></td>
      <td><span class="skeleton-bar" style="width:40%;"></span></td>
      <td><span class="skeleton-bar" style="width:30%;"></span></td>
      <td><span class="skeleton-bar" style="width:40%;"></span></td>`;
    const detail = document.createElement('tr');
    detail.hidden = true;
    detail.innerHTML = `<td colspan="6"></td>`;
    return [summary, detail];
  }

  function toggleModGroup(modId, hdRow, rowsBody) {
    const wasCollapsed = hdRow.classList.contains('collapsed');
    hdRow.classList.toggle('collapsed');
    if (!wasCollapsed) {
      openGroups.get(modId)?.destroy();
      openGroups.delete(modId);
      return;
    }
    startModGroup(modId, hdRow, rowsBody);
  }

  async function startModGroup(modId, hdRow, rowsBody) {
    const recipes = await loadModGroup(modId);
    if (hdRow.classList.contains('collapsed')) return;
    const countBadge = hdRow.querySelector('.mod-recipe-count');
    if (countBadge) countBadge.textContent = recipes.length;
    if (!recipes.length) return;

    const vw = new VirtualWindow({
      container: rowsBody,
      scrollMode: 'ancestor',
      scrollEl: document.querySelector('.main'),
      fetch: async (offset) => ({
        rows: recipes.slice(offset, offset + 50),
        hasMore: offset + 50 < recipes.length,
      }),
      renderRow: recipeRowEls,
      renderSkeletonRow: recipeSkeletonEls,
    });
    openGroups.get(modId)?.destroy();
    openGroups.set(modId, vw);
    await vw.start();
    initCellClampScroll(rowsBody);

    // A mod group's recipes can span several machine mods, so key by each recipe's own machine.
    const machines = [...new Set(recipes.map(r => r.machine_mod_id + ':' + r.machine_id))];
    for (const key of machines) {
      const [mId, machId] = key.split(':');
      ensureMachineLoaded(mId, machId);
    }
  }

  async function loadModGroup(modId) {
    if (modRecipeCache.has(modId)) return modRecipeCache.get(modId);
    const res = await apiFetch(`/api/recipes?mod=${encodeURIComponent(modId)}`);
    const recipes = res?.ok ? await res.json() : [];
    modRecipeCache.set(modId, recipes);
    return recipes;
  }

  function renderModGroups(mods) {
    groupBodies.forEach(b => b.remove());
    groupBodies = [];
    if (!mods.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="td-muted" style="padding:16px;text-align:center;">${t('catalog.empty.no_recipes')}</td></tr>`;
      return;
    }
    tbody.innerHTML = '';
    for (const m of mods) {
      const hdBody = document.createElement('tbody');
      const hdRow = document.createElement('tr');
      hdRow.className = 'table-group-hd collapsed';
      hdRow.dataset.modGroup = m.mod_id;
      hdRow.innerHTML = `<td colspan="6"><span class="group-hd-arrow"></span>
        <a href="/catalog/mods" class="catalog-link">${esc(m.name || m.mod_id)}</a>
        <span class="td-muted mod-recipe-count" style="font-size:var(--text-xs);margin-left:6px;">${m.recipe_count || 0}</span>
      </td>`;
      hdBody.appendChild(hdRow);

      const rowsBody = document.createElement('tbody');
      rowsBody.dataset.modGroup = m.mod_id;
      hdRow.addEventListener('click', e => {
        if (e.target.closest('.catalog-link')) return;
        toggleModGroup(m.mod_id, hdRow, rowsBody);
      });

      table.appendChild(hdBody);
      table.appendChild(rowsBody);
      groupBodies.push(hdBody, rowsBody);
    }
  }

  table.addEventListener('click', async e => {
    // expand-trigger or clickable recipe row
    const trigger = e.target.closest('.table-expand-trigger');
    const clickedRow = e.target.closest('tr[data-expand-row]');
    if (!trigger && !clickedRow) return;
    if (e.target.closest('.catalog-link')) return;
    const rowID = trigger ? trigger.dataset.expand : clickedRow.dataset.expandRow;
    const row = rowID && document.getElementById(rowID);
    if (!row) return;

    const nowOpen = row.classList.toggle('open');
    const triggerEl = trigger ?? document.querySelector(`.table-expand-trigger[data-expand="${rowID}"]`);
    triggerEl?.classList.toggle('open', nowOpen);
    if (!nowOpen) return;

    const recipeID = row.dataset.recipeId;
    const bodyEl   = document.getElementById('rbody-' + recipeID);
    if (!bodyEl) return;

    if (ioCache.has(recipeID)) {
      bodyEl.innerHTML = ioCache.get(recipeID);
      initHiDPIRender(bodyEl);
      initInfocards(bodyEl);
      initIconCycle(bodyEl);
      return;
    }

    // find recipe metadata from cache
    const modId = row.dataset.mod;
    const recipes = modRecipeCache.get(modId) || [];
    const recipe = recipes.find(r => r.id === recipeID);
    if (!recipe) { bodyEl.innerHTML = `<span class="td-muted">—</span>`; return; }

    const byId = await ensureMachineLoaded(recipe.machine_mod_id, recipe.machine_id);
    const full = byId?.get(recipeID);
    if (!full) { bodyEl.innerHTML = `<span class="td-muted">—</span>`; return; }

    const allInputs = [...(full.item_inputs || []), ...(full.fluid_inputs || [])];
    const allOutputs = [...(full.item_outputs || []), ...(full.fluid_outputs || [])];
    const inputGrid = full.machine_id === 'crafting_table' && full.shape?.length === 9
      ? craftingGrid(full.shape, full.item_inputs || [])
      : ioGrid(allInputs);
    const html = `<div class="crafting-layout">
      ${inputGrid}
      <div class="crafting-arrow">→</div>
      ${ioGrid(allOutputs)}
    </div>`;
    bodyEl.innerHTML = html;
    initHiDPIRender(bodyEl);
    initInfocards(bodyEl);
    initIconCycle(bodyEl);
    ioCache.set(recipeID, html);
  });

  searchEl.addEventListener('input', () => {
    const q = searchEl.value.trim().toLowerCase();
    for (const hd of table.querySelectorAll('.table-group-hd')) {
      const modId = hd.dataset.modGroup;
      const modName = hd.querySelector('.catalog-link')?.textContent?.toLowerCase() || '';
      const match = !q || modId.toLowerCase().includes(q) || modName.includes(q);
      const hdBody = hd.closest('tbody');
      if (hdBody !== tbody) {
        hdBody.hidden = !match;
        const rowsBody = hdBody.nextElementSibling;
        if (rowsBody) rowsBody.hidden = !match;
      } else {
        hd.hidden = !match;
        let el = hd.nextElementSibling;
        while (el && !el.classList.contains('table-group-hd')) {
          el.hidden = !match;
          el = el.nextElementSibling;
        }
      }
    }
  });

  // Filtered mode — arriving with a machine/item/fluid filter (the "I already
  // know what I want" signal). Single unified fetch carrying every active URL
  // filter dimension, so no dimension can be silently dropped the way the
  // two-parallel-code-paths version did (see 2026-07-04 session notes).
  // Renders matching recipes directly, grouped + auto-expanded.
  async function renderFilteredRecipes() {
    const qs = new URLSearchParams();
    if (urlMod)     qs.set('mod', urlMod);
    if (urlMachine) qs.set('machine', urlMachine);
    if (urlItem)    qs.set('item', urlItem);
    if (urlFluid)   qs.set('fluid', urlFluid);
    const res = await apiFetch(`/api/recipes?${qs.toString()}`);
    const recipes = res?.ok ? await res.json() : [];
    countEl.textContent = recipes.length + ' recipe' + (recipes.length !== 1 ? 's' : '');

    if (!recipes.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="td-muted" style="padding:16px;text-align:center;">${t('catalog.empty.no_recipes')}</td></tr>`;
      return;
    }

    const byMod = new Map();
    for (const r of recipes) {
      if (!byMod.has(r.source_mod_id)) byMod.set(r.source_mod_id, []);
      byMod.get(r.source_mod_id).push(r);
    }

    let html = '';
    for (const [modId, modRecipes] of byMod) {
      modRecipeCache.set(modId, modRecipes);
      const modInfo = allMods.find(m => m.mod_id === modId);
      html += `<tr class="table-group-hd" data-mod-group="${esc(modId)}" data-loaded="1">
        <td colspan="6"><span class="group-hd-arrow"></span>
          <a href="/catalog/mods" class="catalog-link">${esc(modInfo?.name || modId)}</a>
          <span class="td-muted mod-recipe-count" style="font-size:var(--text-xs);margin-left:6px;">${modRecipes.length}</span>
        </td>
      </tr>`;
      html += recipeRows(modRecipes);
    }
    tbody.innerHTML = html;
    initCellClampScroll(tbody);

    const machines = [...new Set(recipes.map(r => r.machine_mod_id + ':' + r.machine_id))];
    for (const key of machines) {
      const [mId, machId] = key.split(':');
      ensureMachineLoaded(mId, machId);
    }
  }

  // Initial load: mod list only
  await loadCatalog();
  const modsRes = await apiFetch('/api/mods');
  if (modsRes?.ok) {
    allMods = await modsRes.json();

    if (urlMachine || urlItem || urlFluid) {
      // Filtered mode: any specific-recipe-set filter beyond plain mod-browsing.
      await renderFilteredRecipes();
    } else {
      // Browse mode: no machine/item/fluid — just optionally mod.
      // filter to mods that might have recipes (if urlMod set, only that mod)
      const visibleMods = urlMod ? allMods.filter(m => m.mod_id === urlMod) : allMods;
      renderModGroups(visibleMods);
      countEl.textContent = visibleMods.length + ' mod' + (visibleMods.length !== 1 ? 's' : '');

      // if urlMod is set, auto-expand it
      if (urlMod) {
        const hd = table.querySelector(`.table-group-hd[data-mod-group="${CSS.escape(urlMod)}"]`);
        if (hd) {
          hd.classList.remove('collapsed');
          const rowsBody = hd.closest('tbody').nextElementSibling;
          await startModGroup(urlMod, hd, rowsBody);
        }
      }
    }

    new WuiAutocomplete({
      inputEl:   searchEl,
      dropEl:    document.getElementById('recipe-search-ac'),
      primary:   r => r.name,
      secondary: r => r.mod_id,
      fetch(q, offset) {
        let rows = allMods;
        rows = wuiFilter(allMods, q, ['name', 'mod_id']);
        return Promise.resolve({ rows: rows.slice(offset, offset + 50), hasMore: offset + 50 < rows.length });
      },
      onSelect(r) { searchEl.value = r.name; searchEl.dispatchEvent(new Event('input')); },
    });
  }
</script>
</body>
</html>
