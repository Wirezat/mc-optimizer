<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MC Optimizer — Machines</title>
  <link rel="stylesheet" href="/static/ui/index.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <link rel="stylesheet" href="/static/css/catalog-common.css" />
  <script>
    (function(){
      const s = localStorage.getItem('theme');
      if (s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark');
    })();
  </script>
  <style>
    .machine-icon-cell {
      --machine-icon-cell-size: 32px;
      width: var(--machine-icon-cell-size);
      height: var(--machine-icon-cell-size);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* The texture fills the cell like an inventory icon; pixelated to match the game's own scaling. */
    .machine-icon {
      --machine-icon-size: 28px;
      width: var(--machine-icon-size);
      height: var(--machine-icon-size);
      object-fit: contain;
      image-rendering: pixelated;
    }
    /* Caps the hover grid's per-icon size regardless of variant count, so a
       single-variant grid doesn't stretch its one cell to the full card width. */
    .machine-variant-grid {
      justify-items: center;
    }
    .machine-variant-grid .infocard-grid-cell {
      --machine-hover-icon-size: 72px;
      max-width: var(--machine-hover-icon-size);
    }
  </style>
</head>
<body class="app-shell">
  <header class="header">
    <a class="header-brand" href="/saves"><div class="header-logo">⚙️</div><span>MC Optimizer</span></a>
    <div class="header-right">
      <button data-wui-theme data-i18n-title="common.toggle_theme"></button>
      <div class="dropdown-wrap" data-wui-lang><button data-dropdown-trigger></button><div class="dropdown-panel"><button class="dropdown-item" data-lang="en">🇬🇧 English</button><button class="dropdown-item" data-lang="de">🇩🇪 Deutsch</button></div></div>
      <div class="dropdown-wrap" data-wui-user-menu><button class="user-menu-trigger" data-wui-user-trigger data-dropdown-trigger><div class="avatar">?</div><span class="username">…</span><span class="chevron">▾</span></button><div class="dropdown-panel" data-wui-user-dropdown></div></div>
    </div>
  </header>
  <div class="app-body">
    <nav class="sidebar"></nav>
    <main class="main"><div class="page">

      <div class="page-header" data-page-header-area>
        <div class="page-title-row">
          <h1 class="page-title" data-i18n="catalog.machines.title"></h1>
        </div>
      </div>

      <div class="container">
        <div class="container-header">
          <span class="container-title" id="machine-count"></span>
        </div>
        <div class="container-filter">
          <div class="wui-ac-wrap" style="width:220px;">
            <input class="input" id="machine-search" data-i18n-placeholder="catalog.search_placeholder"
              style="width:100%;height:var(--h-btn-sm);" autocomplete="off" />
            <div class="wui-ac-drop" id="machine-search-ac"></div>
          </div>
        </div>
        <div class="container-body-flush">
          <table class="table">
            <thead>
              <tr>
                <th style="width:40px;"></th>
                <th style="width:100%;" data-i18n="catalog.mods.col.name"></th>
                <th data-i18n="catalog.machines.col.machine_id"></th>
                <th data-i18n="catalog.machines.col.costs"></th>
                <th data-i18n="catalog.machines.col.recipes"></th>
              </tr>
            </thead>
            <tbody id="machine-tbody">
              <tr><td colspan="5" class="td-muted" style="padding:16px;text-align:center;" data-i18n="catalog.empty.loading"></td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div></main>
  </div>
</div>

<script type="module">
  import { VirtualWindow } from '/static/ui/js/virtual-window.js';
  import { guard, apiFetch, getUser } from '/static/ui/js/auth.js';
  import { load, applyI18n, getLang, t, esc, tCount } from '/static/js/i18n.js';
  import { init as initHeader } from '/static/js/header.js';
  import { costHTML } from '/static/js/rates.js';
  import { WuiAutocomplete } from '/static/ui/js/autocomplete.js';
  import { wuiFilter } from '/static/ui/js/filter.js';
  import { initIconCycle } from '/static/ui/js/icon-cycle.js';
  import { initInfocards } from '/static/ui/js/infocard.js';
  import { initHiDPIRender } from '/static/ui/js/hidpi-render.js';

  await load(getLang());
  applyI18n();
  guard();
  initHeader();
  await getUser();

  const tbody    = document.getElementById('machine-tbody');
  const table    = tbody.closest('table');
  let groupBodies = []; // sibling <tbody> pairs appended per mod
  const countEl  = document.getElementById('machine-count');
  const searchEl = document.getElementById('machine-search');
  const urlMod   = new URLSearchParams(location.search).get('mod') || '';

  let allMachines = [];
  let modNames = {};
  let filtered = [];
  const openGroups = new Map();
  const groupRows = new Map();

  // Ungrouped machines get the same hover as grouped ones, via a single-entry
  // "variants" list.
  function machineIconCellHTML(m) {
    const variants = m.variants && m.variants.length > 1 ? m.variants : [m];
    if (!variants.some(v => v.texture_url)) return `<span class="machine-icon-cell"></span>`;

    const cycle = variants.length > 1
      ? ` data-wui-cycle='${esc(JSON.stringify(variants.filter(v => v.texture_url).map(v => ({ src: v.texture_url }))))}'`
      : '';
    const first = variants.find(v => v.texture_url);
    // data-hidpi-px matches --machine-icon-size above.
    const triggerImg = `<img class="machine-icon" data-hidpi-px="28"${cycle} src="${esc(first.texture_url)}" alt="" loading="lazy" decoding="async" onerror="this.removeAttribute('src')">`;

    // Reuses .infocard-grid/-grid-cell and .infocard-section/-row/-key/-val
    // (same key/value pattern craftCell() uses for its "Amount" row). data-hidpi-px
    // matches --machine-hover-icon-size above.
    const grid = `<div class="infocard-grid machine-variant-grid" data-cols="${variants.length}">${
      variants.map(v => `<div class="infocard-grid-cell">${v.texture_url ? `<img data-hidpi-px="72" src="${esc(v.texture_url)}" alt="">` : ''}</div>`).join('')
    }</div>`;
    return `<span class="machine-icon-cell" data-infocard-inline>${triggerImg}</span>
      <div class="infocard-def" hidden>${grid}</div>`;
  }

  function costsCellHTML(costs) {
    if (!costs || !costs.length) return '<span class="td-muted">—</span>';
    return costs.map(c => costHTML(c)).join(' ');
  }

  function machineRowEl(m) {
    const recipesUrl = `/catalog/items?producedByMachine=${encodeURIComponent(m.mod_id + ':' + m.machine_id)}`;
    const tierBadge = m.variants && m.variants.length > 1
      ? `<span class="badge badge-neutral" style="margin-left:var(--gap-inline);">${esc(t('catalog.machines.tier_count').replace('{n}', m.variants.length))}</span>`
      : '';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${machineIconCellHTML(m)}</td>
      <td><a href="${esc(recipesUrl)}" class="row-name-link">${esc(m.name || m.machine_id)}</a>${tierBadge}</td>
      <td class="td-mono td-muted">${esc(m.machine_id)}</td>
      <td class="td-muted">${costsCellHTML(m.costs)}</td>
      <td>${m.recipe_count
        ? `<a href="${esc(recipesUrl)}" class="recipe-count-link">${m.recipe_count}</a>`
        : `<span class="td-muted">—</span>`}</td>`;
    initHiDPIRender(tr);
    initIconCycle(tr);
    initInfocards(tr);
    return [tr];
  }

  function skeletonRowEl() {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span class="skeleton-bar" style="width:24px;"></span></td>
      <td><span class="skeleton-bar" style="width:60%;"></span></td>
      <td><span class="skeleton-bar" style="width:50%;"></span></td>
      <td><span class="skeleton-bar" style="width:40%;"></span></td>
      <td><span class="skeleton-bar" style="width:20%;"></span></td>`;
    return [tr];
  }

  function toggleGroup(modId, hdRow, rowsBody) {
    const collapsed = hdRow.classList.toggle('collapsed');
    if (collapsed) {
      openGroups.get(modId)?.destroy();
      openGroups.delete(modId);
      return;
    }
    const machines = groupRows.get(modId) || [];
    const vw = new VirtualWindow({
      container: rowsBody,
      scrollMode: 'ancestor',
      scrollEl: document.querySelector('.main'),
      fetch: async (offset) => ({
        rows: machines.slice(offset, offset + 50),
        hasMore: offset + 50 < machines.length,
      }),
      renderRow: machineRowEl,
      renderSkeletonRow: skeletonRowEl,
    });
    openGroups.set(modId, vw);
    vw.start();
  }

  function resetAndRender() {
    const q = searchEl.value.trim().toLowerCase();
    filtered = urlMod ? allMachines.filter(m => m.mod_id === urlMod) : allMachines;
    if (q) filtered = filtered.filter(m => {
      if (wuiFilter(m, q, ['name', 'machine_id', 'mod_name'])) return true;
      return (m.variants || []).some(v => wuiFilter(v, q, ['name', 'machine_id']));
    });
    countEl.textContent = tCount(filtered.length, 'catalog.machines.count');

    for (const vw of openGroups.values()) vw.destroy();
    openGroups.clear();
    groupRows.clear();

    groupBodies.forEach(b => b.remove());
    groupBodies = [];
    tbody.innerHTML = '';
    if (!filtered.length) {
      tbody.innerHTML = `<tr><td colspan="5" class="td-muted" style="padding:16px;text-align:center;">${t('catalog.empty.no_machines')}</td></tr>`;
      return;
    }

    const byMod = new Map();
    for (const m of filtered) {
      if (!byMod.has(m.mod_id)) byMod.set(m.mod_id, []);
      byMod.get(m.mod_id).push(m);
    }

    for (const [modId, machines] of byMod) {
      groupRows.set(modId, machines);
      const modName = modNames[modId] || modId;

      const hdBody = document.createElement('tbody');
      const hdRow = document.createElement('tr');
      hdRow.className = 'table-group-hd collapsed';
      hdRow.innerHTML = `<td colspan="5"><span class="group-hd-arrow"></span><a href="/catalog/mods" class="catalog-link">${esc(modName)}</a><span class="td-muted" style="font-size:var(--text-xs);margin-left:6px;">${machines.length}</span></td>`;
      hdBody.appendChild(hdRow);

      const rowsBody = document.createElement('tbody');
      hdRow.addEventListener('click', e => {
        if (e.target.closest('a')) return;
        toggleGroup(modId, hdRow, rowsBody);
      });

      table.appendChild(hdBody);
      table.appendChild(rowsBody);
      groupBodies.push(hdBody, rowsBody);
    }
  }

  searchEl.addEventListener('input', resetAndRender);

  const [machRes, modsRes] = await Promise.all([
    apiFetch('/api/machines'),
    apiFetch('/api/mods'),
  ]);
  if (modsRes?.ok) {
    const mods = await modsRes.json();
    mods.forEach(m => { modNames[m.mod_id] = m.name; });
  }
  if (machRes?.ok) {
    allMachines = await machRes.json();
    allMachines.forEach(m => { m.mod_name = modNames[m.mod_id] || m.mod_id; });
    resetAndRender();
    new WuiAutocomplete({
      inputEl:   searchEl,
      dropEl:    document.getElementById('machine-search-ac'),
      primary:   r => r.name || r.machine_id,
      secondary: r => r.mod_name,
      fetch(q, offset) {
        const rows = allMachines.filter(m => {
          if (wuiFilter([m], q, ['name', 'machine_id', 'mod_name']).length) return true;
          return (m.variants || []).some(v => wuiFilter([v], q, ['name', 'machine_id']).length);
        });
        return Promise.resolve({ rows: rows.slice(offset, offset + 50), hasMore: offset + 50 < rows.length });
      },
      onSelect(r) { searchEl.value = r.name || r.machine_id; searchEl.dispatchEvent(new Event('input')); },
    });
  }
</script>
</body>
</html>
