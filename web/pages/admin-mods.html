<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MC Optimizer — Mods</title>
  <link rel="stylesheet" href="/static/ui/index.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <script>
    (function(){
      const s = localStorage.getItem('theme');
      if (s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark');
    })();
  </script>
  <style>
    .import-actions {
      display: flex;
      align-items: center;
      gap: var(--gap-control);
      padding: var(--gap-inline) var(--pad-container);
      border-top: 1px solid var(--border);
    }

    #drop-zone.disabled { opacity: 0.4; pointer-events: none; }

    .import-result-block + .import-result-block {
      margin-top: var(--gap-section);
      padding-top: var(--gap-section);
      border-top: 1px solid var(--border);
    }
    .import-result-mod {
      font-family: var(--font-mono);
      font-weight: var(--weight-semibold);
      margin-bottom: var(--gap-inline);
    }

    .import-warn-list { margin-top: var(--gap-control); max-height: 160px; overflow-y: auto; }
    .import-warn-line {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      color: var(--text-muted);
      padding: 2px 0;
      word-break: break-all;
    }
  </style>
</head>
<body class="app-shell">

  <header class="header">
    <a class="header-brand" href="/saves">
      <div class="header-logo">⚙️</div>
      <span>MC Optimizer</span>
    </a>
    <div class="header-right">
      <button data-wui-theme data-i18n-title="common.toggle_theme"></button>
      <div class="dropdown-wrap" data-wui-lang>
        <button data-dropdown-trigger></button>
        <div class="dropdown-panel">
          <button class="dropdown-item" data-lang="en">🇬🇧 English</button>
          <button class="dropdown-item" data-lang="de">🇩🇪 Deutsch</button>
        </div>
      </div>
      <div class="dropdown-wrap" data-wui-user-menu>
        <button class="user-menu-trigger" data-wui-user-trigger data-dropdown-trigger>
          <div class="avatar">?</div>
          <span class="username">…</span>
          <span class="chevron">▾</span>
        </button>
        <div class="dropdown-panel" data-wui-user-dropdown></div>
      </div>
    </div>
  </header>

  <div class="app-body">
    <nav class="sidebar"></nav>

    <main class="main">
      <div class="page">

        <div class="page-header">
          <div>
            <div class="page-title" data-i18n="admin.mods.title"></div>
            <div class="page-subtitle" data-i18n="admin.mods.subtitle"></div>
          </div>
        </div>

        <div class="split-layout fit">
          <div class="main-panel">

            <!-- Upload -->
            <div class="container">
              <div class="container-header">
                <span class="container-title" data-i18n="admin.mods.upload"></span>
              </div>

              <div class="wui-progress-track" id="progress-bar" style="display:none;margin:0 var(--pad-container)">
                <div class="wui-progress-fill" id="progress-fill" style="width:0%;transition:width 0.3s"></div>
              </div>

              <div class="wui-dropzone" id="drop-zone" style="margin:var(--pad-container)">
                <div>
                  <div data-i18n="admin.mods.drop_main"></div>
                  <div id="drop-file" style="font-size:var(--text-sm);font-weight:var(--weight-semibold);color:var(--accent);margin-top:var(--gap-inline)"></div>
                  <div style="font-size:var(--text-xs);color:var(--text-faint)" data-i18n="admin.mods.drop_sub"></div>
                </div>
              </div>
              <input type="file" id="zip-input" accept=".zip" multiple style="display:none" />

              <div class="import-actions">
                <button class="btn btn-primary btn-sm" id="import-btn" disabled data-i18n="admin.mods.btn"></button>
                <a class="btn btn-ghost btn-sm" href="/static/data/mod-template.zip" download data-i18n="admin.mods.template.download"></a>
                <span class="status-msg" id="import-status"></span>
              </div>
            </div>

          </div>

          <!-- Import output — always on screen, empty until something is imported -->
          <div class="side-panel">
            <div class="container">
              <div class="container-header">
                <span class="container-title" data-i18n="admin.mods.output"></span>
              </div>
              <div class="container-body" id="import-output">
                <div class="empty-state" data-i18n="admin.mods.output_empty"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Installed mods -->
        <div class="container" style="margin-top:var(--gap-section)">
          <div class="container-header">
            <span class="container-title" data-i18n="admin.mods.installed"></span>
            <span class="view-picker-label" id="mod-list-count"></span>
          </div>
          <div id="mod-list"></div>
        </div>

      </div>
    </main>
  </div>

  <!-- Modal (wirezatUI) -->
  <div class="modal-backdrop" data-wui-modal>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="wui-modal-title">
      <div class="modal-header">
        <span class="modal-title" data-modal-title id="wui-modal-title"></span>
        <button class="modal-close" data-modal-close>✕</button>
      </div>
      <div class="modal-body" data-modal-body></div>
      <div class="modal-footer">
        <button class="btn btn-ghost" data-modal-cancel data-i18n="common.cancel"></button>
        <button class="btn btn-primary" data-modal-confirm></button>
      </div>
    </div>
  </div>

<script type="module">
  import { guard, apiFetch, getUser } from '/static/ui/js/auth.js';
  import { load, applyI18n, getLang, t, esc } from '/static/js/i18n.js';
  import { init as initHeader } from '/static/js/header.js';
  import { initModal, openModal } from '/static/ui/js/modal.js';
  import { showToast } from '/static/ui/js/components/toast.js';
  import { renderModList } from '/static/js/mod-list.js';

  await load(getLang());
  applyI18n();
  guard();
  initHeader();
  initModal();

  async function init() {
    const user = await getUser();
    if (!user?.is_admin) { window.location.href = '/personal'; return; }
    loadMods();
  }

  async function loadMods() {
    const el  = document.getElementById('mod-list');
    const res = await apiFetch('/api/mods');
    const mods = res?.ok ? await res.json() : [];
    renderModList(el, mods, { deletable: true, onDelete: deleteMod });
    applyI18n(el);
    const listed = mods.filter(m => m.ecosystems?.length).length;
    document.getElementById('mod-list-count').textContent =
      t(listed === 1 ? 'catalog.mods.count_one' : 'catalog.mods.count').replace('{n}', listed);
  }

  // A mod is only deletable while nothing references it; the server answers 409 with one
  // blocker entry per reason.
  async function deleteMod(modID) {
    if (!confirm(t('catalog.mods.confirm_delete'))) return;

    const res = await apiFetch('/api/mods/' + encodeURIComponent(modID), { method: 'DELETE' });
    if (res?.ok) {
      setStatus(t('catalog.mods.delete.deleted'), 'ok');
      loadMods();
      return;
    }
    if (res?.status === 409) {
      const body = await res.json().catch(() => ({}));
      showBlockers(body.blockers || []);
      return;
    }
    setStatus(t('common.error'), 'err');
  }

  function showBlockers(blockers) {
    const items = blockers.map(b => {
      const key = 'catalog.mods.delete.blocker.' + b.kind + (b.count === 1 ? '_one' : '');
      const head = esc(t(key).replace('{n}', b.count));
      const names = (b.sample || []).map(esc).join(', ');
      const more = b.count > (b.sample || []).length ? ' …' : '';
      return `<li>${head}${names ? `<span class="td-faint"> — ${names}${more}</span>` : ''}</li>`;
    }).join('');
    openModal({
      title:        t('catalog.mods.delete.in_use_title'),
      bodyHTML:     `<p>${esc(t('catalog.mods.delete.in_use_intro'))}</p><ul>${items}</ul>`,
      confirmLabel: t('common.ok'),
    });
  }

  let _files = [];

  const zipInput = document.getElementById('zip-input');
  const dropZone = document.getElementById('drop-zone');

  dropZone.addEventListener('click', () => zipInput.click());
  dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('dragover');
    setFiles([...e.dataTransfer.files].filter(f => f.name.endsWith('.zip')));
  });
  zipInput.addEventListener('change', () => setFiles([...zipInput.files]));

  document.getElementById('import-btn').addEventListener('click', runImport);

  function setFiles(files) {
    if (!files.length) return;
    _files = files;
    document.getElementById('drop-file').textContent = files.map(f => f.name).join(', ');
    document.getElementById('import-btn').disabled = false;
    setStatus('', '');
  }

  async function runImport() {
    if (!_files.length) return;
    const btn = document.getElementById('import-btn');
    btn.disabled = true;
    dropZone.classList.add('disabled');
    setStatus('', '');

    const pb = document.getElementById('progress-bar');
    const pf = document.getElementById('progress-fill');
    pb.style.display = 'block';
    pf.style.width = '15%';

    try {
      const form = new FormData();
      for (const f of _files) form.append('modfile', f);
      const res = await apiFetch('/api/import/modfile', { method: 'POST', body: form });
      pf.style.width = '85%';
      const data = await res.json();
      pf.style.width = '100%';
      setTimeout(() => { pb.style.display = 'none'; pf.style.width = '0%'; }, 350);
      dropZone.classList.remove('disabled');

      if (!res.ok) {
        renderOutput([], data?.message || String(res.status));
        setStatus(t('msg.save_error'), 'err');
        showToast({ tone: 'danger', messageKey: t(data?.error === 'MODFILE_INVALID' ? 'admin.mods.modfile_invalid' : 'msg.save_error') });
        btn.disabled = false;
        return;
      }

      const results = Array.isArray(data) ? data : [data];
      renderOutput(results, '');

      const warned = results.reduce((n, r) => n + (r.warnings?.length ?? 0), 0);
      setStatus(warned ? t('admin.mods.saved_with_warnings') : t('msg.saved'), warned ? 'warn' : 'ok');
      document.getElementById('drop-file').textContent = '';
      _files = [];
      btn.disabled = true;
      loadMods();

      openModal({
        title:        t(warned ? 'admin.mods.verify.title_warn' : 'admin.mods.verify.title'),
        bodyHTML:     `<p>${esc(t('admin.mods.verify.body'))}</p>`,
        confirmLabel: t('admin.mods.verify.confirm'),
        onConfirm:    () => { window.location.href = '/catalog/machines'; },
      });
    } catch(e) {
      pb.style.display = 'none';
      dropZone.classList.remove('disabled');
      setStatus(t('msg.network_error') + ': ' + e.message, 'err');
      showToast({ tone: 'danger', messageKey: t('msg.network_error') });
      btn.disabled = false;
    }
  }

  function renderOutput(results, errMsg) {
    const el = document.getElementById('import-output');
    if (errMsg) {
      el.innerHTML = `<div class="detail-row"><span class="detail-key" style="color:var(--danger)">${esc(t('common.error'))}</span>` +
                     `<span class="detail-val">${esc(errMsg)}</span></div>`;
      return;
    }
    el.innerHTML = results.map(r => {
      const stats = [
        stat(r.machines,         t('admin.mods.stat.machines')),
        stat(r.recipes_imported, t('admin.mods.stat.recipes')),
        stat(r.items,            t('admin.mods.stat.items')),
        stat(r.fluids,           t('admin.mods.stat.fluids')),
        stat(r.translations,     t('admin.mods.stat.translations')),
        stat(r.tags,             t('admin.mods.stat.tags')),
        stat(r.textures,         t('admin.mods.stat.textures')),
        stat(r.block_drops,      t('admin.mods.stat.block_drops')),
        stat(r.villager_trades,  t('admin.mods.stat.villager_trades')),
      ].filter(Boolean).join('');
      const warnings = (r.warnings || [])
        .map(w => `<div class="import-warn-line">${esc(w)}</div>`).join('');
      return `<div class="import-result-block">
          <div class="import-result-mod">${esc(r.mod_id || '')}</div>
          <div class="detail-grid">${stats}</div>
          ${warnings ? `<div class="import-warn-list">${warnings}</div>` : ''}
        </div>`;
    }).join('');
  }

  function setStatus(msg, type) {
    const el = document.getElementById('import-status');
    el.textContent = msg;
    el.className = 'status-msg' + (type ? ' ' + type : '');
  }

  function stat(n, label) {
    if (!n) return '';
    return `<div class="detail-row"><span class="detail-key">${label}</span><span class="detail-val">${n}</span></div>`;
  }

  init();
</script>
</body>
</html>
