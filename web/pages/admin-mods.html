<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MC Optimizer — Mods</title>
  <link rel="stylesheet" href="/static/ui/index.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <script>
    (function(){
      const s = localStorage.getItem('theme');
      if (s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark');
    })();
  </script>
  <style>
    /* ── Action row (bottom of container) ─────────────────────────────────── */
    .import-actions {
      display: flex;
      align-items: center;
      gap: var(--gap-control);
      padding: var(--gap-inline) var(--pad-container);
      border-top: 1px solid var(--border);
    }

    /* ── Drop zone (page-specific: wui has no disabled modifier) ───────────── */
    #drop-zone.disabled { opacity: 0.4; pointer-events: none; }

    /* ── Warnings ──────────────────────────────────────────────────────────── */
    .import-warn-list { margin-top: var(--gap-control); max-height: 160px; overflow-y: auto; }
    .import-warn-line {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      color: var(--text-muted);
      padding: 2px 0;
      word-break: break-all;
    }
  </style>
</head>
<body class="app-shell">

  <!-- ── Header ── -->
  <header class="header">
    <a class="header-brand" href="/saves">
      <div class="header-logo">⚙️</div>
      <span>MC Optimizer</span>
    </a>
    <div class="header-right">
      <button data-wui-theme data-i18n-title="common.toggle_theme"></button>
      <div class="dropdown-wrap" data-wui-lang>
        <button data-dropdown-trigger></button>
        <div class="dropdown-panel">
          <button class="dropdown-item" data-lang="en">🇬🇧 English</button>
          <button class="dropdown-item" data-lang="de">🇩🇪 Deutsch</button>
        </div>
      </div>
      <div class="dropdown-wrap" data-wui-user-menu>
        <button class="user-menu-trigger" data-wui-user-trigger data-dropdown-trigger>
          <div class="avatar">?</div>
          <span class="username">…</span>
          <span class="chevron">▾</span>
        </button>
        <div class="dropdown-panel" data-wui-user-dropdown></div>
      </div>
    </div>
  </header>

  <div class="app-body">
    <nav class="sidebar"></nav>

    <main class="main">
      <div class="page">

        <div class="page-header">
          <div>
            <div class="page-title" data-i18n="admin.mods.title"></div>
            <div class="page-subtitle" data-i18n="admin.mods.subtitle"></div>
          </div>
        </div>

        <!-- Import card -->
        <div class="container" style="max-width:600px">

          <div class="container-header">
            <span class="container-title" data-i18n="admin.mods.upload"></span>
            <span class="view-picker-label" id="mod-count"></span>
          </div>

          <!-- Template downloads -->
          <div class="container-body" style="padding-bottom:0;display:flex;align-items:center;gap:var(--gap-control);flex-wrap:wrap">
            <a class="btn btn-ghost btn-sm" href="/static/data/mod-template.zip" download data-i18n="admin.mods.template.download"></a>
            <span class="field-caption" data-i18n="admin.mods.template.hint"></span>
          </div>

          <!-- Progress bar (flush) -->
          <div class="wui-progress-track" id="progress-bar" style="display:none;margin:0 var(--pad-container)">
            <div class="wui-progress-fill" id="progress-fill" style="width:0%;transition:width 0.3s"></div>
          </div>

          <!-- Drop zone -->
          <div class="wui-dropzone" id="drop-zone" style="margin:var(--pad-container)">
            <div>
              <div style="font-size:20px;opacity:.5">📦</div>
              <div data-i18n="admin.mods.drop_main"></div>
              <div id="drop-file" style="font-size:var(--text-sm);font-weight:var(--weight-semibold);color:var(--accent);margin-top:var(--gap-inline)"></div>
              <div style="font-size:var(--text-xs);color:var(--text-faint)" data-i18n="admin.mods.drop_sub"></div>
            </div>
          </div>
          <input type="file" id="zip-input" accept=".zip" style="display:none" />

          <!-- Actions -->
          <div class="import-actions">
            <button class="btn btn-primary btn-sm" id="import-btn" disabled data-i18n="admin.mods.btn"></button>
            <span class="status-msg" id="import-status"></span>
          </div>

        </div>

        <!-- Result (shown after successful import) -->
        <div class="container" id="import-result" style="max-width:600px;margin-top:var(--gap-section);display:none">
          <div class="container-header">
            <span class="container-title" id="import-result-mod"></span>
          </div>
          <div class="container-body">
            <div class="detail-grid cols-2" id="import-stats"></div>
            <div class="import-warn-list" id="import-warnings"></div>
          </div>
        </div>

        <!-- Installed mods -->
        <div class="container" style="margin-top:var(--gap-section)">
          <div class="container-header">
            <span class="container-title" data-i18n="admin.mods.installed"></span>
            <span class="view-picker-label" id="mod-list-count"></span>
          </div>
          <div id="mod-list"></div>
        </div>

      </div>
    </main>
  </div>

  <!-- Modal (wirezatUI) -->
  <div class="modal-backdrop" data-wui-modal>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="wui-modal-title">
      <div class="modal-header">
        <span class="modal-title" data-modal-title id="wui-modal-title"></span>
        <button class="modal-close" data-modal-close>✕</button>
      </div>
      <div class="modal-body" data-modal-body></div>
      <div class="modal-footer">
        <button class="btn btn-ghost" data-modal-cancel data-i18n="common.cancel"></button>
        <button class="btn btn-primary" data-modal-confirm></button>
      </div>
    </div>
  </div>

<script type="module">
  import { guard, apiFetch, getUser } from '/static/ui/js/auth.js';
  import { load, applyI18n, getLang, t, esc } from '/static/js/i18n.js';
  import { init as initHeader } from '/static/js/header.js';
  import { initModal, openModal } from '/static/ui/js/modal.js';
  import { renderModList } from '/static/js/mod-list.js';

  await load(getLang());
  applyI18n();
  guard();
  initHeader();
  initModal();

  async function init() {
    const user = await getUser();
    if (!user?.is_admin) { window.location.href = '/personal'; return; }
    loadStatus();
    loadMods();
  }

  async function loadMods() {
    const el  = document.getElementById('mod-list');
    const res = await apiFetch('/api/mods');
    const mods = res?.ok ? await res.json() : [];
    renderModList(el, mods, { deletable: true });
    applyI18n(el);
    document.getElementById('mod-list-count').textContent =
      t(mods.length === 1 ? 'catalog.mods.count_one' : 'catalog.mods.count').replace('{n}', mods.length);
  }

  async function loadStatus() {
    try {
      const res = await apiFetch('/api/import/status');
      if (!res?.ok) return;
      const s = await res.json();
      document.getElementById('mod-count').textContent =
        t('admin.mods.total_mods').replace('{n}', s.total_mods);
    } catch(e) { console.warn('status:', e); }
  }

  let _file = null;

  const zipInput = document.getElementById('zip-input');
  const dropZone = document.getElementById('drop-zone');

  dropZone.addEventListener('click', () => zipInput.click());
  dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('dragover');
    const f = e.dataTransfer.files[0];
    if (f) setFile(f);
  });
  zipInput.addEventListener('change', () => { if (zipInput.files[0]) setFile(zipInput.files[0]); });

  document.getElementById('import-btn').addEventListener('click', runImport);

  function setFile(f) {
    _file = f;
    document.getElementById('drop-file').textContent = f.name;
    document.getElementById('import-btn').disabled = false;
    setStatus('', '');
  }

  async function runImport() {
    if (!_file) return;
    const btn = document.getElementById('import-btn');
    btn.disabled = true;
    dropZone.classList.add('disabled');
    document.getElementById('import-result').style.display = 'none';
    setStatus('', '');

    const pb = document.getElementById('progress-bar');
    const pf = document.getElementById('progress-fill');
    pb.style.display = 'block';
    pf.style.width = '15%';

    try {
      const form = new FormData();
      form.append('modfile', _file);
      const res = await apiFetch('/api/import/modfile', { method: 'POST', body: form });
      pf.style.width = '85%';
      const data = await res.json();
      pf.style.width = '100%';
      setTimeout(() => { pb.style.display = 'none'; pf.style.width = '0%'; }, 350);
      dropZone.classList.remove('disabled');

      const result = Array.isArray(data) ? data[0] : data;

      if (!res.ok) {
        document.getElementById('import-result-mod').textContent = '';
        document.getElementById('import-stats').innerHTML =
          `<div class="detail-row"><span class="detail-key" style="color:var(--danger)">${t('common.error')}</span><span class="detail-val">${esc(result?.message || String(res.status))}</span></div>`;
        document.getElementById('import-warnings').innerHTML = '';
        document.getElementById('import-result').style.display = '';
        setStatus(t('msg.save_error'), 'err');
        btn.disabled = false;
        return;
      }

      document.getElementById('import-result-mod').textContent = result.mod_id || '';
      document.getElementById('import-stats').innerHTML = [
        stat(result.machines,         t('admin.mods.stat.machines')),
        stat(result.recipes_imported, t('admin.mods.stat.recipes')),
        stat(result.items,            t('admin.mods.stat.items')),
        stat(result.fluids,           t('admin.mods.stat.fluids')),
        stat(result.translations,     t('admin.mods.stat.translations')),
        stat(result.tags,             t('admin.mods.stat.tags')),
        stat(result.textures,         t('admin.mods.stat.textures')),
        stat(result.block_drops,      t('admin.mods.stat.block_drops')),
        stat(result.villager_trades,  t('admin.mods.stat.villager_trades')),
      ].filter(Boolean).join('');

      const warnings = result.warnings || [];
      document.getElementById('import-warnings').innerHTML = warnings
        .map(w => `<div class="import-warn-line">${esc(w)}</div>`)
        .join('');

      document.getElementById('import-result').style.display = '';
      // Warnings mean part of the import silently failed (e.g. every texture,
      // if the assets mount can't be written to) — "saved" alone would hide that.
      setStatus(warnings.length ? t('admin.mods.saved_with_warnings') : t('msg.saved'),
                warnings.length ? 'warn' : 'ok');
      document.getElementById('drop-file').textContent = '';
      _file = null;
      btn.disabled = true;
      loadStatus();
      loadMods();

      openModal({
        title:        t(warnings.length ? 'admin.mods.verify.title_warn' : 'admin.mods.verify.title'),
        bodyHTML:     `<p>${esc(t('admin.mods.verify.body'))}</p>`,
        confirmLabel: t('admin.mods.verify.confirm'),
        onConfirm:    () => { window.location.href = '/catalog/machines'; },
      });
    } catch(e) {
      pb.style.display = 'none';
      dropZone.classList.remove('disabled');
      setStatus(t('msg.network_error') + ': ' + e.message, 'err');
    }
  }

  function setStatus(msg, type) {
    const el = document.getElementById('import-status');
    el.textContent = msg;
    el.className = 'status-msg' + (type ? ' ' + type : '');
  }

  function stat(n, label) {
    if (!n) return '';
    return `<div class="detail-row"><span class="detail-key">${label}</span><span class="detail-val">${n}</span></div>`;
  }

  init();
</script>
</body>
</html>
