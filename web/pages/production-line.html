<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MC Optimizer — Production Line</title>
  <link rel="stylesheet" href="/static/ui/index.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <script>
    (function(){
      const s = localStorage.getItem('theme');
      if (s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark');
    })();
  </script>
  <style>
    /* Progress bar layout glue; .wui-progress-track/.wui-progress-fill supply the visuals
       (components/feedback.css). */
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: var(--gap-control);
      margin-bottom: var(--gap-field);
    }
    .progress-wrap .wui-progress-track { flex: 1; }
    .progress-label {
      font-size: var(--text-xs);
      color: var(--text-muted);
      white-space: nowrap;
      font-family: var(--font-mono);
    }

    /* Machine group table: page-specific cell content; widths/headers come from .table
       (tables.css), machine name+mod from .icontext. */

    /* Build-state fields: compact "n / N" number inputs, no spinner arrows. */
    .mg-build-field {
      display: flex; align-items: center; gap: var(--gap-icon);
      font-size: var(--text-xs); color: var(--text-muted); font-family: var(--font-mono);
    }
    .mg-build-field-label {
      --mg-build-label-width: 8.5em;
      width: var(--mg-build-label-width); flex-shrink: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: var(--text-faint); text-transform: uppercase;
      letter-spacing: 0.04em; font-size: 10px;
    }
    .mg-build-field input.input {
      width: 3em; height: var(--h-btn-sm); padding-inline: 2px; text-align: center;
      -moz-appearance: textfield; appearance: textfield;
    }
    .mg-build-field input.input::-webkit-inner-spin-button,
    .mg-build-field input.input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .mg-build-field .mg-build-max { color: var(--text-faint); }

    /* MG status toggle: planned (nothing built) / partial (some missing) / built (complete),
       derived from the numbers; click is a fill/reset shortcut. */
    .mg-tog {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: var(--h-btn-sm);
      border-radius: var(--radius);
      border: 1px solid transparent;
      font-size: 14px;
      cursor: pointer;
      transition: background .12s, border-color .12s;
    }
    .mg-tog .tog-cur { display: inline; }
    .mg-tog .tog-nxt { display: none; font-size: 10px; letter-spacing: -.5px; }
    .mg-tog:hover .tog-cur { display: none; }
    .mg-tog:hover .tog-nxt { display: inline; }
    .mg-tog.planned { --_icon-color: var(--text-faint); }
    .mg-tog.partial { --_icon-color: var(--warn); }
    .mg-tog.built   { --_icon-color: var(--success); }

    /* IO section label: groups the Detail-Grid rows into Inputs/Outputs. */
    .io-section-label {
      font-size: var(--text-xs); font-weight: var(--weight-semibold);
      text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint);
      margin: var(--gap-control) 0 var(--gap-inline);
    }
    .io-section-label:first-child { margin-top: 0; }
  </style>
</head>
<body class="app-shell">

  <header class="header">
    <a class="header-brand" href="/saves">
      <div class="header-logo">⚙️</div>
      <span>MC Optimizer</span>
    </a>
    <div class="header-right">
      <button data-wui-theme data-i18n-title="common.toggle_theme"></button>
      <div class="dropdown-wrap" data-wui-lang>
        <button data-dropdown-trigger></button>
        <div class="dropdown-panel">
          <button class="dropdown-item" data-lang="en">🇬🇧 English</button>
          <button class="dropdown-item" data-lang="de">🇩🇪 Deutsch</button>
        </div>
      </div>
      <div class="dropdown-wrap" data-wui-user-menu>
        <button class="user-menu-trigger" data-wui-user-trigger data-dropdown-trigger>
          <div class="avatar">?</div>
          <span class="username">…</span>
          <span class="chevron">▾</span>
        </button>
        <div class="dropdown-panel" data-wui-user-dropdown></div>
      </div>
    </div>
  </header>

  <div class="app-body">
    <nav class="sidebar"></nav>

    <main class="main">
      <div class="page">

        <div class="page-header">
          <div>
            <div class="breadcrumb">
              <a href="/saves" data-i18n="nav.saves"></a>
              <span class="breadcrumb-sep">▸</span>
              <a id="bc-save" href="#"></a>
              <span class="breadcrumb-sep">▸</span>
              <a id="bc-factory" href="#"></a>
              <span class="breadcrumb-sep">▸</span>
              <span class="breadcrumb-current" id="bc-pl">…</span>
            </div>
            <div class="page-title" id="page-title">…</div>
          </div>
          <span class="badge" id="pl-status-pill"></span>
        </div>

        <div class="split-layout fit">

          <div class="main-panel" style="display:flex;flex-direction:column;gap:var(--gap-container);">

            <!-- Meta + actions -->
            <div class="container">
              <div class="container-body">
                <div class="detail-grid" id="pl-meta" style="margin-bottom:var(--gap-field);"></div>
                <div class="progress-wrap" id="progress-wrap" style="display:none;">
                  <div class="wui-progress-track">
                    <div class="wui-progress-fill" id="progress-fill"></div>
                  </div>
                  <span class="progress-label" id="progress-label"></span>
                </div>
                <div style="display:flex;gap:var(--gap-control);flex-wrap:wrap;" id="action-bar"></div>
              </div>
            </div>

            <!-- Machine Groups -->
            <div class="container">
              <div class="container-header">
                <span class="container-title" data-i18n="production_line.machine_groups"></span>
              </div>
              <div class="container-body-flush">
                <table class="table">
                  <thead><tr>
                    <th style="width:32px" data-i18n="solve.col.count"></th>
                    <th data-i18n="solve.col.machine"></th>
                    <th style="width:120px" data-i18n="solve.col.recipe"></th>
                    <th style="width:170px"></th>
                    <th style="width:36px"></th>
                  </tr></thead>
                  <tbody id="mg-list">
                    <tr><td colspan="5"><span class="td-faint" data-i18n="common.loading"></span></td></tr>
                  </tbody>
                </table>
              </div>
            </div>

          </div><!-- /.main-panel -->

          <div class="side-panel">
            <div class="container">
              <div class="container-header">
                <span class="container-title" data-i18n="production_line.io_profile"></span>
              </div>
              <div class="container-body" id="io-list">
                <span class="td-faint" data-i18n="common.loading"></span>
              </div>
            </div>
          </div>

        </div><!-- /.split-layout -->

      </div><!-- /.page -->
    </main>
  </div>

<script type="module">
  import { guard, apiFetch } from '/static/ui/js/auth.js';
  import { load, applyI18n, getLang, t, esc } from '/static/js/i18n.js';
  import { machine as machineName, loadMI } from '/static/js/i18n.js';
  import { init as initHeader } from '/static/js/header.js';
  import { rateHTML } from '/static/js/rates.js';
  import { loadCatalog, iconTextHTML, machineIconTextHTML, lookupMachine } from '/static/js/catalog-registry.js';
  import { initHiDPIRender } from '/static/ui/js/hidpi-render.js';

  const _lang = getLang();
  await load(_lang);
  await loadMI(_lang);
  applyI18n();
  guard();
  initHeader();

  const _plID = window.location.pathname.split('/')[2];
  let _pl = null;
  let _recipeOutputs = new Map(); // recipe_id -> display name of what it produces

  async function init() {
    const [res] = await Promise.all([
      apiFetch('/api/production-lines/' + _plID),
      loadCatalog(),
    ]);
    if (!res?.ok) { window.location.href = '/saves'; return; }
    _pl = await res.json();

    const plTitle = _pl.target_item_name || _pl.target_item_id.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
    document.title = 'MC Optimizer — ' + plTitle;
    document.getElementById('page-title').textContent = plTitle;
    document.getElementById('bc-pl').textContent      = plTitle;

    if (_pl.factory_id) {
      const fRes = await apiFetch('/api/factories/' + _pl.factory_id);
      if (fRes?.ok) {
        const { factory } = await fRes.json();
        document.getElementById('bc-factory').textContent = factory.name;
        document.getElementById('bc-factory').href        = '/factories/' + _pl.factory_id;
        const sRes = await apiFetch('/api/saves/' + factory.save_id);
        if (sRes?.ok) {
          const save = await sRes.json();
          document.getElementById('bc-save').textContent = save.name;
          document.getElementById('bc-save').href        = '/saves/' + factory.save_id;
        }
      }
    }

    await loadRecipeOutputs();
    render();
  }

  // machine_groups stores only recipe_id, so the output name is resolved via
  // the recipe catalog, one fetch per distinct machine.
  async function loadRecipeOutputs() {
    const machines = new Map(); // "mod:machine" -> {mod, machine}
    for (const g of (_pl.machine_groups || [])) {
      machines.set(g.machine_mod_id + ':' + g.machine_id, { mod: g.machine_mod_id, machine: g.machine_id });
    }
    await Promise.all([...machines.values()].map(async ({ mod, machine }) => {
      const res = await apiFetch(`/api/mods/${encodeURIComponent(mod)}/recipes?machine_id=${encodeURIComponent(machine)}`);
      if (!res?.ok) return;
      for (const r of await res.json()) {
        const out = r.item_outputs?.[0]?.item_name || r.fluid_outputs?.[0]?.fluid_name;
        if (out) _recipeOutputs.set(r.id, out);
      }
    }));
  }

  function render() {
    renderStatusPill();
    renderMeta();
    renderProgress();
    renderActionBar();
    renderMachineGroups();
    renderIO();
  }

  // Tone mapping covers every status the DB CHECK constraint allows
  // (production_lines.status IN ('draft','active','archived')).
  function renderStatusPill() {
    const status = _pl.status;
    const tone = status === 'active' ? 'badge-success' : status === 'draft' ? 'badge-warn' : 'badge-accent';
    document.getElementById('pl-status-pill').outerHTML =
      `<span id="pl-status-pill" class="badge ${tone}">${esc(t('status.' + status))}</span>`;
  }

  // A group is complete when all its machines stand and are built to the
  // target variant. The whole line is complete when every group is.
  function isGroupComplete(g) {
    return (g.built_count || 0) >= g.count && isVariantBuilt(g);
  }
  function isVariantBuilt(g) {
    return !g.variant || !g.current_variant || g.current_variant.id === g.variant.id;
  }
  function isLineComplete() {
    const mgs = _pl.machine_groups || [];
    return mgs.length > 0 && mgs.every(isGroupComplete);
  }

  // Key/value row for the Detail-Grid meta block. The "current" value (from the
  // real build state) renders muted in parens next to the target — only while
  // the line is incomplete; once fully built it matches the target anyway.
  function statPair(label, targetHTML, currentHTML, showCurrent) {
    return `<div class="detail-row">
      <span class="detail-key">${esc(label)}</span>
      <span class="detail-val">${targetHTML}${showCurrent ? ` <span class="metric-warn">(${currentHTML})</span>` : ''}</span>
    </div>`;
  }

  function renderMeta() {
    const isFluid    = _pl.target_kind === 'fluid';
    const rate       = rateHTML({ num: _pl.rate_num, den: _pl.rate_den }, _pl.time_unit, { isFluid });
    const targetName = _pl.target_item_name || (_pl.target_item_id.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()));
    const incomplete = _pl.status === 'active' && !isLineComplete();
    const curRate    = rateHTML(_pl.current_rate || 0, _pl.time_unit, { isFluid, cls: 'metric-warn' });
    document.getElementById('pl-meta').innerHTML = `
      <div class="detail-row">
        <span class="detail-key">${esc(t('production_line.meta.target'))}</span>
        ${iconTextHTML(_pl.target_mod_id, _pl.target_item_id, { isFluid: _pl.target_kind === 'fluid', name: targetName, subtitle: _pl.target_mod_id, size: 'lg' })}
      </div>
      <div class="detail-row">
        <span class="detail-key">${esc(t('production_line.meta.mode'))}</span>
        <span class="detail-val">${esc(_pl.optimize_mode.toUpperCase())}</span>
      </div>
      ${statPair(t('common.rate'), rate, curRate, incomplete)}
    `;
    initHiDPIRender(document.getElementById('pl-meta'));
  }

  // Build progress is machine-weighted now that groups can be partially built:
  // sum of built_count over sum of count, not a count of fully-built groups.
  function renderProgress() {
    const mgs   = _pl.machine_groups || [];
    const total = mgs.reduce((s, g) => s + (g.count || 0), 0);
    const built = mgs.reduce((s, g) => s + Math.min(g.built_count || 0, g.count || 0), 0);
    const pw    = document.getElementById('progress-wrap');

    if (_pl.status === 'active' && total > 0) {
      pw.style.display = '';
      const fill = document.getElementById('progress-fill');
      fill.style.width = Math.round(built / total * 100) + '%';
      fill.style.background = isLineComplete() ? 'var(--success)' : '';
      document.getElementById('progress-label').textContent =
        `${built} / ${total} ${t('production_line.machines_built')}`;
    } else {
      pw.style.display = 'none';
    }
  }

  // Status actions only: mark machines built, archive the line.
  function renderActionBar() {
    const bar = document.getElementById('action-bar');

    if (_pl.status !== 'active') { bar.innerHTML = ''; return; }

    bar.innerHTML = `
      ${!isLineComplete() ? `<button class="btn btn-primary btn-sm" data-action="markAllBuilt">${esc(t('production_line.mark_all_built'))}</button>` : ''}
      <button class="btn btn-ghost btn-sm" data-action="scalePL">${esc(t('production_line.scale'))}</button>
      <button class="btn btn-ghost btn-sm" data-action="archivePL">${esc(t('production_line.archive'))}</button>
    `;
    bar.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.action === 'markAllBuilt') markAllBuilt();
        if (btn.dataset.action === 'scalePL')      scalePL();
        if (btn.dataset.action === 'archivePL')    archivePL();
      });
    });
  }

  // Machine-group rows render into the <tbody> of the .table set up in the
  // page markup (thead columns are static HTML). The current build state
  // (machines built) is editable inline per row.
  function renderMachineGroups() {
    const mgs       = _pl.machine_groups || [];
    const container = document.getElementById('mg-list');

    if (!mgs.length) {
      container.innerHTML = `<tr><td colspan="5"><span class="td-empty"></span></td></tr>`;
      return;
    }

    container.innerHTML = mgs.map(g => mgRowHTML(g)).join('');
    initHiDPIRender(container);

    container.querySelectorAll('[data-mgtoggle]').forEach(btn => {
      btn.addEventListener('click', () => toggleMGStatus(btn.dataset.mgtoggle));
    });
    container.querySelectorAll('[data-built-input]').forEach(inp => {
      inp.addEventListener('change', () => onBuildFieldChange(inp));
    });
    container.querySelectorAll('[data-item-input]').forEach(inp => {
      inp.addEventListener('change', () => onItemFieldChange(inp));
    });
  }

  // Derived group status: planned (nothing built), partial (something but not
  // everything), built (complete) — computed from built_count, never stored
  // directly. The toggle icon reflects it; clicking is a shortcut: planned/partial
  // fill the count to target, built resets it to zero.
  function groupState(g) {
    if (isGroupComplete(g)) return 'built';
    if ((g.built_count || 0) === 0) return 'planned';
    return 'partial';
  }
  const STATE_GLYPH = { planned: '⚒', partial: '◐', built: '✓' };

  // Status-toggle cell: a clickable icon button while the line is active, a
  // plain static icon otherwise.
  function mgTogHTML(g) {
    const canToggle = _pl.status === 'active';
    const state     = groupState(g);
    const complete  = state === 'built';
    const glyph     = STATE_GLYPH[state];
    const nxtGlyph  = complete ? '✓→⚒' : `${glyph}→✓`;
    return canToggle
      ? `<button class="mg-tog btn-icon-color ${state}"
           data-mgtoggle="${esc(g.id)}"
           title="${esc(t('status.' + state))}">
           <span class="tog-cur">${glyph}</span>
           <span class="tog-nxt">${nxtGlyph}</span>
         </button>`
      : `<span class="mg-tog ${state}" style="color:var(--_icon-color);cursor:default;">${glyph}</span>`;
  }

  // Build-state fields: hidden once the line isn't active, or once the group
  // is complete — nothing left to adjust, the row falls back to the plain
  // single-icon display in the toggle cell. Below the machine count, one field
  // per item kind the target variant installs, counted per machine.
  function mgBuildFieldHTML(g) {
    if (_pl.status !== 'active' || groupState(g) === 'built') return '';
    const items = (g.variant?.items || []).map(it => {
      const cur = (g.current_variant?.items || []).find(c => c.ref === it.ref)?.count || 0;
      return `
      <label class="mg-build-field" title="${esc(it.name)} (${esc(it.ref)})">
        <span class="mg-build-field-label">${esc(it.name)}</span>
        <input class="input" type="number" min="0" max="${it.count}" step="1" value="${cur}"
               data-item-input="${esc(g.id)}" data-ref="${esc(it.ref)}" data-max="${it.count}" />
        <span class="mg-build-max">/${it.count}</span>
      </label>`;
    }).join('');
    return `
      <label class="mg-build-field">
        <span class="mg-build-field-label">${esc(t('production_line.build.built'))}</span>
        <input class="input" type="number" min="0" max="${g.count}" step="1" value="${g.built_count || 0}"
               data-built-input="${esc(g.id)}" data-max="${g.count}" />
        <span class="mg-build-max">/${g.count}</span>
      </label>${items}`;
  }

  // The target variant's own label under the machine name, only when it
  // installs something — the base variant has nothing to say.
  function mgVariantHTML(g) {
    if (!g.variant?.items?.length) return '';
    return `<div class="icontext-subtitle">${esc(g.variant.label)}</div>`;
  }

  function mgRowHTML(g) {
    // The machine index knows the block's own name; machineName() is the
    // fallback for one the catalog has no row for.
    const name    = lookupMachine(g.machine_mod_id, g.machine_id)?.name
                 ?? machineName(g.machine_mod_id, g.machine_id);
    const outName = _recipeOutputs.get(g.recipe_id) || '—';

    return `<tr>
        <td>${esc(g.count)}×</td>
        <td>
            ${machineIconTextHTML(g.machine_mod_id, g.machine_id, {
              name, subtitle: g.machine_mod_id, size: 'lg',
            })}
            ${mgVariantHTML(g)}
        </td>
        <td class="td-mono" style="font-size:var(--text-xs)" title="${esc(outName)}">${esc(outName)}</td>
        <td>${mgBuildFieldHTML(g)}</td>
        <td>${mgTogHTML(g)}</td>
    </tr>`;
  }

  // IO rows use the same Detail-Grid pattern as the meta block, grouped under
  // a page-local .io-section-label (Detail-Grid has no sub-heading concept).
  function renderIO() {
    const ioEl    = document.getElementById('io-list');
    const all     = _pl.io || [];
    const inputs  = all.filter(e => e.direction === 'input');
    const outputs = all.filter(e => e.direction === 'output');

    let html = '';
    if (inputs.length) {
      html += `<div class="io-section-label">${esc(t('solve.inputs'))}</div>`;
      html += `<div class="detail-grid">${inputs.map(e => ioRow(e, false)).join('')}</div>`;
    }
    if (outputs.length) {
      html += `<div class="io-section-label">${esc(t('solve.outputs'))}</div>`;
      html += `<div class="detail-grid">${outputs.map((e, i) => ioRow(e, i === 0)).join('')}</div>`;
    }
    ioEl.innerHTML = html || `<span class="td-faint">—</span>`;
    initHiDPIRender(ioEl);
  }

  function ioRow(e, isPrimary) {
    const rate = rateHTML({ num: e.rate_num, den: e.rate_den }, _pl.time_unit || 't', { isFluid: e.io_type === 'fluid' });
    // Same fallback as targetName above: a name-less id reads as words.
    const name  = e.name || e.item_fluid_id.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
    const label = iconTextHTML(e.mod_id, e.item_fluid_id, {
      isFluid:  e.io_type === 'fluid',
      name,
      subtitle: e.mod_id,
      size:     'sm',
    });
    const star = isPrimary ? `<span style="color:var(--accent);font-weight:var(--weight-semibold)">★</span> ` : '';
    return `<div class="detail-row">
      <span class="detail-key" style="color:var(--text)">${star}${label}</span>
      <span class="detail-val">${rate}</span>
    </div>`;
  }

  async function markAllBuilt() {
    const res = await apiFetch('/api/production-lines/' + _plID + '/mark-built', { method: 'PATCH', body: '{}' });
    if (res?.ok || res?.status === 200) reload();
  }

  // The manual override on a saved line: everything scales, the rows keep
  // their build state. Refused when a group would end up below what is built.
  async function scalePL() {
    const input = prompt(t('production_line.scale_prompt'), '2');
    if (input === null) return;
    const factor = parseFloat(input.replace(',', '.'));
    if (!Number.isFinite(factor) || factor <= 0) return;

    const d = 10000, n = Math.round(factor * d);
    const g = (a, b) => b ? g(b, a % b) : a;
    const k = g(n, d);

    const res = await apiFetch('/api/production-lines/' + _plID + '/scale', {
      method: 'POST', body: JSON.stringify({ factor: { num: n / k, den: d / k } }),
    });
    if (res?.ok) { reload(); return; }
    const body = await res?.json().catch(() => ({}));
    alert(body.message || t('common.error'));
  }

  async function archivePL() {
    if (!confirm(t('production_line.confirm_archive'))) return;
    const res = await apiFetch('/api/production-lines/' + _plID + '/status', {
      method: 'PATCH', body: JSON.stringify({ status: 'archived' }),
    });
    if (res?.ok || res?.status === 204) reload();
  }

  // Sends the group's new build state and keeps the coarse status in sync
  // ('built' when complete, 'planned' otherwise). currentVariantID, when
  // given, records which variant the machines are built to. Always reloads,
  // also on error.
  async function updateBuildState(g, builtCount, currentVariantID) {
    const built = builtCount >= g.count && (currentVariantID ? currentVariantID === g.variant_id : isVariantBuilt(g));
    const body = { status: built ? 'built' : 'planned', built_count: builtCount };
    if (currentVariantID) body.current_variant_id = currentVariantID;
    await apiFetch('/api/machine-groups/' + g.id + '/status', {
      method: 'PATCH', body: JSON.stringify(body),
    });
    reload();
  }

  function findGroup(id) {
    return (_pl.machine_groups || []).find(g => g.id === id);
  }

  // Toggle shortcut: planned/partial fill the build state to target (machines
  // and their variant), built resets the machine count.
  function toggleMGStatus(id) {
    const g = findGroup(id);
    if (!g) return;
    if (isGroupComplete(g)) updateBuildState(g, 0);
    else updateBuildState(g, g.count, g.variant_id);
  }

  function onBuildFieldChange(inp) {
    const g = findGroup(inp.dataset.builtInput);
    if (!g) return;
    const max = Number(inp.dataset.max);
    let v = Math.round(Number(inp.value));
    if (!Number.isFinite(v) || v < 0) v = 0;
    if (v > max) v = max;
    updateBuildState(g, v);
  }

  // An item field names how many of one item kind each machine has installed.
  // The built variant is the option installing exactly that; a count no option
  // offers is refused and the field snaps back.
  function onItemFieldChange(inp) {
    const g = findGroup(inp.dataset.itemInput);
    if (!g) return;
    const ref = inp.dataset.ref;
    const max = Number(inp.dataset.max);
    let n = Math.round(Number(inp.value));
    if (!Number.isFinite(n) || n < 0) n = 0;
    if (n > max) n = max;
    const opt = (g.variant_options || []).find(o => n === 0
      ? o.items.length === 0
      : o.items.length === 1 && o.items[0].ref === ref && o.items[0].count === n);
    if (!opt) { render(); return; }
    updateBuildState(g, g.built_count || 0, opt.id);
  }

  async function reload() {
    const res = await apiFetch('/api/production-lines/' + _plID);
    if (!res?.ok) return;
    _pl = await res.json();
    render();
  }

  init();
</script>
</body>
</html>
