<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MC Optimizer — Fluids</title>
  <link rel="stylesheet" href="/static/ui/index.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <link rel="stylesheet" href="/static/css/catalog-common.css" />
  <link rel="stylesheet" href="/static/css/crafting-card.css" />
  <style>
    tr[data-fluid-key].row-selected td { background: var(--bg-hover); }
  </style>
  <script>
    (function(){
      const s = localStorage.getItem('theme');
      if (s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark');
    })();
  </script>
</head>
<body class="app-shell">
  <header class="header">
    <a class="header-brand" href="/saves"><div class="header-logo">⚙️</div><span>MC Optimizer</span></a>
    <div class="header-right">
      <button data-wui-theme data-i18n-title="common.toggle_theme"></button>
      <div class="dropdown-wrap" data-wui-lang><button data-dropdown-trigger></button><div class="dropdown-panel"><button class="dropdown-item" data-lang="en">🇬🇧 English</button><button class="dropdown-item" data-lang="de">🇩🇪 Deutsch</button></div></div>
      <div class="dropdown-wrap" data-wui-user-menu><button class="user-menu-trigger" data-wui-user-trigger data-dropdown-trigger><div class="avatar">?</div><span class="username">…</span><span class="chevron">▾</span></button><div class="dropdown-panel" data-wui-user-dropdown></div></div>
    </div>
  </header>
  <div class="app-body">
    <nav class="sidebar"></nav>
    <main class="main"><div class="page">

      <div class="page-header" data-page-header-area>
        <div class="page-title-row">
          <h1 class="page-title" data-i18n="catalog.fluids.title"></h1>
        </div>
      </div>

      <div class="split-layout">
        <div class="main-panel">
          <div class="container">
            <div class="container-header">
              <span class="container-title" id="fluid-count"></span>
            </div>
            <div class="container-filter">
              <div class="wui-ac-wrap" style="width:220px;">
                <input class="input" id="fluid-search" data-i18n-placeholder="catalog.search_placeholder"
                  style="width:100%;height:var(--h-btn-sm);" autocomplete="off" />
                <div class="wui-ac-drop" id="fluid-search-ac"></div>
              </div>
            </div>
            <div class="container-body-flush">
              <table class="table">
                <thead>
                  <tr>
                    <th style="width:100%;" data-i18n="catalog.mods.col.name"></th>
                    <th data-i18n="catalog.fluids.col.fluid_id"></th>
                  </tr>
                </thead>
                <tbody id="fluid-tbody">
                  <tr><td colspan="2" class="td-muted" style="padding:16px;text-align:center;" data-i18n="catalog.empty.loading"></td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="side-panel sticky">
          <div class="container">
            <div class="container-header">
              <span class="container-title" data-i18n="catalog.recipes.section.recipes"></span>
            </div>
            <div class="container-body" id="fluid-detail">
              <span class="td-muted" data-i18n="catalog.fluids.detail.empty"></span>
            </div>
          </div>
        </div>
      </div>

    </div></main>
  </div>
</div>

<script type="module">
  import { guard, apiFetch } from '/static/ui/js/auth.js';
  import { load, applyI18n, getLang, t, esc, tCount } from '/static/js/i18n.js';
  import { init as initHeader } from '/static/js/header.js';
  import { WuiAutocomplete } from '/static/ui/js/autocomplete.js';
  import { wuiFilter } from '/static/ui/js/filter.js';
  import { loadCatalog, entryOf, iconImageHTML } from '/static/js/catalog-registry.js';
  import { VirtualWindow } from '/static/ui/js/virtual-window.js';
  import { initHiDPIRender } from '/static/ui/js/hidpi-render.js';
  import { initInfocards } from '/static/ui/js/infocard.js';
  import { initIconCycle } from '/static/ui/js/icon-cycle.js';
  import { recipeListHTML } from '/static/js/recipe-card.js';

  await load(getLang());
  applyI18n();
  guard();
  initHeader();

  const tbody    = document.getElementById('fluid-tbody');
  const table    = tbody.closest('table');
  let groupBodies = []; // sibling <tbody> pairs appended per mod
  const countEl  = document.getElementById('fluid-count');
  const searchEl = document.getElementById('fluid-search');
  const detailEl = document.getElementById('fluid-detail');
  const params   = new URLSearchParams(location.search);
  const urlMod               = params.get('mod') || '';
  const urlProducedByMod     = params.get('producedByMod') || '';
  const urlProducedByMachine = params.get('producedByMachine') || '';
  const urlFluid             = params.get('fluid') || ''; // "modid:fluidid" — pre-selects that row

  let allFluids = [];
  let modNames = {};
  let machineNames = {}; // "modid:machineid" -> display name, for recipe-card meta rows
  let filtered = [];
  let selectedKey = ''; // "modid:fluidid" of the row currently shown in the side panel
  const openGroups = new Map();
  const groupRows = new Map();

  async function selectFluid(fluid) {
    selectedKey = fluid.mod_id + ':' + fluid.fluid_id;
    detailEl.innerHTML = `<span class="td-muted" data-i18n="catalog.empty.loading"></span>`;
    applyI18n(detailEl);
    const res = await apiFetch(`/api/fluids/${encodeURIComponent(fluid.mod_id)}/${encodeURIComponent(fluid.fluid_id)}/recipes`);
    if (!res?.ok) {
      detailEl.innerHTML = `<span class="td-muted" data-i18n="catalog.fluids.detail.load_error"></span>`;
      applyI18n(detailEl);
      return;
    }
    const recipes = await res.json();
    detailEl.innerHTML = recipeListHTML(recipes, r => machineNames[r.machine_mod_id + ':' + r.machine_id]);
    applyI18n(detailEl);
    initHiDPIRender(detailEl);
    initInfocards(detailEl);
    initIconCycle(detailEl);
  }

  function fluidRowEl(fluid) {
    const entry = entryOf(fluid, true);
    const tr = document.createElement('tr');
    tr.dataset.fluidKey = fluid.mod_id + ':' + fluid.fluid_id;
    tr.className = tr.dataset.fluidKey === selectedKey ? 'row-selected' : '';
    tr.style.cursor = 'pointer';
    tr.innerHTML = `
      <td>
        <span class="row-name-link" data-infocard-inline>
          <span class="icontext icontext-sm">
            ${iconImageHTML(entry, { cls: 'icontext-icon', hidpiPx: 16 })}
            <span class="icontext-body"><span class="icontext-text">${esc(fluid.name || fluid.fluid_id)}</span></span>
          </span>
        </span>
        <div class="infocard-def" hidden>
          <div class="infocard-header">
            ${iconImageHTML(entry, { cls: 'infocard-icon', placeholder: false, hidpiPx: 28 })}
            <div class="infocard-heading">
              <span class="infocard-title">${esc(fluid.name || fluid.fluid_id)}</span>
              <span class="infocard-subtitle">${esc(fluid.mod_name)}</span>
            </div>
          </div>
        </div>
      </td>
      <td class="td-mono td-muted">${esc(fluid.fluid_id)}</td>`;
    tr.addEventListener('click', () => {
      table.querySelectorAll('tr.row-selected').forEach(el => el.classList.remove('row-selected'));
      tr.classList.add('row-selected');
      selectFluid(fluid);
    });
    initHiDPIRender(tr);
    initInfocards(tr);
    return [tr];
  }

  function skeletonRowEl() {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span class="skeleton-bar" style="width:70%;"></span></td>
      <td><span class="skeleton-bar" style="width:40%;"></span></td>`;
    return [tr];
  }

  function toggleGroup(modId, hdRow, rowsBody) {
    const collapsed = hdRow.classList.toggle('collapsed');
    if (collapsed) {
      openGroups.get(modId)?.destroy();
      openGroups.delete(modId);
      return;
    }
    const fluids = groupRows.get(modId) || [];
    const vw = new VirtualWindow({
      container: rowsBody,
      scrollMode: 'ancestor',
      scrollEl: document.querySelector('.main'),
      fetch: async (offset) => ({
        rows: fluids.slice(offset, offset + 50),
        hasMore: offset + 50 < fluids.length,
      }),
      renderRow: fluidRowEl,
      renderSkeletonRow: skeletonRowEl,
    });
    openGroups.set(modId, vw);
    vw.start();
  }

  function resetAndRender() {
    const q = searchEl.value.trim().toLowerCase();
    filtered = urlMod ? allFluids.filter(f => f.mod_id === urlMod) : allFluids;
    if (q) filtered = filtered.filter(f => wuiFilter(f, q, ['name', 'fluid_id', 'mod_name']));
    countEl.textContent = tCount(filtered.length, 'catalog.fluids.count');

    for (const vw of openGroups.values()) vw.destroy();
    openGroups.clear();
    groupRows.clear();

    groupBodies.forEach(b => b.remove());
    groupBodies = [];
    tbody.innerHTML = '';
    if (!filtered.length) {
      tbody.innerHTML = `<tr><td colspan="2" class="td-muted" style="padding:16px;text-align:center;">${t('catalog.empty.no_fluids')}</td></tr>`;
      return;
    }

    const byMod = new Map();
    for (const f of filtered) {
      if (!byMod.has(f.mod_id)) byMod.set(f.mod_id, []);
      byMod.get(f.mod_id).push(f);
    }

    for (const [modId, fluids] of byMod) {
      groupRows.set(modId, fluids);
      const modName = modNames[modId] || modId;

      const hdBody = document.createElement('tbody');
      const hdRow = document.createElement('tr');
      hdRow.className = 'table-group-hd collapsed';
      hdRow.dataset.modId = modId;
      hdRow.innerHTML = `<td colspan="2"><span class="group-hd-arrow"></span><a href="/catalog/mods" class="catalog-link">${esc(modName)}</a><span class="td-muted" style="font-size:var(--text-xs);margin-left:6px;">${fluids.length}</span></td>`;
      hdBody.appendChild(hdRow);

      const rowsBody = document.createElement('tbody');
      hdRow.addEventListener('click', e => {
        if (e.target.closest('a')) return;
        toggleGroup(modId, hdRow, rowsBody);
      });

      table.appendChild(hdBody);
      table.appendChild(rowsBody);
      groupBodies.push(hdBody, rowsBody);
    }
  }

  searchEl.addEventListener('input', resetAndRender);

  const fluidsURL = urlProducedByMod
    ? `/api/fluids?producedByMod=${encodeURIComponent(urlProducedByMod)}`
    : urlProducedByMachine
    ? `/api/fluids?producedByMachine=${encodeURIComponent(urlProducedByMachine)}`
    : '/api/fluids?all=true';

  const [fluidsRes, modsRes, machinesRes] = await Promise.all([
    apiFetch(fluidsURL),
    apiFetch('/api/mods'),
    apiFetch('/api/machines'),
    loadCatalog(),
  ]);
  if (modsRes?.ok) {
    const mods = await modsRes.json();
    mods.forEach(m => { modNames[m.mod_id] = m.name; });
  }
  if (machinesRes?.ok) {
    const machines = await machinesRes.json();
    machines.forEach(m => {
      machineNames[m.mod_id + ':' + m.machine_id] = m.name;
      (m.variants || []).forEach(v => { machineNames[v.mod_id + ':' + v.machine_id] = v.name; });
    });
  }
  if (fluidsRes?.ok) {
    allFluids = await fluidsRes.json();
    allFluids.forEach(f => { f.mod_name = modNames[f.mod_id] || f.mod_id; });
    resetAndRender();
    if (urlFluid) {
      const [fm, fi] = urlFluid.split(':');
      const match = allFluids.find(f => f.mod_id === fm && f.fluid_id === fi);
      if (match) {
        const hd = table.querySelector(`.table-group-hd[data-mod-id="${CSS.escape(match.mod_id)}"]`);
        if (hd) toggleGroup(match.mod_id, hd, hd.parentElement.nextElementSibling);
        selectFluid(match);
      }
    }
    new WuiAutocomplete({
      inputEl:   searchEl,
      dropEl:    document.getElementById('fluid-search-ac'),
      primary:   r => r.name || r.fluid_id,
      secondary: r => r.mod_name,
      fetch(q, offset) {
        const rows = wuiFilter(allFluids, q, ['name', 'fluid_id', 'mod_name']);
        return Promise.resolve({ rows: rows.slice(offset, offset + 50), hasMore: offset + 50 < rows.length });
      },
      onSelect(r) { searchEl.value = r.name || r.fluid_id; searchEl.dispatchEvent(new Event('input')); },
    });
  }
</script>
</body>
</html>
