<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MC Optimizer — Recipes</title>
  <link rel="stylesheet" href="/static/ui/index.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <script>
    (function(){
      const s = localStorage.getItem('theme');
      if (s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark');
    })();
  </script>
  <style>
    .catalog-link { color: var(--text-base); text-decoration: none; border-bottom: 1px solid var(--border); }
    .catalog-link:hover { color: var(--accent); border-color: var(--accent); }
    .table-expand-trigger.open { display: inline-block; transform: rotate(90deg); }
    .recipe-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap-container); }
    .detail-section-title {
      font-size: var(--text-xs); font-weight: var(--weight-semibold);
      color: var(--text-faint); text-transform: uppercase; letter-spacing: .05em;
      margin-bottom: var(--gap-inline);
    }
    .detail-io-row { display: flex; align-items: baseline; gap: var(--gap-inline); font-size: var(--text-sm); padding: 2px 0; }
    .detail-io-amount { color: var(--text-muted); min-width: 36px; text-align: right; font-family: var(--font-mono); }
    .detail-io-sub { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-faint); margin-left: 4px; }
    .detail-io-prob { font-size: var(--text-xs); color: var(--accent); }
    .group-toggle { cursor: pointer; user-select: none; font-size: .7em; opacity: .5; padding-right: 4px; }
    .group-toggle::before { content: '▾'; }
    .table-group-hd.collapsed .group-toggle::before { content: '▸'; }
    .crafting-layout { display: flex; align-items: flex-start; gap: var(--gap-container); }
    .crafting-grid { display: grid; gap: 2px; flex-shrink: 0; }
    .crafting-cell { width: 36px; height: 36px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-raised); display: flex; align-items: center; justify-content: center; font-size: var(--text-xs); color: var(--text-muted); text-align: center; padding: 2px; line-height: 1.2; overflow: hidden; }
    .crafting-cell.empty { opacity: .3; }
    .crafting-cell--nc { border-style: dashed; opacity: .75; }
    .nc-badge { position: absolute; bottom: 1px; right: 2px; font-size: 8px; color: var(--text-faint); pointer-events: none; }
    .crafting-cell { position: relative; }
    .crafting-arrow { font-size: 1.2em; color: var(--text-faint); align-self: center; }
    .crafting-result { display: flex; flex-direction: column; gap: var(--gap-inline); justify-content: center; }
  </style>
</head>
<body class="app-shell">
  <header class="header">
    <a class="header-brand" href="/saves"><div class="header-logo">⚙️</div><span>MC Optimizer</span></a>
    <div class="header-right">
      <button data-wui-theme data-i18n-title="common.toggle_theme"></button>
      <div class="dropdown-wrap" data-wui-lang><button data-dropdown-trigger></button><div class="dropdown-panel"><button class="dropdown-item" data-lang="en">🇬🇧 English</button><button class="dropdown-item" data-lang="de">🇩🇪 Deutsch</button></div></div>
      <div class="dropdown-wrap" data-wui-user-menu><button class="user-menu-trigger" data-wui-user-trigger data-dropdown-trigger><div class="avatar">?</div><span class="username">…</span><span class="chevron">▾</span></button><div class="dropdown-panel" data-wui-user-dropdown></div></div>
    </div>
  </header>
  <div class="app-body">
    <nav class="sidebar"></nav>
    <main class="main"><div class="page">

      <div class="page-header" data-page-header-area>
        <div class="page-title-row">
          <h1 class="page-title" data-i18n="catalog.recipes.title"></h1>
        </div>
      </div>

      <div class="container">
        <div class="container-header">
          <span class="container-title" id="recipe-count"></span>
        </div>
        <div class="container-filter">
          <div class="wui-ac-wrap" style="width:260px;">
            <input class="input" id="recipe-search" data-i18n-placeholder="catalog.search_placeholder"
              style="width:100%;height:var(--h-btn-sm);" autocomplete="off" />
            <div class="wui-ac-drop" id="recipe-search-ac"></div>
          </div>
        </div>
        <div class="container-body-flush">
          <table class="table">
            <thead>
              <tr>
                <th style="width:24px;"></th>
                <th data-i18n="catalog.recipes.col.machine"></th>
                <!-- TODO: name column hidden until recipes have proper names
                <th style="width:120px;" data-i18n="catalog.mods.col.name"></th> -->
                <th data-i18n="catalog.recipes.section.recipes" style="width:100%;"></th>
                <th style="width:80px;" data-i18n="catalog.recipes.col.duration"></th>
                <th style="width:70px;">EU/t</th>
                <th style="width:80px;" data-i18n="catalog.recipes.col.total_eu"></th>
              </tr>
            </thead>
            <tbody id="recipe-tbody">
              <tr><td colspan="6" class="td-muted" style="padding:16px;text-align:center;" data-i18n="catalog.empty.loading"></td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div></main>
  </div>
</div>

<script type="module">
  import { guard, apiFetch } from '/static/ui/js/auth.js';
  import { load, applyI18n, getLang, t, esc } from '/static/js/i18n.js';
  import { init as initHeader } from '/static/js/header.js';
  import { initCellClampScroll } from '/static/ui/js/table-features.js';
  import { WuiAutocomplete } from '/static/ui/js/autocomplete.js';
  import { wuiFilter } from '/static/ui/js/filter.js';

  await load(getLang());
  applyI18n();
  guard();
  initHeader();

  const tbody = document.getElementById('recipe-tbody');
  const countEl = document.getElementById('recipe-count');
  const searchEl = document.getElementById('recipe-search');

  const params = new URLSearchParams(location.search);
  const urlMod     = params.get('mod')     || '';
  const urlMachine = params.get('machine') || '';
  const urlItem    = params.get('item')    || '';
  const urlFluid   = params.get('fluid')   || '';

  // modId → { name, recipe_count } (from /api/mods)
  let allMods = [];
  // modId → recipes[] (loaded on demand)
  const modRecipeCache = new Map();
  // "modId:machineId" → Map(recipeId → fullRecipe) (loaded on expand)
  const machineCache = new Map();
  // recipeId → rendered expand HTML
  const ioCache = new Map();


  function summaryList(ios) {
    return ios.slice(0, 3).map(io => io.item_name || io.fluid_name || io.tag_name || io.item_id || io.fluid_id || '?').join(', ')
      + (ios.length > 3 ? ` +${ios.length - 3}` : '');
  }

  function itemLabel(io) {
    if (io.tag_name) return '#' + io.tag_name;
    return io.item_name || io.item_id || '?';
  }

  function fmt0(v, suffix) {
    return (v == null || v === 0) ? '—' : (v + (suffix || ''));
  }

  function ioGrid(items) {
    if (!items.length) return `<div class="crafting-cell empty" style="width:36px;height:36px;"></div>`;
    const cols = Math.max(1, Math.ceil(Math.sqrt(items.length)));
    const rows = Math.ceil(items.length / cols);
    const total = cols * rows;
    const style = `grid-template-columns:repeat(${cols},36px);grid-template-rows:repeat(${rows},36px);`;
    let cells = '';
    for (let i = 0; i < total; i++) {
      if (i < items.length) {
        const io = items[i];
        const isFluid = io.fluid_id != null;
        const label = io.tag_name ? '#' + io.tag_name
          : (io.item_name || io.fluid_name || io.item_id || io.fluid_id || '?');
        const amt = isFluid && io.amount_mb ? io.amount_mb + 'mB'
          : (io.amount_num > 1 ? io.amount_num + '×' : '');
        const title = isFluid ? (io.fluid_mod_id + ':' + io.fluid_id) : ((io.item_mod_id || '') + ':' + (io.item_id || io.tag_name || ''));
        const ncMark = io.non_consuming ? `<span class="nc-badge" title="${esc(t('recipe.non_consuming_title'))}">↺</span>` : '';
        cells += `<div class="crafting-cell${io.non_consuming ? ' crafting-cell--nc' : ''}" title="${esc(title)}">${esc(label)}${amt ? `<span style="display:block;font-size:9px;opacity:.6;">${esc(amt)}</span>` : ''}${ncMark}</div>`;
      } else {
        cells += `<div class="crafting-cell empty"></div>`;
      }
    }
    return `<div class="crafting-grid" style="${style}">${cells}</div>`;
  }

  function craftingGrid(shape, inputs) {
    const nameMap = {};
    for (const io of inputs) {
      const key = io.tag_id ? ('#' + (io.tag_name || io.tag_id)) : (io.item_mod_id + ':' + io.item_id);
      nameMap[key] = itemLabel(io);
    }
    const cells = shape.map(slot => {
      if (!slot) return `<div class="crafting-cell empty"></div>`;
      const label = nameMap[slot] || nameMap['#' + slot] || slot.split(':').pop();
      return `<div class="crafting-cell" title="${esc(slot)}">${esc(label)}</div>`;
    });
    return `<div class="crafting-grid" style="grid-template-columns:repeat(3,36px);grid-template-rows:repeat(3,36px);">${cells.join('')}</div>`;
  }

  function recipeRows(recipes) {
    let html = '';
    for (const r of recipes) {
      const expandId = 'rdetail-' + esc(r.id);
      html += `<tr data-mod="${esc(r.machine_mod_id)}" data-expand-row="${expandId}" style="cursor:pointer;">
        <td><span class="table-expand-trigger" data-expand="${expandId}">▸</span></td>
        <td style="max-width:160px;">
          <span class="cell-clamp cell-clamp--scroll"><span class="cell-clamp-inner"><a href="/catalog/machines?mod=${encodeURIComponent(r.machine_mod_id)}&machine=${encodeURIComponent(r.machine_id)}" class="catalog-link">${esc(r.machine_name || r.machine_id)}</a></span></span>
        </td>
        <td class="td-muted"><span class="cell-clamp cell-clamp--scroll"><span class="cell-clamp-inner" id="summary-out-${esc(r.id)}">…</span></span></td>
        <td class="td-muted">${fmt0(r.duration_ticks, 't')}</td>
        <td class="td-muted">${fmt0(r.eu_per_tick)}</td>
        <td class="td-muted">${r.total_eu ? r.total_eu.toLocaleString() : '—'}</td>
      </tr>
      <tr class="table-expand-row" id="${expandId}" data-recipe-id="${esc(r.id)}" data-mod="${esc(r.machine_mod_id)}">
        <td colspan="6"><div class="table-expand-body" id="rbody-${esc(r.id)}">
          <span class="td-muted" style="font-size:var(--text-sm);">${t('catalog.empty.loading')}</span>
        </div></td>
      </tr>`;
    }
    return html;
  }

  // Populate summary cells for all recipes of a machine; always re-runs for re-rendered cells.
  async function ensureMachineLoaded(modId, machineId) {
    const key = modId + ':' + machineId;
    let byId;
    if (machineCache.has(key)) {
      byId = machineCache.get(key);
    } else {
      const res = await apiFetch(`/api/mods/${encodeURIComponent(modId)}/recipes?machine_id=${encodeURIComponent(machineId)}`);
      const recipes = res?.ok ? await res.json() : [];
      byId = new Map(recipes.map(r => [r.id, r]));
      machineCache.set(key, byId);
    }
    for (const [id, r] of byId) {
      const outSummary = [...(r.item_outputs || []), ...(r.fluid_outputs || [])];
      const el = document.getElementById('summary-out-' + id);
      if (el) {
        el.textContent = summaryList(outSummary) || '—';
        initCellClampScroll(el.closest('td'));
      }
    }
    return byId;
  }

  // Load and render recipes for a mod group; inserts rows after the group header.
  // Browse mode only — machine/item/fluid filters never reach this path (see
  // "Filtered mode" below), so no per-call filter merging is needed here.
  async function loadModGroup(modId, hdRow) {
    if (modRecipeCache.has(modId)) {
      return modRecipeCache.get(modId);
    }
    const res = await apiFetch(`/api/recipes?mod=${encodeURIComponent(modId)}`);
    const recipes = res?.ok ? await res.json() : [];
    modRecipeCache.set(modId, recipes);
    return recipes;
  }

  async function expandModGroup(hdRow) {
    const modId = hdRow.dataset.modGroup;
    if (hdRow.dataset.loaded) return;
    hdRow.dataset.loaded = '1';

    const placeholder = hdRow.nextElementSibling;
    const recipes = await loadModGroup(modId, hdRow);

    // update count badge
    const countBadge = hdRow.querySelector('.mod-recipe-count');
    if (countBadge) countBadge.textContent = recipes.length;

    if (!recipes.length) {
      if (placeholder?.dataset.placeholder) placeholder.remove();
      return;
    }

    const tmp = document.createElement('tbody');
    tmp.innerHTML = recipeRows(recipes);

    if (placeholder?.dataset.placeholder) placeholder.remove();
    // insert all rows after hdRow in order
    const toInsert = [...tmp.children];
    let ref = hdRow;
    for (const row of toInsert) {
      ref.insertAdjacentElement('afterend', row);
      ref = row;
    }

    initCellClampScroll(hdRow.closest('tbody'));

    // fire summary fetches per unique machine
    const machines = [...new Set(recipes.map(r => r.machine_id))];
    for (const machineId of machines) {
      ensureMachineLoaded(modId, machineId);
    }
  }

  function renderModGroups(mods) {
    if (!mods.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="td-muted" style="padding:16px;text-align:center;">${t('catalog.empty.no_recipes')}</td></tr>`;
      return;
    }
    let html = '';
    for (const m of mods) {
      html += `<tr class="table-group-hd collapsed" data-mod-group="${esc(m.mod_id)}">
        <td colspan="6"><span class="group-toggle"></span>
          <a href="/catalog/mods" class="catalog-link">${esc(m.name || m.mod_id)}</a>
          <span class="td-muted mod-recipe-count" style="font-size:var(--text-xs);margin-left:6px;">${m.recipe_count || 0}</span>
        </td>
      </tr>
      <tr data-placeholder="${esc(m.mod_id)}" hidden><td colspan="6"></td></tr>`;
    }
    tbody.innerHTML = html;
  }

  tbody.addEventListener('click', async e => {
    // group header toggle
    const hd = e.target.closest('.table-group-hd');
    if (hd) {
      if (e.target.closest('.catalog-link')) return;
      const wasCollapsed = hd.classList.contains('collapsed');
      hd.classList.toggle('collapsed');
      if (wasCollapsed) {
        // expanding: load if needed, then show rows
        await expandModGroup(hd);
        let el = hd.nextElementSibling;
        while (el && !el.classList.contains('table-group-hd')) {
          if (!el.dataset.placeholder) el.hidden = false;
          el = el.nextElementSibling;
        }
      } else {
        // collapsing: hide rows
        let el = hd.nextElementSibling;
        while (el && !el.classList.contains('table-group-hd')) {
          el.hidden = true;
          el = el.nextElementSibling;
        }
      }
      return;
    }

    // expand-trigger or clickable recipe row
    const trigger = e.target.closest('.table-expand-trigger');
    const clickedRow = e.target.closest('tr[data-expand-row]');
    if (!trigger && !clickedRow) return;
    if (e.target.closest('.catalog-link')) return;
    const rowID = trigger ? trigger.dataset.expand : clickedRow.dataset.expandRow;
    const row = rowID && document.getElementById(rowID);
    if (!row) return;

    const nowOpen = row.classList.toggle('open');
    const triggerEl = trigger ?? document.querySelector(`.table-expand-trigger[data-expand="${rowID}"]`);
    triggerEl?.classList.toggle('open', nowOpen);
    if (!nowOpen) return;

    const recipeID = row.dataset.recipeId;
    const bodyEl   = document.getElementById('rbody-' + recipeID);
    if (!bodyEl) return;

    if (ioCache.has(recipeID)) {
      bodyEl.innerHTML = ioCache.get(recipeID);
      return;
    }

    // find recipe metadata from cache
    const modId = row.dataset.mod;
    const hdRow = tbody.querySelector(`tr.table-group-hd[data-mod-group="${modId}"]`);
    const recipes = modRecipeCache.get(modId) || [];
    const recipe = recipes.find(r => r.id === recipeID);
    if (!recipe) { bodyEl.innerHTML = `<span class="td-muted">—</span>`; return; }

    const byId = await ensureMachineLoaded(recipe.machine_mod_id, recipe.machine_id);
    const full = byId?.get(recipeID);
    if (!full) { bodyEl.innerHTML = `<span class="td-muted">—</span>`; return; }

    const allInputs = [...(full.item_inputs || []), ...(full.fluid_inputs || [])];
    const allOutputs = [...(full.item_outputs || []), ...(full.fluid_outputs || [])];
    const inputGrid = full.machine_id === 'crafting_table' && full.shape?.length === 9
      ? craftingGrid(full.shape, full.item_inputs || [])
      : ioGrid(allInputs);
    const html = `<div class="crafting-layout">
      ${inputGrid}
      <div class="crafting-arrow">→</div>
      ${ioGrid(allOutputs)}
    </div>`;
    bodyEl.innerHTML = html;
    ioCache.set(recipeID, html);
  });

  searchEl.addEventListener('input', () => {
    const q = searchEl.value.trim().toLowerCase();
    if (!q) {
      // show all groups, hide their loaded rows back to collapsed state
      for (const hd of tbody.querySelectorAll('.table-group-hd')) {
        hd.hidden = false;
        if (!hd.classList.contains('collapsed')) {
          // keep expanded rows visible
        }
      }
      return;
    }
    // filter: show only matching mod groups (by mod_id / name)
    for (const hd of tbody.querySelectorAll('.table-group-hd')) {
      const modId = hd.dataset.modGroup;
      const modName = hd.querySelector('.catalog-link')?.textContent?.toLowerCase() || '';
      const match = modId.toLowerCase().includes(q) || modName.includes(q);
      hd.hidden = !match;
      let el = hd.nextElementSibling;
      while (el && !el.classList.contains('table-group-hd')) {
        el.hidden = !match || hd.classList.contains('collapsed');
        el = el.nextElementSibling;
      }
    }
  });

  // Filtered mode — arriving with a machine/item/fluid filter (the "I already
  // know what I want" signal). Single unified fetch carrying every active URL
  // filter dimension, so no dimension can be silently dropped the way the
  // two-parallel-code-paths version did (see 2026-07-04 session notes).
  // Renders matching recipes directly, grouped + auto-expanded.
  async function renderFilteredRecipes() {
    const qs = new URLSearchParams();
    if (urlMod)     qs.set('mod', urlMod);
    if (urlMachine) qs.set('machine', urlMachine);
    if (urlItem)    qs.set('item', urlItem);
    if (urlFluid)   qs.set('fluid', urlFluid);
    const res = await apiFetch(`/api/recipes?${qs.toString()}`);
    const recipes = res?.ok ? await res.json() : [];
    countEl.textContent = recipes.length + ' recipe' + (recipes.length !== 1 ? 's' : '');

    if (!recipes.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="td-muted" style="padding:16px;text-align:center;">${t('catalog.empty.no_recipes')}</td></tr>`;
      return;
    }

    const byMod = new Map();
    for (const r of recipes) {
      if (!byMod.has(r.machine_mod_id)) byMod.set(r.machine_mod_id, []);
      byMod.get(r.machine_mod_id).push(r);
    }

    let html = '';
    for (const [modId, modRecipes] of byMod) {
      modRecipeCache.set(modId, modRecipes);
      const modInfo = allMods.find(m => m.mod_id === modId);
      html += `<tr class="table-group-hd" data-mod-group="${esc(modId)}" data-loaded="1">
        <td colspan="6"><span class="group-toggle"></span>
          <a href="/catalog/mods" class="catalog-link">${esc(modInfo?.name || modId)}</a>
          <span class="td-muted mod-recipe-count" style="font-size:var(--text-xs);margin-left:6px;">${modRecipes.length}</span>
        </td>
      </tr>`;
      html += recipeRows(modRecipes);
    }
    tbody.innerHTML = html;
    initCellClampScroll(tbody);

    const machines = [...new Set(recipes.map(r => r.machine_mod_id + ':' + r.machine_id))];
    for (const key of machines) {
      const [mId, machId] = key.split(':');
      ensureMachineLoaded(mId, machId);
    }
  }

  // Initial load: mod list only
  const modsRes = await apiFetch('/api/mods');
  if (modsRes?.ok) {
    allMods = await modsRes.json();

    if (urlMachine || urlItem || urlFluid) {
      // Filtered mode: any specific-recipe-set filter beyond plain mod-browsing.
      await renderFilteredRecipes();
    } else {
      // Browse mode: no machine/item/fluid — just optionally mod.
      // filter to mods that might have recipes (if urlMod set, only that mod)
      const visibleMods = urlMod ? allMods.filter(m => m.mod_id === urlMod) : allMods;
      renderModGroups(visibleMods);
      countEl.textContent = visibleMods.length + ' mod' + (visibleMods.length !== 1 ? 's' : '');

      // if urlMod is set, auto-expand it
      if (urlMod) {
        const hd = tbody.querySelector(`.table-group-hd[data-mod-group="${CSS.escape(urlMod)}"]`);
        if (hd) { hd.classList.remove('collapsed'); await expandModGroup(hd); }
      }
    }

    new WuiAutocomplete({
      inputEl:   searchEl,
      dropEl:    document.getElementById('recipe-search-ac'),
      primary:   r => r.name,
      secondary: r => r.mod_id,
      fetch(q, offset) {
        let rows = allMods;
        rows = wuiFilter(allMods, q, ['name', 'mod_id']);
        return Promise.resolve({ rows: rows.slice(offset, offset + 50), hasMore: offset + 50 < rows.length });
      },
      onSelect(r) { searchEl.value = r.name; searchEl.dispatchEvent(new Event('input')); },
    });
  }
</script>
</body>
</html>
