<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MC Optimizer — Villager Trades</title>
  <link rel="stylesheet" href="/static/ui/index.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <script>
    (function(){
      const s = localStorage.getItem('theme');
      if (s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark');
    })();
  </script>
  <style>
    .catalog-link { color: var(--text-base); text-decoration: none; border-bottom: 1px solid var(--border); }
    .catalog-link:hover { color: var(--accent); border-color: var(--accent); }
    .group-toggle { cursor: pointer; user-select: none; font-size: .7em; opacity: .5; padding-right: 4px; }
    .group-toggle::before { content: '▾'; }
    .table-group-hd.collapsed .group-toggle::before { content: '▸'; }
    /* Amount sits in its own column, right-aligned against the item it counts. */
    .trade-count-col {
      --trade-count-w: 52px;
      width: var(--trade-count-w); text-align: right; white-space: nowrap;
    }
    /* Second cost item, inline after the first one inside the cost cell. */
    .trade-cost2-sep {
      --trade-cost2-sep-gap: 6px;
      color: var(--text-faint); margin: 0 var(--trade-cost2-sep-gap);
    }
    .trade-cost2-count {
      --trade-cost2-count-gap: 4px;
      font-size: var(--text-sm); margin-right: var(--trade-cost2-count-gap);
    }
    /* Marker on results that are enchanted/named rather than the plain item. */
    .trade-modified {
      --trade-modified-gap: 4px;
      margin-left: var(--trade-modified-gap);
      color: var(--accent);
      font-weight: var(--weight-semibold);
      vertical-align: super;
      font-size: var(--text-xs);
      cursor: help;
    }
    /* A price the data does not fix; the number shown is its floor. */
    .trade-count-variable { cursor: help; }
    /* Which mod defines the offers in this group. */
    .trade-source {
      --trade-source-gap: 8px;
      color: var(--text-faint); font-size: var(--text-xs);
      font-weight: var(--weight-normal); margin-left: var(--trade-source-gap);
    }
</style>
</head>
<body class="app-shell">
  <header class="header">
    <a class="header-brand" href="/saves"><div class="header-logo">⚙️</div><span>MC Optimizer</span></a>
    <div class="header-right">
      <button data-wui-theme data-i18n-title="common.toggle_theme"></button>
      <div class="dropdown-wrap" data-wui-lang><button data-dropdown-trigger></button><div class="dropdown-panel"><button class="dropdown-item" data-lang="en">🇬🇧 English</button><button class="dropdown-item" data-lang="de">🇩🇪 Deutsch</button></div></div>
      <div class="dropdown-wrap" data-wui-user-menu><button class="user-menu-trigger" data-wui-user-trigger data-dropdown-trigger><div class="avatar">?</div><span class="username">…</span><span class="chevron">▾</span></button><div class="dropdown-panel" data-wui-user-dropdown></div></div>
    </div>
  </header>
  <div class="app-body">
    <nav class="sidebar"></nav>
    <main class="main"><div class="page">

      <div class="page-header" data-page-header-area>
        <div class="page-title-row">
          <h1 class="page-title" data-i18n="catalog.trades.title"></h1>
        </div>
      </div>

      <div class="container">
        <div class="container-header">
          <span class="container-title" id="trade-count"></span>
        </div>
        <div class="container-filter">
          <div class="wui-ac-wrap" style="width:220px;">
            <input class="input" id="trade-search" data-i18n-placeholder="catalog.search_placeholder"
              style="width:100%;height:var(--h-btn-sm);" autocomplete="off" />
            <div class="wui-ac-drop" id="trade-search-ac"></div>
          </div>
        </div>
        <div class="container-body-flush">
          <table class="table">
            <thead>
              <tr>
                <th style="width:60px;" data-i18n="catalog.trades.col.tier"></th>
                <th class="trade-count-col" data-i18n="catalog.trades.col.count"></th>
                <th data-i18n="catalog.trades.col.cost"></th>
                <th style="width:24px;"></th>
                <th class="trade-count-col" data-i18n="catalog.trades.col.count"></th>
                <th data-i18n="catalog.trades.col.result"></th>
                <th style="width:80px;" data-i18n="catalog.trades.col.max_uses"></th>
                <th style="width:50px;" data-i18n="catalog.trades.col.xp"></th>
              </tr>
            </thead>
            <tbody id="trade-tbody">
              <tr><td colspan="8" class="td-muted" style="padding:16px;text-align:center;" data-i18n="catalog.empty.loading"></td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div></main>
  </div>
</div>

<script type="module">
  import { guard, apiFetch } from '/static/ui/js/auth.js';
  import { load, applyI18n, getLang, t, esc } from '/static/js/i18n.js';
  import { init as initHeader } from '/static/js/header.js';
  import { initInfocards } from '/static/ui/js/infocard.js';
  import { WuiAutocomplete } from '/static/ui/js/autocomplete.js';
  import { wuiFilter } from '/static/ui/js/filter.js';
  import { loadCatalog, lookupCatalog, iconTextHTML, iconImageHTML } from '/static/js/catalog-registry.js';
  import { VirtualWindow } from '/static/ui/js/virtual-window.js';

  await load(getLang());
  applyI18n();
  guard();
  initHeader();

  const tbody = document.getElementById('trade-tbody');
  const table = tbody.closest('table');
  let groupBodies = []; // sibling <tbody> pairs appended per group
  const countEl = document.getElementById('trade-count');
  const searchEl = document.getElementById('trade-search');

  let allTrades = [];


  // Amount has its own column rather than an inline prefix, so quantities line
  // up down the table instead of shifting with each item name's width. A count
  // of 1 is spelled out too — an empty cell reads as "unknown", not as "one".
  // An offer whose price the data does not fix — an enchanted book costs what
  // the enchantment decides — shows its floor as "11+", never a bare number
  // that reads as the price.
  function countCell(count, variable = false) {
    const n = String(count ?? 1);
    // Native title="" ignores the app's own hover delay/styling/touch handling —
    // this project's infocard is the house rule for hover text (see itemCell's
    // and the "enchanted" marker's own infocard-trigger below).
    const body = variable
      ? `<span class="trade-count-variable infocard-trigger" data-infocard-inline>` +
        `${esc(t('catalog.trades.count_variable').replace('{n}', n))}</span>` +
        `<div class="infocard-def" hidden><div class="infocard-section">${esc(t('catalog.trades.count_variable_title'))}</div></div>`
      : `${esc(n)}×`;
    return `<td class="trade-count-col td-mono td-muted">${body}</td>`;
  }

  // Some offers charge two different items (emerald + compass -> explorer map).
  // The second one rides along inside the cost cell rather than claiming its
  // own pair of columns, which would sit empty for the ~95% of offers that
  // charge a single item.
  function cost2Cell(tr) {
    if (!tr.cost2_item_id) return '';
    return `<span class="trade-cost2-sep">+</span>` +
      `<span class="td-mono td-muted trade-cost2-count">${esc(String(tr.cost2_count ?? 1))}×</span>` +
      itemCell(tr.cost2_mod_id, tr.cost2_item_id, tr.cost2_name);
  }

  function itemCell(modID, itemID, name) {
    const label = esc(name || itemID);
    const recipesUrl = `/catalog/recipes?item=${encodeURIComponent(modID + ':' + itemID)}`;
    return `<span class="infocard-trigger" data-infocard-inline>${iconTextHTML(modID, itemID, { name, size: 'sm' })}</span>
      <div class="infocard-def" hidden>
        <div class="infocard-header">
          ${iconImageHTML(lookupCatalog(modID, itemID), { cls: 'infocard-icon', placeholder: false })}
          <div class="infocard-heading">
            <span class="infocard-title">${label}</span>
            <span class="infocard-subtitle">${esc(modID)}:${esc(itemID)}</span>
          </div>
        </div>
        <div class="infocard-section">
          <a href="${esc(recipesUrl)}" class="catalog-link" data-i18n="catalog.trades.detail.catalog_link"></a>
        </div>
      </div>`;
  }

  const openGroups = new Map(); // groupKey -> VirtualWindow
  const groupRows = new Map();  // groupKey -> trade[]

  function tradeRowEl(tr) {
    const enchanted = tr.result_modified
      ? `<span class="trade-modified infocard-trigger" data-infocard-inline>*</span>` +
        `<div class="infocard-def" hidden><div class="infocard-section">${esc(t('catalog.trades.enchanted'))}</div></div>`
      : '';
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${tr.tier}</td>
      ${countCell(tr.cost_count, tr.cost_variable)}
      <td>${itemCell(tr.cost_mod_id, tr.cost_item_id, tr.cost_name)}${cost2Cell(tr)}</td>
      <td class="td-muted" style="text-align:center;">→</td>
      ${countCell(tr.result_count)}
      <td>${itemCell(tr.result_mod_id, tr.result_item_id, tr.result_name)}${enchanted}</td>
      <td class="td-muted" style="text-align:right;">${tr.max_uses ?? '—'}</td>
      <td class="td-muted" style="text-align:right;">${tr.xp ?? '—'}</td>`;
    applyI18n(row);
    initInfocards(row);
    return [row];
  }

  function skeletonRowEl() {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td><span class="skeleton-bar" style="width:20px;"></span></td>
      <td><span class="skeleton-bar" style="width:80%;"></span></td>
      <td><span class="skeleton-bar" style="width:70%;"></span></td>
      <td></td>
      <td><span class="skeleton-bar" style="width:80%;"></span></td>
      <td><span class="skeleton-bar" style="width:70%;"></span></td>
      <td><span class="skeleton-bar" style="width:40%;"></span></td>
      <td><span class="skeleton-bar" style="width:40%;"></span></td>`;
    return [row];
  }

  function toggleGroup(key, hdRow, rowsBody) {
    const collapsed = hdRow.classList.toggle('collapsed');
    if (collapsed) {
      openGroups.get(key)?.destroy();
      openGroups.delete(key);
      return;
    }
    const trades = groupRows.get(key) || [];
    const vw = new VirtualWindow({
      container: rowsBody,
      scrollMode: 'ancestor',
      scrollEl: document.querySelector('.main'),
      fetch: async (offset) => ({
        rows: trades.slice(offset, offset + 50),
        hasMore: offset + 50 < trades.length,
      }),
      renderRow: tradeRowEl,
      renderSkeletonRow: skeletonRowEl,
    });
    openGroups.set(key, vw);
    vw.start();
  }

  function renderTrades() {
    const q = searchEl.value.trim().toLowerCase();
    let trades = allTrades;
    if (q) trades = trades.filter(tr => wuiFilter(tr, q, ['profession', 'source_name', 'source_mod_id', 'cost_name', 'cost_item_id', 'cost2_name', 'cost2_item_id', 'result_name', 'result_item_id', 'tier']));

    countEl.textContent = trades.length + ' trade' + (trades.length !== 1 ? 's' : '');

    for (const vw of openGroups.values()) vw.destroy();
    openGroups.clear();
    groupRows.clear();
    groupBodies.forEach(b => b.remove());
    groupBodies = [];

    if (!trades.length) {
      tbody.innerHTML = `<tr><td colspan="8" class="td-muted" style="padding:16px;text-align:center;">${t('catalog.empty.no_trades')}</td></tr>`;
      return;
    }

    const groupOf = tr => tr.source_mod_id + ' ' + tr.profession;
    const byGroup = new Map();
    for (const tr of trades) {
      const key = groupOf(tr);
      if (!byGroup.has(key)) byGroup.set(key, []);
      byGroup.get(key).push(tr);
    }

    tbody.innerHTML = '';
    for (const [key, groupTrades] of byGroup) {
      groupRows.set(key, groupTrades);
      const first = groupTrades[0];
      const villager = first.profession.split(':').pop();

      const hdBody = document.createElement('tbody');
      const hdRow = document.createElement('tr');
      hdRow.className = 'table-group-hd collapsed';
      hdRow.innerHTML = `<td colspan="8"><span class="group-toggle"></span>${esc(villager)}` +
        `<span class="trade-source">${esc(first.source_name || first.source_mod_id)}</span>` +
        `<span class="td-muted" style="font-size:var(--text-xs);margin-left:6px;">${groupTrades.length}</span></td>`;
      hdBody.appendChild(hdRow);

      const rowsBody = document.createElement('tbody');
      hdRow.addEventListener('click', () => toggleGroup(key, hdRow, rowsBody));

      table.appendChild(hdBody);
      table.appendChild(rowsBody);
      groupBodies.push(hdBody, rowsBody);
    }
  }

  searchEl.addEventListener('input', renderTrades);

  const [res] = await Promise.all([
    apiFetch('/api/trades'),
    loadCatalog(),
  ]);
  if (res?.ok) {
    allTrades = await res.json();
    renderTrades();
    new WuiAutocomplete({
      inputEl:   searchEl,
      dropEl:    document.getElementById('trade-search-ac'),
      primary:   r => r.result_name || r.result_item_id,
      secondary: r => r.profession,
      fetch(q, offset) {
        let rows = allTrades;
        rows = wuiFilter(allTrades, q, ['profession', 'source_name', 'source_mod_id', 'cost_name', 'cost_item_id', 'cost2_name', 'cost2_item_id', 'result_name', 'result_item_id', 'tier']);
        return Promise.resolve({ rows: rows.slice(offset, offset + 50), hasMore: offset + 50 < rows.length });
      },
      onSelect(r) { searchEl.value = r.result_name || r.result_item_id; searchEl.dispatchEvent(new Event('input')); },
    });
  }
</script>
</body>
</html>
