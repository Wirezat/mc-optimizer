<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MC Optimizer — Production Line</title>
  <link rel="stylesheet" href="/static/ui/index.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <script>
    (function(){
      const s = localStorage.getItem('theme');
      if (s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark');
    })();
  </script>
  <style>
    /* ── Stat row (meta) ─────────────────────────────────────────────────── */
    .stat-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--gap-card);
      margin-bottom: var(--gap-field);
    }
    .stat { display: flex; flex-direction: column; gap: 2px; min-width: 100px; }
    .stat-label {
      font-size: var(--text-xs);
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .stat-value {
      font-size: var(--text-base);
      font-weight: var(--weight-semibold);
      color: var(--text);
      font-family: var(--font-mono);
    }

    /* ── Progress bar ────────────────────────────────────────────────────── */
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: var(--gap-control);
      margin-bottom: var(--gap-field);
    }
    .progress-track {
      flex: 1;
      height: 6px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      transition: width .3s;
    }
    .progress-fill.full { background: var(--success); }
    .progress-label {
      font-size: var(--text-xs);
      color: var(--text-muted);
      white-space: nowrap;
      font-family: var(--font-mono);
    }

    /* ── Machine group table ─────────────────────────────────────────────── */
    #mg-table { table-layout: fixed; width: 100%; }
    #mg-table .col-count   { width: 44px; }
    #mg-table .col-actions { width: 60px; }
    #mg-table td, #mg-table th { padding: var(--gap-item) var(--gap-card); }
    #mg-table td { overflow: hidden; }

    /* ── MG bi-state toggle ──────────────────────────────────────────────── */
    .mg-tog {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: var(--h-btn-sm);
      border-radius: var(--radius);
      border: 1px solid transparent;
      font-size: 14px;
      cursor: pointer;
      transition: background .12s, border-color .12s;
    }
    .mg-tog .tog-cur { display: inline; }
    .mg-tog .tog-nxt { display: none; font-size: 10px; letter-spacing: -.5px; }
    .mg-tog:hover .tog-cur { display: none; }
    .mg-tog:hover .tog-nxt { display: inline; }
    .mg-tog.planned { --_icon-color: var(--warn); }
    .mg-tog.built   { --_icon-color: var(--success); }

    /* ── IO list ─────────────────────────────────────────────────────────── */
    .io-section-label {
      font-size: var(--text-xs);
      font-weight: var(--weight-bold);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-faint);
      margin: var(--gap-field) 0 var(--gap-inline);
    }
    .io-section-label:first-child { margin-top: 0; }
    .io-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--gap-control);
      padding: var(--gap-icon) 0;
      border-bottom: 1px solid var(--border);
    }
    .io-row:last-child { border-bottom: none; }
    .io-item {
      color: var(--text);
      font-size: var(--text-sm);
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .io-item-primary { color: var(--accent); font-weight: var(--weight-semibold); }
    .io-rate {
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      white-space: nowrap;
      opacity: 0;
      transition: opacity .12s;
    }
    .io-row:hover .io-rate { opacity: 1; }
  </style>
</head>
<body class="app-shell">

  <!-- ── Header ── -->
  <header class="header">
    <a class="header-brand" href="/saves">
      <div class="header-logo">⚙️</div>
      <span>MC Optimizer</span>
    </a>
    <div class="header-right">
      <button data-wui-theme data-i18n-title="common.toggle_theme"></button>
      <div class="dropdown-wrap" data-wui-lang>
        <button data-dropdown-trigger></button>
        <div class="dropdown-panel">
          <button class="dropdown-item" data-lang="en">🇬🇧 English</button>
          <button class="dropdown-item" data-lang="de">🇩🇪 Deutsch</button>
        </div>
      </div>
      <div class="dropdown-wrap" data-wui-user-menu>
        <button class="user-menu-trigger" data-wui-user-trigger data-dropdown-trigger>
          <div class="avatar">?</div>
          <span class="username">…</span>
          <span class="chevron">▾</span>
        </button>
        <div class="dropdown-panel" data-wui-user-dropdown></div>
      </div>
    </div>
  </header>

  <div class="app-body">
    <nav class="sidebar"></nav>

    <main class="main">
      <div class="page">

        <!-- ── Page header ── -->
        <div class="page-header">
          <div>
            <div class="breadcrumb">
              <a href="/saves" data-i18n="nav.saves"></a>
              <span class="breadcrumb-sep">▸</span>
              <a id="bc-save" href="#"></a>
              <span class="breadcrumb-sep">▸</span>
              <a id="bc-factory" href="#"></a>
              <span class="breadcrumb-sep">▸</span>
              <span class="breadcrumb-current" id="bc-pl">…</span>
            </div>
            <div class="page-title" id="page-title">…</div>
          </div>
          <span class="pill" id="pl-status-pill"></span>
        </div>

        <!-- ── Split layout ── -->
        <div class="split-layout">

          <!-- ── main-panel: Meta + Machine Groups ── -->
          <div class="main-panel" style="display:flex;flex-direction:column;gap:var(--gap-container);">

            <!-- Meta + actions -->
            <div class="container">
              <div class="container-body">
                <div class="stat-row" id="pl-meta"></div>
                <div class="progress-wrap" id="progress-wrap" style="display:none;">
                  <div class="progress-track">
                    <div class="progress-fill" id="progress-fill"></div>
                  </div>
                  <span class="progress-label" id="progress-label"></span>
                </div>
                <div style="display:flex;gap:var(--gap-control);flex-wrap:wrap;" id="action-bar"></div>
              </div>
            </div>

            <!-- Machine Groups -->
            <div class="container">
              <div class="container-header">
                <span class="container-title" data-i18n="production_line.machine_groups"></span>
              </div>
              <div class="container-body-flush">
                <table class="table" id="mg-table">
                  <colgroup>
                    <col class="col-count" />
                    <col />
                    <col class="col-actions" />
                  </colgroup>
                  <tbody id="mg-tbody">
                    <tr><td colspan="3" style="text-align:center;color:var(--text-faint);" data-i18n="common.loading"></td></tr>
                  </tbody>
                </table>
              </div>
            </div>

          </div><!-- /.main-panel -->

          <!-- ── side-panel: IO Profile ── -->
          <div class="side-panel">
            <div class="container">
              <div class="container-header">
                <span class="container-title" data-i18n="production_line.io_profile"></span>
              </div>
              <div class="container-body" id="io-list">
                <span class="td-faint" data-i18n="common.loading"></span>
              </div>
            </div>
          </div>

        </div><!-- /.split-layout -->

      </div><!-- /.page -->
    </main>
  </div>

<script type="module">
  import { guard, apiFetch } from '/static/ui/js/auth.js';
  import { load, applyI18n, getLang, t, esc } from '/static/js/i18n.js';
  import { machine as machineName, loadMI , esc } from '/static/js/i18n.js';
  import { init as initHeader } from '/static/js/header.js';

  const _lang = getLang();
  await load(_lang);
  await loadMI(_lang);
  applyI18n();
  guard();
  initHeader();

  const _plID = window.location.pathname.split('/')[2];
  let _pl = null;
  let _tiers = [];

  async function init() {
    const tRes = await apiFetch('/api/upgrade-tiers');
    if (tRes?.ok) _tiers = await tRes.json();

    const res = await apiFetch('/api/production-lines/' + _plID);
    if (!res?.ok) { window.location.href = '/saves'; return; }
    _pl = await res.json();

    document.title = 'MC Optimizer — ' + _pl.name;
    document.getElementById('page-title').textContent = _pl.name;
    document.getElementById('bc-pl').textContent      = _pl.name;

    if (_pl.factory_id) {
      const fRes = await apiFetch('/api/factories/' + _pl.factory_id);
      if (fRes?.ok) {
        const { factory } = await fRes.json();
        document.getElementById('bc-factory').textContent = factory.name;
        document.getElementById('bc-factory').href        = '/factories/' + _pl.factory_id;
        const sRes = await apiFetch('/api/saves/' + factory.save_id);
        if (sRes?.ok) {
          const save = await sRes.json();
          document.getElementById('bc-save').textContent = save.name;
          document.getElementById('bc-save').href        = '/saves/' + factory.save_id;
        }
      }
    }

    render();
  }

  function render() {
    renderStatusPill();
    renderMeta();
    renderProgress();
    renderActionBar();
    renderMachineGroups();
    renderIO();
  }

  function renderStatusPill() {
    const pill = document.getElementById('pl-status-pill');
    const cls  = { active: 'pill-active', draft: 'pill-draft', archived: 'pill-archived' };
    pill.className   = 'pill ' + (cls[_pl.status] || '');
    pill.textContent = t('status.' + _pl.status) || _pl.status;
  }

  function renderMeta() {
    const rate       = fmtFrac(_pl.rate_num, _pl.rate_den) + ' /' + _pl.time_unit;
    const targetName = _pl.target_item_name || (_pl.target_item_id.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()));
    document.getElementById('pl-meta').innerHTML = `
      <div class="stat">
        <span class="stat-label">${esc(t('production_line.meta.target'))}</span>
        <span class="stat-value">${esc(targetName)}</span>
        <span class="td-faint">${esc(_pl.target_mod_id)}</span>
      </div>
      <div class="stat">
        <span class="stat-label">${esc(t('common.rate'))}</span>
        <span class="stat-value">${esc(rate)}</span>
      </div>
      <div class="stat">
        <span class="stat-label">${esc(t('production_line.meta.mode'))}</span>
        <span class="stat-value">${esc(_pl.optimize_mode.toUpperCase())}</span>
      </div>
    `;
  }

  function renderProgress() {
    const mgs     = _pl.machine_groups || [];
    const total   = mgs.length;
    const built   = mgs.filter(g => g.status === 'built').length;
    const allBuilt = total > 0 && built === total;
    const pw      = document.getElementById('progress-wrap');

    if (_pl.status === 'active' && total > 0) {
      pw.style.display = '';
      const fill = document.getElementById('progress-fill');
      fill.style.width = Math.round(built / total * 100) + '%';
      fill.classList.toggle('full', allBuilt);
      document.getElementById('progress-label').textContent = `${built} / ${total} built`;
    } else {
      pw.style.display = 'none';
    }
  }

  function renderActionBar() {
    const bar  = document.getElementById('action-bar');
    const mgs  = _pl.machine_groups || [];
    const allBuilt = mgs.length > 0 && mgs.every(g => g.status === 'built');

    if (_pl.status !== 'active') { bar.innerHTML = ''; return; }

    const curRate = _pl.rate_den ? (_pl.rate_num / _pl.rate_den) : _pl.rate_num;
    const tierOpts = _tiers.map(tr => `<option value="${esc(tr.id)}">${esc(tr.name)}</option>`).join('');
    bar.innerHTML = `
      ${!allBuilt ? `<button class="btn btn-primary btn-sm" data-action="markAllBuilt">${esc(t('production_line.mark_all_built'))}</button>` : ''}
      <button class="btn btn-sm" data-action="resolveToggle">${esc(t('production_line.more_output'))}</button>
      <button class="btn btn-ghost btn-sm" data-action="archivePL">${esc(t('production_line.archive'))}</button>
      <div id="resolve-panel" style="display:none;width:100%;margin-top:var(--gap-item);padding:var(--gap-card);background:var(--surface-sunken,transparent);border:1px solid var(--border);border-radius:var(--radius);">
        <div style="display:flex;gap:var(--gap-inline);align-items:end;flex-wrap:wrap;">
          <label class="field-label" style="display:flex;flex-direction:column;gap:2px;">${esc(t('solve.field.rate'))}
            <input class="input" id="resolve-rate" type="number" min="0.001" step="any" value="${curRate}" style="width:6rem;" />
          </label>
          <label class="field-label" style="display:flex;flex-direction:column;gap:2px;">&nbsp;
            <select class="input" id="resolve-unit">
              <option value="s"${_pl.time_unit==='s'?' selected':''}>${esc(t('common.per_sec'))}</option>
              <option value="min"${_pl.time_unit==='min'?' selected':''}>${esc(t('common.per_min'))}</option>
              <option value="h"${_pl.time_unit==='h'?' selected':''}>${esc(t('common.per_hour'))}</option>
              <option value="t"${_pl.time_unit==='t'?' selected':''}>${esc(t('common.per_tick'))}</option>
            </select>
          </label>
          <label class="field-label" style="display:flex;flex-direction:column;gap:2px;">${esc(t('solve.upgrade.label'))}
            <select class="input" id="resolve-upg-mode">
              <option value="">${esc(t('solve.upgrade.off'))}</option>
              <option value="auto">${esc(t('solve.upgrade.auto'))}</option>
              <option value="fixed">${esc(t('solve.upgrade.fixed'))}</option>
            </select>
          </label>
          <select class="input" id="resolve-upg-tier" style="display:none;">${tierOpts}</select>
          <input class="input" id="resolve-upg-count" type="number" min="0" max="64" step="1" value="0" style="width:4rem;display:none;" />
          <button class="btn btn-primary btn-sm" data-action="resolveApply">${esc(t('production_line.more_output_apply'))}</button>
        </div>
      </div>
    `;
    bar.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.action === 'markAllBuilt') markAllBuilt();
        if (btn.dataset.action === 'archivePL')    archivePL();
        if (btn.dataset.action === 'resolveToggle') {
          const p = document.getElementById('resolve-panel');
          p.style.display = p.style.display === 'none' ? 'block' : 'none';
        }
        if (btn.dataset.action === 'resolveApply') resolveApply();
      });
    });
    const upgMode = document.getElementById('resolve-upg-mode');
    if (upgMode) upgMode.addEventListener('change', () => {
      const fixed = upgMode.value === 'fixed';
      document.getElementById('resolve-upg-tier').style.display  = fixed ? 'inline-block' : 'none';
      document.getElementById('resolve-upg-count').style.display = fixed ? 'inline-block' : 'none';
    });
  }

  async function resolveApply() {
    const rate = parseFloat(document.getElementById('resolve-rate').value);
    if (!rate || rate <= 0) return;
    const [num, den] = toFraction(rate);
    const mode = document.getElementById('resolve-upg-mode').value;
    const body = {
      target_rate: { Num: num, Den: den },
      time_unit:   document.getElementById('resolve-unit').value,
      upgrade_mode: mode,
      upgrade_tier:  mode === 'fixed' ? (document.getElementById('resolve-upg-tier').value || '') : '',
      upgrade_count: mode === 'fixed' ? (parseInt(document.getElementById('resolve-upg-count').value, 10) || 0) : 0,
    };
    const res = await apiFetch('/api/production-lines/' + _plID + '/resolve', {
      method: 'POST', body: JSON.stringify(body),
    });
    if (res?.ok) reload();
  }

  function renderMachineGroups() {
    const mgs      = _pl.machine_groups || [];
    const canToggle = _pl.status === 'active';
    const tbody    = document.getElementById('mg-tbody');

    if (!mgs.length) {
      tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;color:var(--text-faint);padding:var(--pad-container);">—</td></tr>`;
      return;
    }

    tbody.innerHTML = mgs.map(g => {
      const name    = machineName(g.machine_mod_id, g.machine_id);
      const isBuilt = g.status === 'built';
      const togBtn  = canToggle
        ? `<button class="mg-tog btn-icon-color ${isBuilt ? 'built' : 'planned'}"
             data-mgid="${esc(g.id)}" data-mgstatus="${esc(g.status)}"
             title="${esc(isBuilt ? t('status.planned') : t('status.built'))}">
             <span class="tog-cur">${isBuilt ? '✓' : '⚒'}</span>
             <span class="tog-nxt">${isBuilt ? '✓→⚒' : '⚒→✓'}</span>
           </button>`
        : `<span style="font-size:14px;color:${isBuilt ? 'var(--success)' : 'var(--warn)'};">${isBuilt ? '✓' : '⚒'}</span>`;
      return `<tr>
        <td class="col-count td-mono td-muted" style="text-align:right;">${g.count}×</td>
        <td>
          <div style="font-weight:var(--weight-medium);font-size:var(--text-sm);">${esc(name)}</div>
          <div class="td-faint">${esc(g.machine_mod_id)}</div>
          ${canToggle ? upgradeEditor(g) : upgradeLabel(g)}
        </td>
        <td class="col-actions td-actions">${togBtn}</td>
      </tr>`;
    }).join('');

    tbody.querySelectorAll('[data-mgid]').forEach(btn => {
      btn.addEventListener('click', () => toggleMGStatus(btn.dataset.mgid, btn.dataset.mgstatus));
    });
    tbody.querySelectorAll('[data-upg-save]').forEach(btn => {
      btn.addEventListener('click', () => saveMGUpgrade(btn.dataset.upgSave));
    });
  }

  function tierName(id) {
    return id ? (_tiers.find(t2 => t2.id === id)?.name || id) : '';
  }

  // Read-only upgrade label for non-editable PLs.
  function upgradeLabel(g) {
    if (!g.upgrade_tier_id || !g.upgrade_count) return '';
    return `<div class="td-faint" style="font-size:var(--text-xs);">⚙ ${esc(tierName(g.upgrade_tier_id))} ×${g.upgrade_count}</div>`;
  }

  // Inline upgrade editor: tier picker + slot count + apply (variant A: reduce machines).
  function upgradeEditor(g) {
    if (!_tiers.length) return '';
    const opts = `<option value="">${esc(t('solve.upgrade.off'))}</option>` +
      _tiers.map(tr => `<option value="${esc(tr.id)}"${tr.id === g.upgrade_tier_id ? ' selected' : ''}>${esc(tr.name)}</option>`).join('');
    return `<div style="display:flex;gap:var(--gap-inline);align-items:center;margin-top:var(--gap-item);flex-wrap:wrap;">
      <span class="td-faint" style="font-size:var(--text-xs);">⚙</span>
      <select class="input" id="upg-tier-${esc(g.id)}" style="font-size:var(--text-xs);padding:2px 4px;">${opts}</select>
      <input class="input" id="upg-count-${esc(g.id)}" type="number" min="0" max="64" step="1" value="${g.upgrade_count || 0}" style="width:4rem;font-size:var(--text-xs);padding:2px 4px;" />
      <button class="btn" data-upg-save="${esc(g.id)}" style="font-size:var(--text-xs);padding:2px 8px;">${esc(t('production_line.upgrade_apply'))}</button>
    </div>`;
  }

  async function saveMGUpgrade(id) {
    const tierID = document.getElementById('upg-tier-' + id).value || null;
    const count  = parseInt(document.getElementById('upg-count-' + id).value, 10) || 0;
    const res = await apiFetch('/api/machine-groups/' + id + '/upgrades', {
      method: 'PATCH',
      body: JSON.stringify({ upgrade_tier_id: tierID, upgrade_count: count }),
    });
    if (res?.ok) reload();
  }

  function renderIO() {
    const ioEl   = document.getElementById('io-list');
    const all    = _pl.io || [];
    const inputs  = all.filter(e => e.direction === 'input');
    const outputs = all.filter(e => e.direction === 'output');

    let html = '';
    if (inputs.length) {
      html += `<div class="io-section-label">${esc(t('solve.inputs'))}</div>`;
      html += inputs.map(e => ioRow(e, false)).join('');
    }
    if (outputs.length) {
      html += `<div class="io-section-label">${esc(t('solve.outputs'))}</div>`;
      html += outputs.map((e, i) => ioRow(e, i === 0)).join('');
    }
    ioEl.innerHTML = html || `<span class="td-faint">—</span>`;
  }

  function ioRow(e, isPrimary) {
    const rate      = fmtFrac(e.rate_num, e.rate_den) + ' /' + (_pl.time_unit || 't');
    const displayName = e.name || e.item_fluid_id.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
    return `<div class="io-row">
      <span class="io-item${isPrimary ? ' io-item-primary' : ''}">${isPrimary ? '★ ' : ''}${esc(displayName)}<span class="td-faint" style="margin-left:4px;">${esc(e.mod_id)}</span></span>
      <span class="io-rate">${esc(rate)}</span>
    </div>`;
  }

  // ── Actions ───────────────────────────────────────────────────────────────
  async function markAllBuilt() {
    const res = await apiFetch('/api/production-lines/' + _plID + '/mark-built', { method: 'PATCH', body: '{}' });
    if (res?.ok || res?.status === 200) reload();
  }

  async function archivePL() {
    if (!confirm(t('production_line.confirm_archive'))) return;
    const res = await apiFetch('/api/production-lines/' + _plID + '/status', {
      method: 'PATCH', body: JSON.stringify({ status: 'archived' }),
    });
    if (res?.ok || res?.status === 204) reload();
  }

  async function toggleMGStatus(id, currentStatus) {
    const next = currentStatus === 'planned' ? 'built' : 'planned';
    const res  = await apiFetch('/api/machine-groups/' + id + '/status', {
      method: 'PATCH', body: JSON.stringify({ status: next }),
    });
    if (res?.ok || res?.status === 204) reload();
  }

  async function reload() {
    const res = await apiFetch('/api/production-lines/' + _plID);
    if (!res?.ok) return;
    _pl = await res.json();
    render();
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function fmtFrac(num, den) {
    if (!den || den === 1) return String(num);
    const v = num / den;
    return Number.isInteger(v) ? String(v) : v.toFixed(4).replace(/\.?0+$/, '');
  }

  function gcd(a, b) { return b ? gcd(b, a % b) : a; }
  function toFraction(dec) {
    const d = 10000, n = Math.round(dec * d), g = gcd(n, d) || 1;
    return [n / g, d / g];
  }


  init();
</script>
</body>
</html>
