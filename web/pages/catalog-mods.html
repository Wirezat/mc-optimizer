<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MC Optimizer — Mods</title>
  <link rel="stylesheet" href="/static/ui/index.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <link rel="stylesheet" href="/static/css/catalog-common.css" />
  <script>
    (function(){
      const s = localStorage.getItem('theme');
      if (s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark');
    })();
  </script>
  <style>
    /* expand detail */
    .mod-detail-layout {
      display: grid; grid-template-columns: 1fr auto; gap: var(--gap-container);
      margin-bottom: var(--gap-container);
    }
    .mod-description { font-size: var(--text-sm); color: var(--text); margin: 0 0 var(--gap-inline); line-height: 1.5; }
    .mod-description.field-editable { white-space: pre-wrap; word-break: break-word; }
    .mod-ext-links   { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .mod-catalog-badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .mod-catalog-badges a { text-decoration: none; }
    .table-expand-trigger.open { display: inline-block; transform: rotate(90deg); }

    /* link icons */
    .link-icon { display: inline-block; font-size: .7em; opacity: .65; margin-right: 3px; letter-spacing: 0; font-style: normal; }
    .link-icon-add { opacity: .35; }

    /* link editing */
    .mod-link-empty .mod-link-add { opacity: .5; border-style: dashed; }
    .mod-link-empty .mod-link-add:hover { opacity: 1; }
    .mod-link-input { font-size: var(--text-sm); min-width: 260px; max-width: 100%; height: var(--h-btn-sm); }

    /* modrinth fetch row */
    .mod-fetch-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
    .mod-fetch-status { font-size: var(--text-xs); color: var(--text-faint); }
  </style>
</head>
<body class="app-shell">

  <!-- ── Header ── -->
  <header class="header">
    <a class="header-brand" href="/saves">
      <div class="header-logo">⚙️</div>
      <span>MC Optimizer</span>
    </a>
    <div class="header-right">
      <button data-wui-theme data-i18n-title="common.toggle_theme"></button>
      <div class="dropdown-wrap" data-wui-lang>
        <button data-dropdown-trigger></button>
        <div class="dropdown-panel">
          <button class="dropdown-item" data-lang="en">🇬🇧 English</button>
          <button class="dropdown-item" data-lang="de">🇩🇪 Deutsch</button>
        </div>
      </div>
      <div class="dropdown-wrap" data-wui-user-menu>
        <button class="user-menu-trigger" data-wui-user-trigger data-dropdown-trigger>
          <div class="avatar">?</div>
          <span class="username">…</span>
          <span class="chevron">▾</span>
        </button>
        <div class="dropdown-panel" data-wui-user-dropdown></div>
      </div>
    </div>
  </header>

  <div class="app-body">
    <nav class="sidebar"></nav>
    <main class="main"><div class="page">

      <div class="page-header" data-page-header-area>
        <div class="page-title-row">
          <h1 class="page-title" data-i18n="catalog.mods.title"></h1>
        </div>
      </div>

      <div class="container">
        <div class="container-header">
          <span class="container-title" id="mod-count"></span>
        </div>
        <div class="container-filter">
          <div class="wui-ac-wrap" style="width:220px;">
            <input class="input" id="mod-search" data-i18n-placeholder="catalog.search_placeholder"
              style="width:100%;height:var(--h-btn-sm);" autocomplete="off" />
            <div class="wui-ac-drop" id="mod-search-ac"></div>
          </div>
        </div>
        <div class="container-body-flush">
          <table class="table" id="mod-table">
            <thead>
              <tr>
                <th style="width:24px;"></th>
                <th style="width:100%;" data-i18n="catalog.mods.col.name"></th>
                <th data-i18n="catalog.mods.col.mod_id"></th>
                <th data-i18n="catalog.mods.col.recipes"></th>
              </tr>
            </thead>
            <tbody id="mod-tbody">
              <tr><td colspan="4" class="td-muted" style="padding:16px;text-align:center;" data-i18n="catalog.empty.loading"></td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div></main>
  </div>

<script type="module">
  import { guard, apiFetch, isAdmin, getUser } from '/static/ui/js/auth.js';
  import { load, applyI18n, getLang, t, esc, tCount } from '/static/js/i18n.js';
  import { init as initHeader } from '/static/js/header.js';
  import { initClickToEdit } from '/static/ui/js/table-features.js';
  import { initInlineEdit } from '/static/ui/js/inline-edit.js';
  import { WuiAutocomplete } from '/static/ui/js/autocomplete.js';
  import { wuiFilter } from '/static/ui/js/filter.js';

  await load(getLang());
  applyI18n();
  guard();
  initHeader();
  await getUser();

  const tbody    = document.getElementById('mod-tbody');
  const countEl  = document.getElementById('mod-count');
  const searchEl = document.getElementById('mod-search');
  const admin    = isAdmin();

  let allMods = [];


  // ── Save helper ──────────────────────────────────────────────────────────
  async function saveMod(mod) {
    const body = {
      name:          mod.name,
      description:   mod.description   ?? null,
      author:        mod.author        ?? null,
      license:       mod.license       ?? null,
      url_source:    mod.url_source    ?? null,
      url_modrinth:  mod.url_modrinth  ?? null,
      url_wiki:      mod.url_wiki      ?? null,
      url_issues:    mod.url_issues    ?? null,
      url_discord:   mod.url_discord   ?? null,
      modrinth_slug: mod.modrinth_slug ?? null,
    };
    const res = await apiFetch('/api/mods/' + encodeURIComponent(mod.mod_id), {
      method:  'PUT',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(body),
    });
    return res?.ok ?? false;
  }

  // ── Render ───────────────────────────────────────────────────────────────
  function renderMods() {
    const q = searchEl.value.trim().toLowerCase();
    const mods = q
      ? allMods.filter(m => wuiFilter(m, q, ['mod_id', 'name', 'modrinth_slug']))
      : allMods;

    countEl.textContent = tCount(mods.length, 'catalog.mods.count');

    if (!mods.length) {
      tbody.innerHTML = `<tr><td colspan="4" class="td-muted" style="padding:16px;text-align:center;">${t('catalog.empty.no_mods')}</td></tr>`;
      return;
    }

    tbody.innerHTML = mods.map(m => {
      const recipesUrl = `/catalog/items?producedByMod=${encodeURIComponent(m.mod_id)}`;
      return `
      <tr data-mod-id="${esc(m.mod_id)}">
        <td><span class="table-expand-trigger" data-expand="mod-${esc(m.mod_id)}">▸</span></td>
        <td>${admin ? `
          <div class="td-editable" data-wui-field="name">
            <span class="td-val">${esc(m.name)}</span>
            <input class="td-input" type="text" value="${esc(m.name)}" />
          </div>` : esc(m.name)}</td>
        <td class="td-mono td-muted">${esc(m.mod_id)}</td>
        <td>${m.recipe_count
          ? `<a href="${esc(recipesUrl)}" class="recipe-count-link metric">${m.recipe_count}</a>`
          : `<span class="td-muted">—</span>`}</td>
      </tr>
      <tr class="table-expand-row" id="mod-${esc(m.mod_id)}">
        <td colspan="4"><div class="table-expand-body" id="mod-body-${esc(m.mod_id)}">
          <span class="td-muted" style="font-size:var(--text-sm);">${t('catalog.empty.loading')}</span>
        </div></td>
      </tr>`;
    }).join('');

    if (admin) initClickToEdit(tbody);
  }

  const LINK_DEFS = [
    { field: 'url_source',   key: 'catalog.mods.detail.source',   icon: '&#60;/&#62;' },
    { field: 'url_modrinth', key: 'catalog.mods.detail.modrinth', icon: '&#9672;'      },
    { field: 'url_wiki',     key: 'catalog.mods.detail.wiki',     icon: '&#9670;'      },
    { field: 'url_discord',  key: 'catalog.mods.detail.discord',  icon: '#'            },
    { field: 'url_issues',   key: 'catalog.mods.detail.issues',   icon: '!'            },
  ];

  function modBodyHTML(m) {
    // Description — inline-editable for admin
    const descPlaceholder = esc(t('catalog.mods.detail.no_description'));
    const desc = admin
      ? `<div class="mod-description field-editable"
           data-field="description" data-mod-id="${esc(m.mod_id)}"
           data-placeholder="${descPlaceholder}">${esc(m.description ?? '')}</div>`
      : (m.description
          ? `<p class="mod-description">${esc(m.description)}</p>`
          : `<p class="mod-description" style="color:var(--text-faint);">${descPlaceholder}</p>`);

    // Links with icons — admin gets click-to-edit + "+" for missing links
    const linkParts = LINK_DEFS.map(def => {
      const url = m[def.field];
      const label = t(def.key);
      if (url) {
        return `<span class="mod-link-wrap" data-field="${esc(def.field)}" data-mod-id="${esc(m.mod_id)}">
          <a href="${esc(url)}" class="btn btn-sm btn-ghost mod-link-anchor" target="_blank" rel="noopener">
            <i class="link-icon" aria-hidden="true">${def.icon}</i>${label} ↗
          </a></span>`;
      } else if (admin) {
        return `<span class="mod-link-wrap mod-link-empty" data-field="${esc(def.field)}" data-mod-id="${esc(m.mod_id)}">
          <button class="btn btn-sm btn-ghost mod-link-add">
            <i class="link-icon link-icon-add" aria-hidden="true">+</i>${label}
          </button></span>`;
      }
      return '';
    }).filter(Boolean);

    const linksHTML = linkParts.length
      ? `<div class="mod-ext-links">${linkParts.join('')}</div>`
      : '';

    // Modrinth fetch row (admin only)
    const fetchHTML = admin ? `
      <div class="mod-fetch-row">
        <input class="input mod-fetch-input" type="text"
          style="flex:1;height:var(--h-btn-sm);"
          data-i18n-placeholder="catalog.mods.edit.fetch_slug_placeholder" />
        <button class="btn btn-sm btn-secondary mod-fetch-btn" data-mod-id="${esc(m.mod_id)}"
          data-i18n="catalog.mods.edit.fetch_btn"></button>
        <span class="mod-fetch-status" id="fetch-status-${esc(m.mod_id)}"></span>
      </div>` : '';

    // Meta grid — author/license inline-editable for admin
    const authorHTML = (m.author || admin)
      ? `<div class="detail-row"><span class="detail-key">${t('catalog.mods.detail.author')}</span><span class="detail-val">` +
        (admin
          ? `<span class="field-editable" data-inline data-field="author"
               data-mod-id="${esc(m.mod_id)}" data-placeholder="—">${esc(m.author ?? '')}</span>`
          : esc(m.author)) +
        `</span></div>`
      : '';
    const licenseHTML = (m.license || admin)
      ? `<div class="detail-row"><span class="detail-key">${t('catalog.mods.detail.license')}</span><span class="detail-val">` +
        (admin
          ? `<span class="field-editable" data-inline data-field="license"
               data-mod-id="${esc(m.mod_id)}" data-placeholder="—">${esc(m.license ?? '')}</span>`
          : esc(m.license)) +
        `</span></div>`
      : '';
    const metaRows = [authorHTML, licenseHTML].filter(Boolean).join('');

    return `
      <div class="mod-detail-layout">
        <div>
          ${desc}
          ${linksHTML}
          ${fetchHTML}
        </div>
        <div class="detail-grid">${metaRows}</div>
      </div>
      <div class="mod-catalog-badges">
        <a href="/catalog/items?mod=${encodeURIComponent(m.mod_id)}" class="badge badge-neutral"
           data-count-key="items-${esc(m.mod_id)}">… Items →</a>
        <a href="/catalog/fluids?mod=${encodeURIComponent(m.mod_id)}" class="badge badge-neutral"
           data-count-key="fluids-${esc(m.mod_id)}">… Fluids →</a>
        <a href="/catalog/machines?mod=${encodeURIComponent(m.mod_id)}" class="badge badge-neutral"
           data-count-key="machines-${esc(m.mod_id)}">… Machines →</a>
        <a href="/catalog/items?producedByMod=${encodeURIComponent(m.mod_id)}" class="badge badge-neutral"
           data-count-key="recipes-${esc(m.mod_id)}">… Recipes →</a>
      </div>`;
  }

  async function doFetch(btn) {
    const modID    = btn.dataset.modId;
    const bodyEl   = document.getElementById('mod-body-' + modID);
    const inputEl  = btn.closest('.mod-fetch-row')?.querySelector('.mod-fetch-input');
    const statusEl = document.getElementById('fetch-status-' + modID);
    if (!bodyEl || !modID) return;
    btn.disabled = true;
    if (statusEl) statusEl.textContent = '…';
    const raw       = (inputEl?.value ?? '').trim();
    const cleanSlug = raw.replace(/^https?:\/\/modrinth\.com\/mod\//, '').replace(/[/?#].*$/, '');
    const url       = '/api/mods/' + encodeURIComponent(modID) + '/modrinth-preview'
                    + (cleanSlug ? '?slug=' + encodeURIComponent(cleanSlug) : '');
    const res = await apiFetch(url);
    btn.disabled = false;

    if (res?.status === 404) { if (statusEl) statusEl.textContent = t('catalog.mods.edit.fetch_not_found'); return; }
    if (!res?.ok)             { if (statusEl) statusEl.textContent = '✗'; return; }

    const meta = await res.json();
    const mod  = allMods.find(m => m.mod_id === modID);
    if (!mod) return;

    const apply = (field, val) => { if (val) mod[field] = val; };
    apply('description',   meta.description);
    apply('author',        meta.author);
    apply('license',       meta.license);
    apply('url_source',    meta.url_source);
    apply('url_modrinth',  meta.url_modrinth);
    apply('url_wiki',      meta.url_wiki);
    apply('url_issues',    meta.url_issues);
    apply('url_discord',   meta.url_discord);
    apply('modrinth_slug', meta.modrinth_slug);

    const ok = await saveMod(mod);
    if (statusEl) statusEl.textContent = ok ? '✓' : '✗';
    if (ok) refreshExpandView(modID);
  }

  // ── Inline field editing (expand body) ──────────────────────────────────
  function attachFieldEditing(container) {
    // Fetch button
    container.querySelectorAll('.mod-fetch-btn').forEach(btn => {
      if (btn.dataset.fetchReady) return;
      btn.dataset.fetchReady = '1';
      btn.addEventListener('click', () => doFetch(btn));
    });

    // Description — multiline contenteditable. Kept hand-rolled: inline-edit.js
    // always commits on Enter (no newline support), which would break multi-line
    // editing of a free-text description. See task-5-report.md.
    container.querySelectorAll('.mod-description.field-editable').forEach(el => {
      if (el.dataset.fieldReady) return;
      el.dataset.fieldReady = '1';

      let original = '';

      el.addEventListener('click', () => {
        if (el.contentEditable === 'true') return;
        original = el.innerText;
        el.contentEditable = 'true';
        el.focus();
        const r = document.createRange();
        r.selectNodeContents(el); r.collapse(false);
        getSelection()?.removeAllRanges(); getSelection()?.addRange(r);
      });

      const commit = async () => {
        if (el.contentEditable !== 'true') return;
        el.contentEditable = 'false';
        const val = el.innerText.trim();
        const field = el.dataset.field;
        const modID = el.dataset.modId;
        const mod = allMods.find(m => m.mod_id === modID);
        if (!mod) return;
        if (val === (mod[field] ?? '')) return;
        const prev = mod[field];
        mod[field] = val || null;
        const ok = await saveMod(mod);
        if (!ok) { mod[field] = prev; el.innerText = original; }
        else refreshExpandView(modID);
      };

      el.addEventListener('blur', commit);
      el.addEventListener('keydown', e => {
        if (e.key === 'Escape') { el.innerText = original; el.contentEditable = 'false'; }
      });
    });

    // Author / license — single-line fields, use the shared inline-edit.js helper
    container.querySelectorAll('.field-editable[data-inline][data-mod-id]').forEach(el => {
      if (el.dataset.commitReady) return;
      el.dataset.commitReady = '1';
      el.addEventListener('inline-commit', async e => {
        const val = e.detail.value.trim();
        const field = el.dataset.field;
        const modID = el.dataset.modId;
        const mod = allMods.find(m => m.mod_id === modID);
        if (!mod) return;
        if (val === (mod[field] ?? '')) return;
        const prev = mod[field];
        mod[field] = val || null;
        const ok = await saveMod(mod);
        if (!ok) { mod[field] = prev; el.textContent = prev ?? ''; }
        else refreshExpandView(modID);
      });
    });
    initInlineEdit(container);

    // Link URL editing — click link to edit, "+" to add missing
    container.querySelectorAll('.mod-link-wrap').forEach(wrap => {
      if (wrap.dataset.linkReady) return;
      wrap.dataset.linkReady = '1';

      const openLinkEdit = (currentVal) => {
        const field = wrap.dataset.field;
        const modID = wrap.dataset.modId;
        wrap.innerHTML = `<input type="url" class="input mod-link-input" value="${esc(currentVal)}" />`;
        const input = wrap.querySelector('input');
        input.focus();
        if (currentVal) input.select();

        const commit = async () => {
          const newVal = input.value.trim();
          const mod = allMods.find(m => m.mod_id === modID);
          if (!mod) return;
          if (newVal === (mod[field] ?? '')) { refreshExpandView(modID); return; }
          const prev = mod[field];
          mod[field] = newVal || null;
          const ok = await saveMod(mod);
          if (!ok) mod[field] = prev;
          refreshExpandView(modID);
        };

        input.addEventListener('blur', commit);
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
          if (e.key === 'Escape') { e.stopPropagation(); refreshExpandView(wrap.closest('.table-expand-body')?.id?.replace('mod-body-', '') ?? ''); }
        });
      };

      wrap.querySelector('.mod-link-anchor')?.addEventListener('click', e => {
        e.preventDefault();
        openLinkEdit(wrap.querySelector('.mod-link-anchor').href);
      });
      wrap.querySelector('.mod-link-add')?.addEventListener('click', () => openLinkEdit(''));
    });
  }

  function refreshExpandView(modID) {
    const bodyEl = document.getElementById('mod-body-' + modID);
    if (!bodyEl) return;
    const mod = allMods.find(m => m.mod_id === modID);
    if (!mod) return;
    bodyEl.innerHTML = modBodyHTML(mod);
    applyI18n(bodyEl);
    if (admin) attachFieldEditing(bodyEl);
    updateBadges(bodyEl, modID, null);
    fetchModCounts(modID).then(counts => updateBadges(bodyEl, modID, counts));
  }

  async function fetchModCounts(modID) {
    const [machRes, itemRes, fluidRes] = await Promise.all([
      apiFetch('/api/mods/' + encodeURIComponent(modID) + '/machines'),
      apiFetch('/api/mods/' + encodeURIComponent(modID) + '/items'),
      apiFetch('/api/mods/' + encodeURIComponent(modID) + '/fluids'),
    ]);
    return {
      machines: machRes?.ok ? (await machRes.json()).length : '?',
      items:    itemRes?.ok  ? (await itemRes.json()).length  : '?',
      fluids:   fluidRes?.ok ? (await fluidRes.json()).length : '?',
    };
  }

  function updateBadges(bodyEl, modID, counts) {
    const get = (key, n, tpl) => {
      const el = bodyEl.querySelector(`[data-count-key="${key}"]`);
      if (el) el.textContent = n === null ? '… ' + tpl.split('{n}')[1] : t(tpl).replace('{n}', n);
    };
    get('items-'    + modID, counts?.items,    'catalog.mods.detail.items');
    get('fluids-'   + modID, counts?.fluids,   'catalog.mods.detail.fluids');
    get('machines-' + modID, counts?.machines, 'catalog.mods.detail.machines');
    get('recipes-'  + modID, counts ? '…' : null, 'catalog.mods.detail.recipes');
  }

  // ── Events ──────────────────────────────────────────────────────────────

  // Table expand
  document.addEventListener('click', async e => {
    const trigger = e.target.closest('.table-expand-trigger');
    if (!trigger) return;
    const rowID = trigger.dataset.expand;
    const row   = rowID && document.getElementById(rowID);
    if (!row) return;

    const nowOpen = row.classList.toggle('open');
    trigger.classList.toggle('open', nowOpen);
    if (!nowOpen) return;

    const modID  = rowID.replace(/^mod-/, '');
    const bodyEl = document.getElementById('mod-body-' + modID);
    if (!bodyEl) return;

    const mod = allMods.find(m => m.mod_id === modID);
    if (!mod) return;
    bodyEl.innerHTML = modBodyHTML(mod);
    applyI18n(bodyEl);
    if (admin) attachFieldEditing(bodyEl);

    const counts = await fetchModCounts(modID);
    updateBadges(bodyEl, modID, counts);
  });

  // Name inline-edit (wui:cell-write from initClickToEdit)
  document.addEventListener('wui:cell-write', async e => {
    if (e.detail.field !== 'name') return;
    const row   = e.detail.row;
    const modID = row?.dataset.modId;
    if (!modID) return;
    const mod = allMods.find(m => m.mod_id === modID);
    if (!mod) return;
    const prev     = mod.name;
    mod.name       = e.detail.value;
    const ok       = await saveMod(mod);
    if (!ok) { mod.name = prev; const valEl = row.querySelector('.td-val'); if (valEl) valEl.textContent = prev; }
  });

  searchEl.addEventListener('input', renderMods);

  const res = await apiFetch('/api/mods');
  if (res?.ok) {
    allMods = await res.json();
    renderMods();
    new WuiAutocomplete({
      inputEl:   searchEl,
      dropEl:    document.getElementById('mod-search-ac'),
      primary:   r => r.name,
      secondary: r => r.mod_id,
      fetch(q, offset) {
        let rows = allMods;
        rows = wuiFilter(allMods, q, ['mod_id', 'name', 'modrinth_slug']);
        return Promise.resolve({ rows: rows.slice(offset, offset + 50), hasMore: offset + 50 < rows.length });
      },
      onSelect(r) { searchEl.value = r.name; searchEl.dispatchEvent(new Event('input')); },
    });
  }
</script>
</body>
</html>
