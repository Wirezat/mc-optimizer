<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MC Optimizer — Items</title>
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/accent.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <link rel="stylesheet" href="/static/css/layout.css" />
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/utils.js"></script>
  <script>
    (function(){
      const s = localStorage.getItem('theme');
      if (s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark');
    })();
  </script>
  <style>
    .catalog-search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .catalog-search-bar input {
      flex: 1;
      max-width: 420px;
    }
    .catalog-count {
      font-size: var(--text-xs);
      color: var(--text-faint);
      white-space: nowrap;
    }

    /* ── Mod group ── */
    .item-group { margin-bottom: 12px; }
    .item-group-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 6px 14px;
      background: var(--bg-page);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      font-size: var(--text-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-faint);
    }
    .item-group-name { color: var(--text-muted); font-size: var(--text-sm); font-weight: 600; text-transform: none; letter-spacing: 0; }
    .item-group-count {
      margin-left: auto;
      font-weight: 400;
      font-size: var(--text-xs);
    }
    .item-group-body {
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
      background: var(--bg-card);
      overflow: hidden;
    }
    .item-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 6px 14px;
      border-bottom: 1px solid var(--border);
      font-size: var(--text-sm);
    }
    .item-row:last-child { border-bottom: none; }
    .item-row-name { flex: 0 0 auto; min-width: 160px; }
    .item-row-id {
      font-family: var(--mono);
      font-size: var(--text-xs);
      color: var(--text-faint);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .item-row-stack {
      font-size: var(--text-xs);
      color: var(--text-muted);
      white-space: nowrap;
    }
    .catalog-empty {
      padding: 32px;
      text-align: center;
      color: var(--text-faint);
      font-size: var(--text-sm);
    }

  </style>
</head>
<body>
<div class="app-shell">

  <header class="header">
    <a class="header-brand" href="/saves">
      <div class="header-logo">⚙️</div>
      <span>MC Optimizer</span>
    </a>
    <div class="header-right">
      <button class="btn btn-ghost btn-sm" onclick="toggleTheme()" id="theme-btn">🌙</button>
      <div class="user-menu" id="user-menu">
        <button class="user-menu-trigger" id="user-menu-trigger">
          <div class="avatar">?</div>
          <span class="username">…</span>
          <span class="chevron">▾</span>
        </button>
        <div class="user-dropdown" id="user-dropdown"></div>
      </div>
    </div>
  </header>

  <div class="app-body">
    <nav class="sidebar"></nav>

    <main class="main">
      <div class="page">

        <div class="page-header">
          <div>
            <div class="page-title">Items &amp; Fluids</div>
            <div class="page-subtitle">Browse all registered resources</div>
          </div>
        </div>

        <nav class="tabs-bar" id="tabs">
          <button class="tab-btn active" data-tab="items">Items</button>
          <button class="tab-btn" data-tab="fluids">Fluids</button>
        </nav>

        <!-- ══ Tab: Items ══════════════════════════════════════════════════════ -->
        <div class="tab-panel active" id="panel-items">
          <div class="catalog-search-bar">
            <input class="form-input" id="item-search" placeholder="Search by name or ID…"
              oninput="_scheduleItemSearch()" autocomplete="off" />
            <span class="catalog-count" id="item-count"></span>
          </div>
          <div id="item-list"><div class="catalog-empty">Loading…</div></div>
        </div>

        <!-- ══ Tab: Fluids ═════════════════════════════════════════════════════ -->
        <div class="tab-panel" id="panel-fluids">
          <div class="catalog-search-bar">
            <input class="form-input" id="fluid-search" placeholder="Search by name or ID…"
              oninput="_scheduleFluidSearch()" autocomplete="off" />
            <span class="catalog-count" id="fluid-count"></span>
          </div>
          <div id="fluid-list"><div class="catalog-empty">Loading…</div></div>
        </div>

      </div>
    </main>
  </div>
</div>

<script>
  Auth.guard();
  Header.init();

  let _mods   = [];
  let _items  = [];
  let _fluids = [];

  const _scheduleItemSearch  = Utils.debounce(() => loadItems(document.getElementById('item-search').value.trim()));
  const _scheduleFluidSearch = Utils.debounce(() => loadFluids(document.getElementById('fluid-search').value.trim()));

  // ── Tabs ──────────────────────────────────────────────
  document.getElementById('tabs').addEventListener('click', e => {
    const tab = e.target.closest('.tab-btn');
    if (!tab) return;
    document.querySelectorAll('#tabs .tab-btn').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });

  // ── Init ──────────────────────────────────────────────
  async function init() {
    const modsRes = await Auth.apiFetch('/api/mods');
    if (modsRes && modsRes.ok) _mods = await modsRes.json();
    loadItems('');
    loadFluids('');
  }

  // ── Items ──────────────────────────────────────────────
  async function loadItems(q) {
    document.getElementById('item-list').innerHTML = '<div class="catalog-empty">Loading…</div>';
    const res = await Auth.apiFetch('/api/items?q=' + encodeURIComponent(q));
    if (!res || !res.ok) { document.getElementById('item-list').innerHTML = '<div class="catalog-empty">Error loading items</div>'; return; }
    _items = await res.json();
    renderItems();
  }

  function renderItems() {
    const list = document.getElementById('item-list');
    document.getElementById('item-count').textContent = _items.length + ' item' + (_items.length !== 1 ? 's' : '');
    if (!_items.length) { list.innerHTML = '<div class="catalog-empty">No items found</div>'; return; }
    Utils.suggestions(document.getElementById('item-search'),
      [...new Set(_items.map(i => i.name).filter(Boolean))].sort());
    list.innerHTML = groupByMod(_items, 'item_id', i =>
      `<div class="item-row">
        <span class="item-row-name">${esc(i.name)}</span>
        <span class="item-row-id">${esc(i.item_id)}</span>
        <span class="item-row-stack">${i.max_stack}×</span>
      </div>`
    );
  }

  // ── Fluids ─────────────────────────────────────────────
  async function loadFluids(q = '') {
    document.getElementById('fluid-list').innerHTML = '<div class="catalog-empty">Loading…</div>';
    const res = await Auth.apiFetch('/api/fluids?q=' + encodeURIComponent(q));
    if (!res || !res.ok) { document.getElementById('fluid-list').innerHTML = '<div class="catalog-empty">Error loading fluids</div>'; return; }
    _fluids = await res.json();
    renderFluids();
  }

  function renderFluids() {
    const list = document.getElementById('fluid-list');
    document.getElementById('fluid-count').textContent = _fluids.length + ' fluid' + (_fluids.length !== 1 ? 's' : '');
    if (!_fluids.length) { list.innerHTML = '<div class="catalog-empty">No fluids found</div>'; return; }
    Utils.suggestions(document.getElementById('fluid-search'),
      [...new Set(_fluids.map(f => f.name).filter(Boolean))].sort());
    list.innerHTML = groupByMod(_fluids, 'fluid_id', f =>
      `<div class="item-row">
        <span class="item-row-name">${esc(f.name)}</span>
        <span class="item-row-id">${esc(f.fluid_id)}</span>
      </div>`
    );
  }

  // ── Shared helpers ─────────────────────────────────────
  function groupByMod(entries, idKey, rowFn) {
    const byMod = {};
    entries.forEach(e => {
      if (!byMod[e.mod_id]) byMod[e.mod_id] = [];
      byMod[e.mod_id].push(e);
    });
    return Object.entries(byMod).map(([modID, rows]) => {
      const mod = _mods.find(m => m.mod_id === modID);
      const modName = mod?.name || modID;
      return `<div class="item-group">
        <div class="item-group-header">
          <span class="item-group-name">${esc(modName)}</span>
          <span style="font-family:var(--mono);font-size:var(--text-xs);color:var(--text-faint);text-transform:none;letter-spacing:0;">${esc(modID)}</span>
          <span class="item-group-count">${rows.length}</span>
        </div>
        <div class="item-group-body">${rows.map(rowFn).join('')}</div>
      </div>`;
    }).join('');
  }

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function toggleTheme() {
    const dark = document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', dark ? 'dark' : 'light');
    document.getElementById('theme-btn').textContent = dark ? '☀️' : '🌙';
  }
  document.getElementById('theme-btn').textContent =
    document.documentElement.classList.contains('dark') ? '☀️' : '🌙';

  init();
</script>
</body>
</html>
