<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MC Optimizer — Admin Settings</title>
  <link rel="stylesheet" href="/static/ui/index.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <script>
    (function(){
      const s = localStorage.getItem('theme');
      if (s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark');
    })();
  </script>
  <style>
    /* ── Section card ──────────────────────────────────────────────────────── */
    .admin-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      max-width: 760px;
      margin-bottom: var(--gap-section);
    }
    .admin-card-header {
      padding: var(--gap-control) var(--pad-card);
      border-bottom: 1px solid var(--border);
      font-size: var(--text-xs);
      font-weight: var(--weight-bold);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-faint);
    }
    .admin-card-body {
      padding: var(--gap-control) var(--pad-card);
    }

    /* ── Setting row (checkbox + label) ───────────────────────────────────── */
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--gap-control) 0;
      border-bottom: 1px solid var(--border);
      gap: var(--pad-card);
    }
    .setting-row:last-of-type { border-bottom: none; }
    .setting-label {
      font-size: var(--text-sm);
      font-weight: var(--weight-semibold);
      color: var(--text);
      cursor: pointer;
    }
    .setting-desc {
      font-size: var(--text-xs);
      color: var(--text-faint);
      margin-top: 2px;
    }
    .setting-cb {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      cursor: pointer;
      accent-color: var(--accent);
    }

    /* ── Role badge ───────────────────────────────────────────────────────── */
    .role-badge {
      display: inline-block;
      padding: 2px var(--gap-inline);
      border-radius: var(--radius-pill);
      font-size: var(--text-xs);
      font-weight: var(--weight-bold);
      text-transform: uppercase;
    }
    .role-owner { background: var(--accent-muted); color: var(--accent); }
    .role-admin { background: rgba(59,130,246,0.12); color: #2563eb; }
    .role-user  { background: var(--bg); color: var(--text-faint); border: 1px solid var(--border); }

    /* ── Admin checkbox ───────────────────────────────────────────────────── */
    .admin-cb {
      width: 15px;
      height: 15px;
      cursor: pointer;
      accent-color: var(--accent);
    }
    .admin-cb:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Status msg ───────────────────────────────────────────────────────── */
    .status-msg     { font-size: var(--text-sm); min-height: 1.2em; display: block; }
    .status-msg.ok  { color: var(--success); }
    .status-msg.err { color: var(--danger); }
  </style>
</head>
<body class="app-shell">

  <!-- ── Header ── -->
  <header class="header">
    <a class="header-brand" href="/saves">
      <div class="header-logo">⚙️</div>
      <span>MC Optimizer</span>
    </a>
    <div class="header-right">
      <button data-wui-theme data-i18n-title="common.toggle_theme"></button>
      <div class="dropdown-wrap" data-wui-lang>
        <button data-dropdown-trigger></button>
        <div class="dropdown-panel">
          <button class="dropdown-item" data-lang="en">🇬🇧 English</button>
          <button class="dropdown-item" data-lang="de">🇩🇪 Deutsch</button>
        </div>
      </div>
      <div class="dropdown-wrap" data-wui-user-menu>
        <button class="user-menu-trigger" data-wui-user-trigger data-dropdown-trigger>
          <div class="avatar">?</div>
          <span class="username">…</span>
          <span class="chevron">▾</span>
        </button>
        <div class="dropdown-panel" data-wui-user-dropdown></div>
      </div>
    </div>
  </header>

  <div class="app-body">
    <nav class="sidebar"></nav>

    <main class="main">
      <div class="page">

        <div class="page-header">
          <div>
            <div class="page-title" data-i18n="admin.settings.title"></div>
            <div class="page-subtitle" data-i18n="admin.settings.subtitle"></div>
          </div>
        </div>

        <!-- Access & Registration -->
        <div class="admin-card">
          <div class="admin-card-header" data-i18n="admin.settings.section.access"></div>
          <div class="admin-card-body">
            <div class="setting-row">
              <label for="reg-toggle">
                <div class="setting-label" data-i18n="admin.settings.reg_allow"></div>
                <div class="setting-desc" data-i18n="admin.settings.reg_allow_desc"></div>
              </label>
              <input type="checkbox" class="setting-cb" id="reg-toggle" />
            </div>
            <span class="status-msg" id="save-status" style="margin-top:var(--gap-inline);"></span>
          </div>
        </div>

        <!-- User Management -->
        <div class="admin-card">
          <div class="admin-card-header" data-i18n="admin.settings.section.users"></div>
          <table class="table" id="users-table">
            <thead>
              <tr>
                <th data-i18n="admin.users.col.username"></th>
                <th data-i18n="admin.users.col.role"></th>
                <th data-i18n="admin.users.col.registered"></th>
                <th>Admin</th>
                <th id="th-transfer" hidden></th>
                <th></th>
              </tr>
            </thead>
            <tbody id="users-tbody">
              <tr class="table-placeholder-row"><td colspan="6" data-i18n="common.loading"></td></tr>
            </tbody>
          </table>
          <span class="status-msg" id="users-status" style="display:block;padding:var(--gap-inline) var(--pad-card) var(--gap-control);"></span>
        </div>

      </div>
    </main>
  </div>

<script type="module">
  import { guard, apiFetch, getUser } from '/static/ui/js/auth.js';
  import { load, applyI18n, getLang, t, esc } from '/static/js/i18n.js';
  import { init as initHeader } from '/static/js/header.js';

  await load(getLang());
  applyI18n();
  guard();
  initHeader();

  let _me = null;

  async function init() {
    _me = await getUser();
    if (!_me || !_me.is_admin) { window.location.href = '/personal'; return; }
    if (_me.is_owner) document.getElementById('th-transfer').hidden = false;
    loadSettings();
    loadUsers();
  }

  async function loadSettings() {
    try {
      const res = await apiFetch('/api/admin/settings');
      if (!res || !res.ok) throw new Error('Failed');
      applySettings(await res.json());
    } catch(e) {
      setStatus('save-status', t('msg.load_error'), 'err');
    }
  }

  function applySettings(d) {
    document.getElementById('reg-toggle').checked = !!d.registration_enabled;
  }

  document.getElementById('reg-toggle').addEventListener('change', function() {
    saveSetting('registration_enabled', this.checked);
  });

  async function saveSetting(key, value) {
    setStatus('save-status', t('msg.saving'), '');
    try {
      const res = await apiFetch('/api/admin/settings', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ [key]: value }),
      });
      if (!res || !res.ok) throw new Error('Failed');
      applySettings(await res.json());
      setStatus('save-status', t('msg.saved'), 'ok');
      setTimeout(() => setStatus('save-status', '', ''), 2000);
    } catch(e) {
      setStatus('save-status', t('msg.save_error'), 'err');
      const tog = document.getElementById('reg-toggle');
      tog.checked = !tog.checked;
    }
  }

  let _users = [];

  async function loadUsers() {
    try {
      const res = await apiFetch('/api/admin/users');
      if (!res || !res.ok) throw new Error('Failed');
      _users = await res.json();
      renderUsers();
    } catch(e) {
      document.getElementById('users-tbody').innerHTML =
        `<tr class="table-empty-row"><td colspan="6" style="color:var(--danger)">${t('msg.load_error')}</td></tr>`;
    }
  }

  function renderUsers() {
    const tbody = document.getElementById('users-tbody');
    if (!_users.length) {
      tbody.innerHTML = `<tr class="table-empty-row"><td colspan="6">${t('admin.users.empty')}</td></tr>`;
      return;
    }
    const viewerIsOwner = _me?.is_owner ?? false;
    tbody.innerHTML = _users.map(u => {
      let roleBadge = '';
      if (u.is_owner) roleBadge += '<span class="role-badge role-owner">Owner</span> ';
      if (u.is_admin) roleBadge += `<span class="role-badge role-admin">${t('header.role_admin')}</span>`;
      if (!u.is_owner && !u.is_admin) roleBadge = `<span class="role-badge role-user">${t('header.role_user')}</span>`;
      const date = u.created_at ? u.created_at.slice(0,10) : '—';
      const transferCell = viewerIsOwner
        ? (u.is_owner || u.id === _me.id ? '<td></td>'
          : `<td><button class="btn btn-ghost btn-sm transfer-btn" data-uid="${esc(u.id)}" data-uname="${esc(u.username)}" style="color:var(--danger);font-size:var(--text-xs);">${t('admin.users.transfer_owner')}</button></td>`)
        : '';
      const canDelete = !u.is_owner && u.id !== _me?.id;
      const deleteCell = canDelete
        ? `<td><button class="btn btn-ghost btn-sm delete-btn" data-uid="${esc(u.id)}" data-uname="${esc(u.username)}" title="${esc(t('admin.users.delete_title'))}" aria-label="${esc(t('admin.users.delete_title'))}" style="color:var(--text-faint);">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="2,4 14,4"/><path d="M5,4V2h6v2"/><path d="M3,4l1,10h8l1-10"/>
            </svg>
           </button></td>`
        : '<td></td>';
      return `<tr>
        <td><input class="input user-name-input" style="width:140px;" data-uid="${esc(u.id)}" data-owner="${u.is_owner}" value="${esc(u.username)}"></td>
        <td>${roleBadge}</td>
        <td class="td-faint">${esc(date)}</td>
        <td><input type="checkbox" class="admin-cb" data-uid="${esc(u.id)}" ${u.is_admin ? 'checked' : ''} ${u.is_owner ? 'disabled' : ''}></td>
        ${transferCell}
        ${deleteCell}
      </tr>`;
    }).join('');

    tbody.querySelectorAll('.user-name-input').forEach(input => {
      input.addEventListener('blur', () => saveUsername(input.dataset.uid));
    });
    tbody.querySelectorAll('.admin-cb:not(:disabled)').forEach(cb => {
      cb.addEventListener('change', () => toggleAdmin(cb.dataset.uid, cb.checked));
    });
    tbody.querySelectorAll('.transfer-btn').forEach(btn => {
      btn.addEventListener('click', () => transferOwnership(btn.dataset.uid, btn.dataset.uname));
    });
    tbody.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteUser(btn.dataset.uid, btn.dataset.uname));
    });
  }

  async function transferOwnership(userID, username) {
    if (!confirm(t('admin.users.transfer_confirm').replace('{name}', username))) return;
    try {
      const res = await apiFetch(`/api/admin/users/${userID}/owner`, { method: 'PUT' });
      if (!res || !res.ok) throw new Error('Failed');
      await loadUsers();
      setStatus('users-status', t('admin.users.transfer_done'), 'ok');
      setTimeout(() => setStatus('users-status', '', ''), 3000);
    } catch(e) {
      setStatus('users-status', t('msg.save_error'), 'err');
    }
  }

  async function deleteUser(userID, username) {
    if (!confirm(t('admin.users.delete_confirm').replace('{name}', username))) return;
    try {
      const res = await apiFetch(`/api/admin/users/${userID}`, { method: 'DELETE' });
      if (!res || !res.ok) throw new Error('Failed');
      _users = _users.filter(u => u.id !== userID);
      renderUsers();
      setStatus('users-status', t('admin.users.delete_done'), 'ok');
      setTimeout(() => setStatus('users-status', '', ''), 2000);
    } catch(e) {
      setStatus('users-status', t('msg.save_error'), 'err');
    }
  }

  async function toggleAdmin(userID, isAdmin) {
    try {
      const res = await apiFetch(`/api/admin/users/${userID}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ is_admin: isAdmin }),
      });
      if (!res || !res.ok) throw new Error('Failed');
      const u = _users.find(x => x.id === userID);
      if (u) u.is_admin = isAdmin;
      renderUsers();
      setStatus('users-status', t('msg.saved'), 'ok');
      setTimeout(() => setStatus('users-status', '', ''), 2000);
    } catch(e) {
      setStatus('users-status', t('msg.save_error'), 'err');
      const cb = document.querySelector(`.admin-cb[data-uid="${CSS.escape(userID)}"]`);
      if (cb) cb.checked = !isAdmin;
    }
  }

  async function saveUsername(userID) {
    const input = document.querySelector(`.user-name-input[data-uid="${CSS.escape(userID)}"]`);
    if (!input) return;
    const newName = input.value.trim();
    const isOwner = input.dataset.owner === 'true';
    const original = _users.find(x => x.id === userID)?.username ?? '';
    if (!newName) { setStatus('users-status', t('msg.name_required'), 'err'); input.value = original; return; }
    if (newName === original) return;
    try {
      let res, updatedName;
      if (isOwner) {
        res = await apiFetch('/api/me/username', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ new_username: newName }),
        });
        if (!res || !res.ok) { const e = await res?.json(); throw new Error(e?.message || 'Failed'); }
        updatedName = newName;
      } else {
        res = await apiFetch(`/api/admin/users/${userID}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: newName }),
        });
        if (!res || !res.ok) { const e = await res?.json(); throw new Error(e?.message || 'Failed'); }
        updatedName = (await res.json()).username;
      }
      const idx = _users.findIndex(x => x.id === userID);
      if (idx >= 0) _users[idx] = { ..._users[idx], username: updatedName };
      renderUsers();
      setStatus('users-status', t('msg.saved'), 'ok');
      setTimeout(() => setStatus('users-status', '', ''), 2000);
    } catch(e) {
      input.value = original;
      setStatus('users-status', e.message || t('msg.save_error'), 'err');
    }
  }

  function setStatus(id, msg, type) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = 'status-msg' + (type ? ' ' + type : '');
  }


  init();
</script>
</body>
</html>
